<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dolomites Danube Quest</title>
<meta name="description" content="Interactive map and day-by-day plan: Dolomites, Austria and Hungary, November 2026.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* Layout: a field guide. Sticky OpenStreetMap map beside a scrolling day-by-day log, reference tabs below. */
:root{
  --bg:#FFFFFF; --bg-2:#F5F5F7; --card:#FFFFFF; --line:#E3E3E7; --line-soft:#EFEFF2;
  --ink:#171717; --ink-2:#6B6B70; --ink-3:#A1A1A6;
  --gold:#6C63F0; --accent:#6C63F0; --on-accent:#FFFFFF;
  --route:#6C63F0; --rail:#171717; --tie:#FFFFFF; --bus:#E05A9C; --flight:#3E7FC1;
  --pin:#FFFFFF; --pin-ink:#171717; --pin-ring:#6C63F0;
  --ok:#1E9E4A; --warn:#B7791F; --bad:#E5484D; --info:#3E7FC1;
  --shadow:0 1px 1px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.12);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-sc:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121214; --bg-2:#1B1B1F; --card:#1E1E22; --line:#2E2E34; --line-soft:#26262B;
  --ink:#F2F2F4; --ink-2:#A1A1A9; --ink-3:#6B6B72;
  --gold:#8F88FF; --accent:#8F88FF; --on-accent:#0E0E12;
  --route:#8F88FF; --rail:#F2F2F4; --tie:#121214; --bus:#F07AB6; --flight:#7FA8D8;
  --pin:#1E1E22; --pin-ink:#F2F2F4; --pin-ring:#8F88FF;
  --ok:#4ACB7A; --warn:#E5B04B; --bad:#FF6B6F; --info:#7FA8D8; --shadow:0 1px 1px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121214; --bg-2:#1B1B1F; --card:#1E1E22; --line:#2E2E34; --line-soft:#26262B;
  --ink:#F2F2F4; --ink-2:#A1A1A9; --ink-3:#6B6B72;
  --gold:#8F88FF; --accent:#8F88FF; --on-accent:#0E0E12;
  --route:#8F88FF; --rail:#F2F2F4; --tie:#121214; --bus:#F07AB6; --flight:#7FA8D8;
  --pin:#1E1E22; --pin-ink:#F2F2F4; --pin-ring:#8F88FF;
  --ok:#4ACB7A; --warn:#E5B04B; --bad:#FF6B6F; --info:#7FA8D8; --shadow:0 1px 1px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.45);
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sc{font-family:var(--f-sc);letter-spacing:.06em}
.eyebrow{font:600 12px var(--f-sc);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink-2)}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:30px;height:30px;color:var(--gold);flex:none}
.brand b{font:700 17px var(--f-display);display:block}
.brand small{font:500 13px var(--f-sc);color:var(--ink-2)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg-2);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;cursor:pointer;font:600 14px var(--f-sc);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.14)}
.ctl{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--f-sc);color:var(--ink-2)}
select{font:600 14px var(--f-sc);color:var(--ink);background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg-2);border-radius:10px;cursor:pointer}
.iconbtn svg{width:18px;height:18px}

.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;padding-block:8px 18px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(30px,4.4vw,52px);line-height:1.04;letter-spacing:-.03em}
.hero p.lead{margin:10px 0 0;font-size:19px;color:var(--ink-2);max-width:62ch}
.route-line{margin-top:12px;font:500 14.5px var(--f-sc);color:var(--ink-2)}
.route-line b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);background:var(--bg-2);padding:12px 14px;border-radius:14px}
.stat .v{font:700 20px var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .l{font:500 13px var(--f-sc);color:var(--ink-2)}
.alerts{display:grid;gap:8px;margin-top:14px}
.alert{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:12px;font-size:15px}
.alert svg{width:20px;height:20px;color:var(--warn);margin-top:2px}
.alert b{font-weight:600}

.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;padding-block:20px}
.mapcol{position:sticky;top:12px;height:calc(100vh - 24px);height:calc(100dvh - 24px);min-height:460px}
.mapwrap{position:relative;height:100%;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#EFEEF4}
#map{position:absolute;inset:0}
.chips{position:absolute;top:10px;left:10px;right:60px;display:flex;flex-wrap:wrap;gap:6px;z-index:3}
.chip{border:0;background:var(--card);border-radius:999px;padding:6px 12px;font:600 13px var(--f-sc);cursor:pointer;color:var(--ink);box-shadow:0 1px 1px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.12)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;flex-wrap:wrap;gap:4px 12px;background:color-mix(in srgb,var(--card) 94%,transparent);border-radius:10px;padding:6px 10px;font:500 12.5px var(--f-sc);color:var(--ink-2);box-shadow:0 1px 1px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.10)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:3.5px solid var(--route)}
.legend i.tr{border-top:4px solid var(--rail);position:relative}
.legend i.tr::after{content:"";position:absolute;left:0;right:0;top:-3.2px;border-top:1.6px dashed var(--tie)}
.legend i.bus{border-top:3.5px dashed var(--bus)}
.legend i.fl{border-top:3px dotted var(--flight)}
.maplibregl-ctrl-group{background:var(--card)!important;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.12)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:var(--ctl-filter,none)}
:root[data-theme="dark"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}}

/* pins: Oyenza's map language (white circle, coloured ring, emoji, lavender count badge, white label pill) */
.pin{width:36px;height:36px;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.pin .in{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .15s}
.pin .hd{position:absolute;inset:0;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px var(--c,#6C63F0),0 4px 12px rgba(16,24,40,.22);display:grid;place-items:center}
.pin .em{font-size:18px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;user-select:none}
.pin .n{position:absolute;top:-7px;right:-9px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:#6C63F0;color:#fff;font:700 11.5px/20px var(--f-body);text-align:center;box-shadow:0 0 0 2px #fff;display:none;font-variant-numeric:tabular-nums}
.pin .lb{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);padding:2px 8px;border-radius:7px;background:rgba(255,255,255,.96);box-shadow:0 2px 6px rgba(16,24,40,.16);white-space:nowrap;font:600 12px/1.3 var(--f-body);color:#171717;pointer-events:none}
.pin.side{width:30px;height:30px}
.pin.side .em{font-size:15px}
.pin.side .hd{box-shadow:0 0 0 2px var(--c,#6C63F0),0 3px 8px rgba(16,24,40,.18)}
.pin.sealed .hd{filter:grayscale(1);opacity:.85}
.pin.on .n{display:block}
.pin.on .hd{box-shadow:0 0 0 3px var(--c,#6C63F0),0 0 0 6px rgba(255,255,255,.9),0 6px 16px rgba(16,24,40,.26)}
.pin.sel .in{transform:scale(1.18)}
.pin.sel .hd{box-shadow:0 0 0 3px #6C63F0,0 0 0 7px rgba(255,255,255,.95),0 8px 20px rgba(16,24,40,.30)}
.pin:hover .in{transform:scale(1.1)}
.pin:focus-visible .hd{outline:2px solid #6C63F0;outline-offset:5px}
.has-day .pin:not(.on):not(.sel){opacity:.45}
.pin.nolb .lb{display:none}
.pin:hover .lb{display:block}
.pin.hide{display:none}

.card{position:absolute;left:10px;bottom:48px;z-index:4;width:min(410px,calc(100% - 20px));max-height:calc(100% - 100px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:0 1px 1px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.22);padding:18px 18px 16px}
.card .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;background:none;cursor:pointer;font-size:22px;line-height:1;color:var(--ink-2)}
.card h3{font-size:20px;line-height:1.2;padding-right:28px}
.card .alt{font-style:italic;color:var(--ink-2);font-size:15px}
.card .epi{font:600 12px var(--f-sc);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font:600 12.5px var(--f-sc);border:1px solid var(--line);color:var(--ink-2);background:var(--bg-2);white-space:nowrap}
.pill.st-open{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.pill.st-limited,.pill.st-weather{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.pill.st-sealed{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.kv{display:grid;gap:9px;margin-top:6px}
.kv div{font-size:15.5px}
.kv b{display:block;font:600 12px var(--f-sc);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kv .lore{font-style:italic;color:var(--ink-2)}
.kv .danger b{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);border-radius:10px;padding:7px 13px;font:600 14px var(--f-sc);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}

.listcol h2{font-size:24px;margin-bottom:4px}
.act{margin-top:18px;padding-top:8px}
.act .eyebrow{display:block}
.act h3{font-size:18px;margin:2px 0 6px;color:var(--ink)}
.day{border-top:1px solid var(--line)}
.day-h{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 2px;cursor:pointer}
.dn{width:36px;height:36px;margin-left:4px;display:grid;place-items:center;border-radius:50%;background:var(--bg-2);border:1px solid var(--line)}
.dn span{font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.day.open .dn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dt{display:block;font:650 17px var(--f-display);line-height:1.25}
.dm{display:block;font:500 14px var(--f-sc);color:var(--ink-2)}
.dprog{font:700 13px var(--f-sc);color:var(--ink-3);font-variant-numeric:tabular-nums}
.day-b{display:none;padding:0 2px 18px 58px}
.day.open .day-b{display:block}
.day-b .epi{font:600 12px var(--f-sc);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.day-b p{margin:6px 0 10px}
.warn{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:9px 11px;margin:8px 0;border-radius:12px;background:color-mix(in srgb,var(--warn) 10%,transparent);font-size:14.5px}
.warn.bad{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.warn svg{width:18px;height:18px;color:var(--warn);margin-top:2px}
.warn.bad svg{color:var(--bad)}
.objs{list-style:none;margin:10px 0 6px;padding:0;display:grid;gap:7px}
.obj{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.obj .chk{width:24px;height:24px;margin-top:1px;border:1.5px solid var(--ink-3);border-radius:50%;background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0}
.obj .chk svg{width:16px;height:16px;color:var(--on-accent);display:none}
.obj.done .chk{background:var(--ok);border-color:var(--ok)}
.obj.done .chk svg{display:block}
.obj .go{display:block;text-align:left;background:none;border:0;padding:0;cursor:pointer;width:100%}
.obj .nm{font:600 15.5px var(--f-sc)}
.obj .nm small{font:inherit;color:var(--accent);margin-right:6px}
.obj .note{display:block;font-size:14.5px;color:var(--ink-2);margin-top:2px}
.obj.done .nm{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.subh{font:600 12px var(--f-sc);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 4px}
.sides{display:flex;flex-wrap:wrap;gap:6px}
.tips{margin:4px 0 0;padding-left:18px;font-size:15.5px}
.tips li{margin:3px 0}
.restline{font-size:15.5px}

.section{padding-block:28px;border-top:1px solid var(--line)}
.section h2{font-size:clamp(24px,3vw,32px)}
.section .lead{color:var(--ink-2);max-width:72ch;margin:8px 0 16px;font-size:17.5px}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;background:var(--card);padding:18px;border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.verdict .seal{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 19px var(--f-display)}
.verdict h3{font-size:22px}
.verdict p{margin:6px 0 0}
.tablewrap{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:15.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font:600 12px var(--f-sc);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--bg-2)}
tr.win td{background:color-mix(in srgb,var(--ok) 9%,transparent)}
td .score{font:700 14px var(--f-sc);font-variant-numeric:tabular-nums}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.tab{border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:7px 14px;font:600 14px var(--f-sc);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.beast{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px}
.beast h4{margin:0;font:650 16.5px var(--f-display)}
.beast .real{font:500 13px var(--f-sc);color:var(--ink-2)}
.threat{display:inline-flex;gap:3px;margin:6px 0}
.threat i{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--bad);display:inline-block}
.threat i.f{background:var(--bad)}
.beast p{margin:6px 0 0;font-size:15.5px}
.beast .when{font-size:14px;color:var(--ink-2)}
.pack{columns:3 260px;column-gap:24px}
.pack .grp{break-inside:avoid;margin-bottom:16px}
.pack h4{margin:0 0 6px;font:600 14px var(--f-sc);color:var(--ink)}
.pack label{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:4px 0;font-size:15.5px;cursor:pointer}
.pack input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok)}
.pack small{display:block;color:var(--ink-2);font-size:14px}
.calc{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.total{font:700 30px var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bars{display:grid;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:15px}
.bar .tr{height:10px;background:var(--bg-2);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--gold)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-sc);font-weight:700}
.visa-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.nights{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.nights span{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font:600 14px var(--f-sc);background:var(--bg-2)}
.nights span.max{border-color:var(--accent);color:var(--accent)}
.note-card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px}
.note-card h4{margin:0 0 6px;font:650 16px var(--f-display)}
.note-card p{margin:6px 0;font-size:15.5px}
.note-card ul{margin:6px 0;padding-left:18px;font-size:15.5px}
footer{padding-block:24px 40px;color:var(--ink-2);font-size:14.5px;border-top:1px solid var(--line)}

@media (max-width: 960px){
  .hero{grid-template-columns:1fr}
  .layout{grid-template-columns:1fr}
  .mapcol{position:relative;top:0;height:64vh;height:64dvh;min-height:380px}
  .day-b{padding-left:4px}
}
@media (max-width: 520px){
  body{font-size:16.5px}
  .bar{grid-template-columns:96px minmax(0,1fr) 84px}
  .chips{right:52px}
  .chip{padding:3px 9px;font-size:12.5px}
  .legend{display:none}
  .card{bottom:10px}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.pin .dot{transition:none}}
</style>
</head>

<script>window.__DATA__={"sites":{"ams":{"name":"Amsterdam Schiphol (AMS)","alt":"Luchthaven Schiphol","type":"airport","country":"NL","region":"Haarlemmermeer · North Holland","ll":[4.7622,52.3096],"status":{"code":"open","text":"KLM and easyJet fly direct to Venice (VCE), about 1 h 40 min."},"epithet":"The Gate Below the Sea","lore":"You land below sea level, partly on the bed of a drained lake, the Haarlemmermeer. Its storms once ate farmland, and in 1573 Spanish and Dutch rebel fleets fought a battle on its water. Three steam pumping engines drained it dry between 1848 and 1852.","quest":"This is your Schengen entry point. Clear passport control here, with the EU's biometric Entry/Exit System check (fingerprints and photo) on first entry. Then walk to the Schengen piers (B, C, D or M) for the Venice flight. Venice normally has no passport check for it.","time":"2–3 h","light":"Fly by day; clear weather shows the Alps from the window.","access":"Trains to Amsterdam Centraal leave from the station under Schiphol Plaza, about 15–20 min. Arriving from outside Schengen, you pass passport control on the way to the Schengen piers.","loot":"Aged Gouda, vacuum-packed, from the cheese counters in the airport shops. It is hard cheese, so it is fine in hand luggage.","tip":"Carry printed proof of your whole route, hotels and return flight. Border officers can ask to see it at passport control.","gmaps":"Amsterdam Airport Schiphol","short":"Schiphol","cc":"NL","z":0,"fz":11},"amsterdam":{"name":"Amsterdam","alt":"Mokum","type":"city","country":"NL","region":"Amsterdam · North Holland","ll":[4.8924,52.3731],"status":{"code":"open","text":"City open as normal. Short November days, so start early."},"epithet":"The City on Wooden Piles","lore":"Amsterdam grew around a 13th-century dam on the Amstel river, and much of it still stands on wooden piles driven into soft ground. The Royal Palace on Dam Square, built as the city hall in the 1650s, rests on 13,659 of them.","quest":"Walk the canal ring (Herengracht, Keizersgracht, Prinsengracht) at dusk, when the canal houses light up. Book the Anne Frank House online ahead; there are no tickets at the door. On a rainy morning, go to the Rijksmuseum.","time":"1 day","light":"Blue hour on the canals, just after sunset.","access":"From Schiphol, trains reach Amsterdam Centraal in about 15–20 min. Dam Square is a 10-minute walk south along the Damrak. Walk or take trams; a car is no help here.","loot":"A warm stroopwafel, baked fresh at a stall in the Albert Cuyp Market in De Pijp (Mon–Sat).","tip":"Anne Frank House tickets go on sale online every Tuesday for visits six weeks later. Mid-November dates are already on sale, so book now.","gmaps":"Dam Square, Amsterdam","short":"Amsterdam","cc":"NL","z":7.1,"fz":11},"vce":{"name":"Venice Marco Polo Airport (VCE)","alt":"Aeroporto Marco Polo · Tessera","type":"airport","country":"IT","region":"Tessera · Veneto","ll":[12.3406,45.5048],"status":{"code":"open","text":"Open. 24 h security staff strike announced for Sun 22 Nov."},"epithet":"The Merchant's Lagoon Gate","lore":"The airport carries the name of Marco Polo, the Venetian merchant who spent years at the court of Kublai Khan. His travel tales, dictated in a Genoese prison around 1298, gave medieval Europe its picture of Asia.","quest":"Pick up your rental car and check it has winter tyres or chains on board. They are compulsory from Sun 15 Nov, the day after you land. Then drive about 147 km, roughly 2 h, north on the A27 and SS51 to Cortina. The 10-day plan also ends here.","time":"1 h","light":"Land by early afternoon to reach Cortina before dark (about 16:40).","access":"Follow the car rental signs from arrivals. Buses reach Venice's Piazzale Roma in about 20–25 min. Without a car, Cortina Express buses reach Cortina in about 2 h 10 min.","loot":"A tramezzino, the soft triangle sandwich Venetians love, with an espresso at a terminal bar before the drive.","tip":"Non-EU licence? Carry an International Driving Permit with it; Italian police can fine you without one. Ask the desk to show you where the chains are.","danger":"Thick fog is common on the Venetian plain on November mornings and nights. Slow down on the A27 and use fog lights.","gmaps":"Venice Marco Polo Airport","short":"Venice Airport","cc":"IT","z":0,"fz":11},"venice":{"name":"Venice","alt":"Venezia","type":"city","country":"IT","region":"Lagoon · Veneto","ll":[12.3346,45.4372],"status":{"code":"open","text":"Quiet low season. High tides (acqua alta) possible; MOSE rises for big ones."},"epithet":"Queen of the Rising Tide","lore":"On 12 November 2019 the sea rose 187 cm, the worst flood since 1966. Since October 2020, 78 yellow steel gates called MOSE lie on the seabed at the three lagoon inlets. When a big tide comes, they fill with air and rise to hold back the Adriatic.","quest":"Return the car at Piazzale Roma first. Then ride vaporetto line 1 down the whole Grand Canal to San Marco at dusk. Eat in Cannaregio or Castello for a quieter dinner. Check the tide forecast each morning.","time":"1 evening + morning","light":"Dusk from the vaporetto; early morning in an empty Piazza San Marco.","access":"Drive across the Ponte della Libertà to Piazzale Roma, where the road ends. Return the rental car there as your contract says. Then walk, or take a vaporetto (water bus).","loot":"Cicchetti (small bar snacks) with an ombra, a small glass of wine, in a bacaro near the Rialto Market.","tip":"MOSE rises only for the highest tides. Lower ones can still flood St Mark's Square, the lowest part of the city, for a few hours around the peak.","danger":"High tides (acqua alta) can flood low streets for a few hours. City sirens warn in advance. Pack waterproof shoes.","gmaps":"Venice, Italy","short":"Venice","cc":"IT","z":0,"fz":11},"trento":{"name":"Trento Christmas Market","alt":"Mercatino di Natale di Trento","type":"market","country":"IT","region":"Trento · Trentino","ll":[11.124,46.0651],"status":{"code":"open","text":"Opens Fri 20 Nov (to 6 Jan). Daily 10:00–20:00, so open on Sun 22 Nov."},"epithet":"The Council City's Lanterns","lore":"From 1545 to 1563 the Council of Trent met here, on and off, in 25 sessions. Its bishops shaped the Catholic answer to the Protestant Reformation, and the city's Latin name still lives in the word Tridentine.","quest":"Break the Sun 22 Nov drive from Bolzano to Venice here. Browse the wooden stalls in Piazza Fiera, by the old city walls, and in Piazza Cesare Battisti. Then see the cathedral and the Neptune Fountain in Piazza Duomo, a few minutes away.","time":"2–3 h","light":"Late afternoon into dusk, when the stall lights come on.","access":"Leave the A22 at Trento and follow signs for the centre and its car parks. The train station is a 10–15 minute walk from Piazza Fiera. Venice is about 2–2.5 h by car.","loot":"A cup of hot vin brulé (mulled wine) and a slice of apple strudel; Trentino is apple country.","tip":"Opening weekend gets busy; come at 10:00 for quiet stalls. On Sunday all stalls close at 20:00; only Fri and Sat run the food area to 21:00.","fee":"Free entry","opens":"2026-11-20","gmaps":"Mercatino di Natale, Piazza di Fiera, Trento","short":"Trento","cc":"IT","z":6.3,"fz":11},"cortina":{"name":"Cortina d'Ampezzo","alt":"Cortina d'Anpezo (Ladin) · Hayden (German)","type":"town","country":"IT","region":"Ampezzo · Veneto","ll":[12.1364,46.5374],"status":{"code":"limited","text":"Town open; all lifts shut and hotels only partly open until ski season."},"epithet":"The Twice-Olympic Valley","lore":"Venice ruled the Ampezzo valley until 1508; from 1511 its people swore loyalty to the Habsburg emperor, and they stayed Austrian for four centuries, until 1918. Cortina hosted the Winter Olympics in 1956 and again, with Milan, in February 2026.","quest":"Your base for three nights, Sat 14 to Tue 17 Nov. Stroll Corso Italia and the Basilica at dusk. On a slow morning, walk the flat old railway path north toward Fiames. Book dinner ahead; many places close between seasons.","time":"3 nights (base)","light":"Sunset about 16:40; alpenglow on the peaks east of town.","access":"From Venice airport, 147 km (about 2 h) via the A27 and SS51. Cortina Express buses also run from the airport. The centre is small and walkable.","loot":"Casunziei all'ampezzana, half-moon ravioli filled with red beet, topped with melted butter and poppy seeds. Order it in a town restaurant.","tip":"Mountain huts are closed now. Buy lunch, water and a thermos of tea in town the evening before each outing.","gmaps":"Corso Italia, Cortina d'Ampezzo","short":"Cortina","cc":"IT","z":0,"fz":11},"giau":{"name":"Passo Giau","alt":"","type":"pass","country":"IT","region":"Ampezzo · Veneto","ll":[12.0535,46.4828],"status":{"code":"weather","text":"Road usually open; snow, storms or avalanche risk can close it at short notice."},"epithet":"The Wall of the Shepherds","lore":"Shepherds of Ampezzo and San Vito quarrelled over these pastures for centuries. A 1752 treaty between Venice and Austria ordered San Vito to build a stone wall about 2 km long within 90 days. Remains of the wall survive, and a border stone still stands at the pass.","quest":"Sunrise stop on Sun 15 Nov (sunrise about 07:12). Leave Cortina by 06:20 to park before first light. Watch the dawn glow on Ra Gusela and the peaks to the west, then drive down for breakfast.","time":"45 min","light":"Sunrise, about 07:12 on Sun 15 Nov.","access":"From Cortina, take the SR48 west to Pocol, then the Giau road up to the pass. About 17 km, 30–40 min on winter roads. Park at the top.","loot":"A krapfen (jam doughnut) from a Cortina bakery the day before, with a flask of hot coffee at sunrise.","tip":"Giau closes more often than nearby passes. If it is shut, drive on up the SR48 from Pocol to Passo Falzarego for sunrise instead.","danger":"Black ice on shaded hairpins before sunrise, and a biting wind at 2,236 m. Drive slowly on winter tyres.","gmaps":"Passo Giau","short":"Passo Giau","cc":"IT","z":8.5,"fz":12.5},"falzarego":{"name":"Passo Falzarego","alt":"Falzaregopass","type":"pass","country":"IT","region":"Ampezzo · Veneto","ll":[12.0084,46.5188],"status":{"code":"weather","text":"Road open unless storms or avalanche risk; Lagazuoi cable car closed."},"epithet":"Pass of the False King","lore":"Ladin folk tales say a Fanes king seized the throne, betrayed his own people and was turned to stone. The pass took his name, Falza Rego, the false king. In 1915–1917 the front line ran here, with Austrian positions on Sass de Stria and Lagazuoi.","quest":"Stop at the pass and look up at the Lagazuoi's south face; its rubble scar comes from the 1917 mine war. If there is no snow, walk the first restored trenches on Sass de Stria from Passo Valparola, 2 km north.","time":"30 min–2 h","light":"Afternoon, when low sun lights Lagazuoi and Tofana di Rozes.","access":"From Cortina, about 16 km west on the SR48 via Pocol, 25–30 min. Large car park at the pass beside the cable car station.","loot":"A WWI front map or history book from a Cortina bookshop, so you can read the trenches you see.","tip":"Bai de Dones and Col Gallina are on this same road. Combine the pass with the Cinque Torri and Limides walks in one day.","danger":"The Lagazuoi tunnels and Kaiserjäger via ferrata get icy and dark. Do not climb them in snow without crampons and experience.","gmaps":"Passo Falzarego","short":"Falzarego","cc":"IT","z":8.5,"fz":12.5},"limides":{"name":"Lago di Limides","alt":"Lago de Limedes","type":"lake","country":"IT","region":"Falzarego · Veneto","ll":[12.023,46.5117],"status":{"code":"weather","text":"Path open; snow or ice can cover it, and the lake may freeze."},"epithet":"The Small Mirror of Tofana","lore":"This little pool lies on the Alta Via 1, the long trail that runs about 125 km from Lago di Braies to Belluno. In 1915–1917 these slopes lay on the Italian side of the front, facing the Austrian positions on Lagazuoi.","quest":"Short walk for a mirror image of Tofana di Rozes in still water. Go on a calm, clear morning after a dry spell. Turn back if the path is icy or buried in snow.","time":"1–1.5 h return","light":"Calm, clear morning for mirror reflections.","access":"Park at Col Gallina on the SR48, just below Passo Falzarego. Path 419 climbs to the lake in about 30–40 min. Path 441 from the pass also gets there.","loot":"A slice of apple strudel from a Cortina bakery and a flask of tea; there is nothing to buy up here.","tip":"Pair it with Passo Falzarego and Cinque Torri on the same morning. All three start from the same road, a few minutes apart.","danger":"Snow can hide the path, and early lake ice is thin. Never step onto it.","gmaps":"Lago di Limides","short":"Limides","cc":"IT","z":9.3,"fz":12.5},"cinquetorri":{"name":"Cinque Torri","alt":"Fünf Türme","type":"peak","country":"IT","region":"Ampezzo · Veneto","ll":[12.0518,46.5092],"status":{"code":"weather","text":"Chairlift closed since 11 Oct; walk up from Bai de Dones if snow allows."},"epithet":"Five Towers of the Front","lore":"In 1915–1917 the Italian army turned these five rock towers into a stronghold behind its front line, with trenches, gun posts and shelters. Restored in recent years, they now form an open-air museum. Later, Cortina's famous climbing club, the Scoiattoli, trained on these walls.","quest":"Walk up from Bai de Dones, since the chairlift is closed. Loop around the towers on the museum paths and look into the restored trenches and gun posts. Turn back if snow covers the trail.","time":"3–4 h return","light":"Late morning to early afternoon, before the shadows grow long.","access":"Park at Bai de Dones on the SR48 between Pocol and Passo Falzarego. Walk up to Rifugio Cinque Torri (2,137 m), about 250 m higher, in roughly 1–1.5 h.","loot":"A speck and mountain-cheese panino from a Cortina deli. The huts are likely shut, so carry lunch.","tip":"Start the walk by 11:00. With sunset near 16:40, you want to be back at the car well before dark.","danger":"Icy trench steps and snowdrifts. Freeze-thaw can loosen rock around the towers; one small tower collapsed in 2004.","gmaps":"Cinque Torri, Cortina d'Ampezzo","short":"Cinque Torri","cc":"IT","z":9,"fz":12.5},"lagazuoi":{"name":"Lagazuoi Cable Car","alt":"Funivia Lagazuoi","type":"lift","country":"IT","region":"Falzarego · Veneto","ll":[12.0084,46.5191],"status":{"code":"sealed","text":"Closed since 18 Oct. No rides during your trip; winter date not yet set."},"epithet":"The Mountain of Mines","lore":"In 1916–1917 Austro-Hungarian and Italian sappers dug tunnels inside the Lagazuoi and fired five mines at each other. The largest, 33 tonnes of Italian explosive on 20 June 1917, blew apart an empty Austrian stronghold. Its rubble fan still scars the face above the pass.","quest":"Nothing to ride now. View the Lagazuoi from the Passo Falzarego car park and find the rubble of the 1917 mine. Save the summit, the tunnels and Rifugio Lagazuoi for a summer trip.","time":"15 min","light":"Afternoon sun on the south face, seen from the pass.","access":"Valley station at Passo Falzarego, about 16 km from Cortina on the SR48, with a car park beside it. The lift is closed. Do not try the summit on foot in snow.","loot":"Nothing to collect while the lift is shut. Rifugio Lagazuoi, the summit hut at 2,752 m, waits for another season.","tip":"For a high view without a lift, drive to Passo Giau (2,236 m) at sunrise instead.","danger":"Do not climb the ski run or the war tunnels to the summit in snow. Avalanche and fall risk.","gmaps":"Funivia Lagazuoi, Passo Falzarego","short":"Lagazuoi","cc":"IT","z":9.3,"fz":12.5},"trecroci":{"name":"Passo Tre Croci","alt":"Son Zuógo (Ladin)","type":"pass","country":"IT","region":"Ampezzo · Veneto","ll":[12.2019,46.557],"status":{"code":"weather","text":"Road normally open; brief closures possible in storms or avalanche risk."},"epithet":"The Pass of Three Crosses","lore":"In February 1789 a mother and her two children set out from Auronzo to find work in Cortina. They froze to death near this pass. Three wooden crosses were raised in their memory, and the pass still carries them in its name.","quest":"On Mon 16 Nov you cross it on the way from Cortina to Misurina. Stop briefly at the top for Monte Cristallo to the north and the Sorapiss to the south. The trail to Lago di Sorapis starts just east of the pass.","time":"15 min","light":"Morning, with sun on the south face of Monte Cristallo.","access":"On the SR48 from Cortina toward Misurina, about 8 km and 15–20 min. Roadside parking at the top.","loot":"Nothing to buy at the top. Keep a flask of hot tea in the car for the stops ahead.","tip":"Tre Croci, Misurina, Antorno, Landro and Dobbiaco fit in one day. Start by 08:00 to finish before dark, about 16:40.","danger":"Snowfall can make the road icy within minutes. Winter tyres or chains are compulsory from 15 Nov.","gmaps":"Passo Tre Croci","short":"Tre Croci","cc":"IT","z":9,"fz":12.5},"misurina":{"name":"Lago di Misurina","alt":"Misurinasee","type":"lake","country":"IT","region":"Auronzo · Veneto","ll":[12.2538,46.5822],"status":{"code":"open","text":"Lakeside loop open; the edges may start to freeze in late November."},"epithet":"The Tears of King Sorapiss","lore":"King Sorapiss let himself be turned into a mountain so his daughter Misurina could hold a fairy's magic mirror. Standing on his stone shoulders, she grew dizzy and fell. His tears ran down in two streams and filled this lake.","quest":"Walk the flat 2.6 km loop around the lake, about 45 min. Look south to the Sorapiss, the stone king of the legend. In 1956 Olympic speed skaters raced on this lake's ice.","time":"45 min–1 h","light":"Calm morning for reflections; the low sun backlights the Sorapiss.","access":"From Cortina over Passo Tre Croci, about 14 km, 25 min. Park beside the lake.","loot":"Schiz, the soft Belluno mountain cheese pan-fried in butter. Order it at a lakeside restaurant if one is open, or in Cortina.","tip":"Come before late morning for mirror reflections; wind usually ruffles the water later in the day.","danger":"Thin ice at the edges in late November. Stay off the lake surface.","gmaps":"Lago di Misurina","short":"Misurina","cc":"IT","z":8.5,"fz":12.5},"antorno":{"name":"Lago d'Antorno","alt":"","type":"lake","country":"IT","region":"Misurina · Veneto","ll":[12.2652,46.595],"status":{"code":"open","text":"Lake open; the Tre Cime toll gate just above is likely closed for the season."},"epithet":"The Gatekeeper's Pool","lore":"Above this small peat-bog lake rises Monte Piana. From May 1915 to November 1917 Italian and Austro-Hungarian troops fought over its flat summit, with about 14,000 casualties on both sides. Neither army broke through.","quest":"Short stop on Mon 16 Nov. Walk the shore for 15 minutes and look up the toll road toward the Tre Cime. Decide here if the snow and ice allow the walk-in.","time":"15–30 min","light":"Late morning on a clear day.","access":"About 2 km north of Lago di Misurina, on the road to the Tre Cime toll booth. Small parking by the lake.","loot":"Nothing to buy here in November. Bring snacks and a hot drink from Cortina or Misurina.","tip":"Path 122 starts here and climbs about 450 m to the free open-air war museum on Monte Piana. Only try it on a dry, snow-free day.","gmaps":"Lago d'Antorno","short":"Antorno","cc":"IT","z":9.3,"fz":12.5},"trecime":{"name":"Tre Cime di Lavaredo","alt":"Drei Zinnen","type":"peak","country":"IT","region":"Auronzo · Veneto–South Tyrol","ll":[12.3025,46.6194],"status":{"code":"weather","text":"Toll road likely closed; walk-in only on a dry, snow-free day. Huts closed."},"epithet":"The Three Stone Sentinels","lore":"In 1915 the front line between Italy and Austria ran right across these peaks. On 4 July 1915 Sepp Innerkofler, a famed mountain guide from Sexten, was killed near the summit of Monte Paterno, beside the Tre Cime. Cima Grande, the tallest tower, was first climbed in 1869.","quest":"If the road is snow-free and the forecast is clear, walk the closed toll road from Antorno to Rifugio Auronzo. Then go on to Forcella Lavaredo for the north faces. Otherwise, see them from the Drei Zinnen Blick at Landro.","time":"6–7 h return from Antorno","light":"Clear midday; the north faces stay in shade all winter.","access":"Park near Lago d'Antorno. Walk the closed toll road about 450 m up to Rifugio Auronzo (2,320 m), roughly 2–2.5 h. There is no official rule on walking it in winter.","loot":"Pack bread, cheese and a thermos from Cortina. Rifugio Auronzo is closed; only a basic winter room in its basement is meant to stay open.","tip":"Start walking by 09:00. Sunset is about 16:40, and the light goes fast once the sun drops behind the ridges.","danger":"Unplowed road with ice and snow, avalanche slopes above parts of it, and early dark. Turn back if fresh snow has fallen.","gmaps":"Tre Cime di Lavaredo","short":"Tre Cime","cc":"IT","z":8.5,"fz":12.5},"landro":{"name":"Drei Zinnen Blick · Lago di Landro","alt":"Dürrensee · Höhlensteintal","type":"viewpoint","country":"IT","region":"Val di Landro · South Tyrol","ll":[12.2329,46.6398],"status":{"code":"open","text":"Roadside viewpoint on the SS51; open all year when clouds allow."},"epithet":"The North Faces' Window","lore":"The Rienz river, born under the Tre Cime, runs through this shallow lake, only 3.5 m deep at most. The road beside it is the Strada d'Alemagna, for centuries the way from Venice to the German lands.","quest":"Pull in at the Drei Zinnen Blick lay-by, just north of Lago di Landro. On a clear day the three north faces line up at the end of a side valley. Then walk a few minutes to the lake shore to see Monte Cristallo.","time":"15–30 min","light":"Clear afternoon; the north faces stay in shade in winter.","access":"On the SS51 between Cortina (about 25 km) and Toblach (about 10 km). Small roadside parking at the viewpoint.","loot":"Schüttelbrot, the crisp South Tyrolean rye flatbread, from a Toblach bakery. Snack on it with the view.","tip":"Bring a zoom lens or binoculars. The peaks are about 6 km away up the Rienz valley.","gmaps":"Drei Zinnen Blick, Landro","short":"Tre Cime viewpoint","cc":"IT","z":9,"fz":12.5},"dobbiaco":{"name":"Lago di Dobbiaco","alt":"Toblacher See","type":"lake","country":"IT","region":"Toblach · South Tyrol","ll":[12.219,46.7037],"status":{"code":"open","text":"Lakeside path open all year; ice may start to form in late November."},"epithet":"Where the Waters Choose","lore":"East of Toblach, on the low Toblacher Feld, rain chooses its sea. The Rienz from this lake runs west to the Adriatic; the Drava runs east to the Danube and the Black Sea. Gustav Mahler spent the summers of 1908–1910 nearby, composing in a small wooden hut.","quest":"Walk the flat lakeside nature trail late on Mon 16 Nov. Its boards explain the plants, animals and the rockfalls that dammed the lake. Look for the Italian bunkers of 1939 near the shore.","time":"1–2 h","light":"Clear afternoon, before the early November sunset.","access":"About 3 km south of Toblach on the SS51 toward Cortina. Park near the north end of the lake.","loot":"Speck, South Tyrol's smoked ham, sliced thin at a Toblach butcher or shop.","tip":"Make it the last stop of the Tre Cime day. It is low, flat and easy, so fading light matters less here.","danger":"Early ice is thin. Stay off the lake until it is fully frozen and declared safe.","gmaps":"Lago di Dobbiaco","short":"Dobbiaco lake","cc":"IT","z":9,"fz":12.5},"braies":{"name":"Lago di Braies","alt":"Pragser Wildsee · Lé de Braies","type":"lake","country":"IT","region":"Prags · South Tyrol","ll":[12.0858,46.6947],"status":{"code":"open","text":"Open, no booking now. Paid parking, boathouse shut, ice or snow possible."},"epithet":"The Gate of the Fanes","lore":"In the Ladin saga of the Fanes, a boat on this lake could reach the underground realm of the Fanes people. Their gate lay at the south end, under the Croda del Becco, which Ladins call Sass dla Porta, the gate mountain. The survivors wait inside for silver trumpets to call their kingdom back.","quest":"Tue 17 Nov morning visit. Walk the flat loop around the lake, about 1 h, if the far shore is free of ice. With few visitors in November, you may have the boathouse jetty view to yourself.","time":"1.5–2 h","light":"Morning; in November the lake lies mostly in mountain shadow.","access":"From Cortina about 1 h via Toblach and the Braies valley road. Paid lakeside parking. Without a car, take bus 442 from Toblach or Niederdorf (Villabassa).","loot":"Graukäse, the sharp low-fat grey cheese of the Puster Valley, with onion and vinegar. Ask for it in Toblach or Niederdorf.","tip":"Bring microspikes. The shaded far shore can stay icy all day in November while the car park side is dry.","danger":"Icy, shaded sections on the far shore path and partial lake ice. Never walk on the frozen lake.","fee":"Lakeside parking is paid (rate not confirmed).","gmaps":"Lago di Braies","short":"Braies","cc":"IT","z":7.9,"fz":11},"sorapis":{"name":"Lago di Sorapis","alt":"Lago del Sorapiss","type":"lake","country":"IT","region":"Ampezzo · Veneto","ll":[12.2235,46.5206],"status":{"code":"weather","text":"Experts only. Icy cable ledges, Rifugio Vandelli shut, lake often frozen."},"epithet":"Lair of the Stone King","lore":"The rock walls above the lake are King Sorapiss, turned to stone in the legend of Misurina. People have kept a hut by this lake since 1891, against the odds. Avalanches crushed the first two, in 1895 and 1913, and fire destroyed a third in 1959.","quest":"Optional hard hike, for experts only. Go only on a dry, cold day with no fresh snow, with microspikes, poles and a helmet. Path 215 from Passo Tre Croci crosses ledges with fixed cables and ladders. Turn back at the first iced cable section.","time":"4–5 h return","light":"The basin stays shaded in November; expect cold, flat light.","access":"Park at Passo Tre Croci on the SR48, about 8 km from Cortina. Path 215 starts just east of the pass. About 2 h each way in summer; allow more now.","loot":"Nothing up there. Carry all food and a litre of hot drink; Rifugio Vandelli opens only mid-June to mid-September.","tip":"If Passo Tre Croci has fresh snow, the shaded ledges above will be worse. Switch to the flat Misurina lake loop instead.","danger":"Exposed ledges with fixed cables and ladders, often iced in the shade. A slip can be fatal. Avoid after any snowfall.","gmaps":"Lago di Sorapis","short":"Sorapis","cc":"IT","z":9.3,"fz":12.5},"brunico":{"name":"Brunico","alt":"Bruneck · Bornech","type":"town","country":"IT","region":"Val Pusteria · South Tyrol","ll":[11.9355,46.7963],"status":{"code":"limited","text":"Old town open. Castle museum (MMM Ripa) closed until 7 Dec."},"epithet":"Bishop Bruno's Market Town","lore":"Prince-Bishop Bruno von Kirchberg of Brixen founded this town in the 13th century and built the castle above it. Bruneck is the only South Tyrol town named after its founder. In the 1400s, painter and carver Michael Pacher ran one of the most famous workshops in the Alps here.","quest":"Walk the old town street, Via Centrale (Stadtgasse), then climb the castle hill for the view over the Puster valley. The castle museum is closed until 7 Dec and the Christmas market opens 27 Nov, so keep this stop short.","time":"1.5–2 h","light":"Midday, when the low November sun is highest.","access":"About 40 min by car east of Bressanone. Park outside the car-free old town and walk in. Regional trains also run from Bressanone.","loot":"Graukäse, the sharp, low-fat grey cheese of the Puster valley. Buy it at a cheese counter or deli in town.","tip":"Pair Brunico with Val di Funes on the same day. Leave by 14:00, as Santa Maddalena is about 1.5 h away and golden hour starts around 15:30.","gmaps":"Via Centrale, 39031 Brunico BZ, Italy","short":"Brunico","cc":"IT","z":8.5,"fz":12.5},"funes":{"name":"Santa Maddalena Viewpoint","alt":"St. Magdalena · Villnöß","type":"viewpoint","country":"IT","region":"Val di Funes · South Tyrol","ll":[11.717,46.6436],"status":{"code":"open","text":"Viewpoint open. Most hotels in the valley close until early December."},"epithet":"Church Beneath the Needles","lore":"Legend says a great storm washed a small statue of Saint Mary Magdalene down the Fopal stream. The villagers built their church where it came to rest, and the statue is still inside. Behind it rise the Odle (Geisler) peaks, whose Ladin name means needles.","quest":"Drive up in the early afternoon, park in the village and walk up to the viewpoint above the church. Wait for the last light on the Odle around sunset (~16:38). Keep to the paths, as the meadows are private farmland.","time":"1–1.5 h","light":"Golden hour, about 15:30 to sunset (~16:38).","access":"About 30 min by car from Chiusa up Val di Funes. Park in Santa Maddalena village, then walk about 10 min uphill to the viewpoint above the church.","loot":"Speck and Schüttelbrot, the crisp local rye bread, for a sunset picnic. Buy them in Chiusa on the way up.","tip":"The valley floor loses the sun long before the peaks do. Arrive by 15:30, set up early, and stay 10 minutes after sunset for the afterglow.","gmaps":"Santa Maddalena viewpoint, 39040 Funes BZ, Italy","short":"Santa Maddalena","cc":"IT","z":8.5,"fz":12.5},"ranui":{"name":"St. Johann in Ranui","alt":"San Giovanni in Ranui","type":"church","country":"IT","region":"Val di Funes · South Tyrol","ll":[11.7243,46.635],"status":{"code":"limited","text":"Grounds open with €4 fee. Church interior closed; keep off fenced meadows."},"epithet":"The Lone Baroque Chapel","lore":"An inscription says Michael Jenner built this chapel to St. John of Nepomuk in 1744, yet he had died 21 years before. His merchant family from Chiusa used the Ranui estate as a hunting lodge. In 2009, Austria's postal service put the chapel on a winter stamp.","quest":"Pay the €4 access fee and walk the short path to the photo point. The chapel stands alone against the Odle walls. You cannot go inside or onto the fenced meadows. Come here first, then move to the Santa Maddalena viewpoint for sunset.","time":"30–45 min","light":"Mid-afternoon, then move on to Santa Maddalena for sunset.","access":"At the end of the valley road, about 3 min by car past Santa Maddalena. Use the paid parking at Ranui, then walk a few minutes to the chapel.","loot":"Kaminwurz, the smoked, dried South Tyrol sausage. Buy a pair in Chiusa or Bressanone to snack on while you wait for the light.","tip":"Shoot from the photo point with a zoom lens. It pulls the Odle walls closer, so they tower right behind the chapel.","fee":"€4 access fee (Ranuihof)","gmaps":"St. Johann in Ranui, 39040 Funes BZ, Italy","short":"Ranui church","cc":"IT","z":9.7,"fz":12.5},"zans":{"name":"Zannes & the Geisler Trail","alt":"Zans · Malga Zannes · Adolf-Munkel-Weg","type":"hike","country":"IT","region":"Puez-Odle Nature Park · Val di Funes","ll":[11.7651,46.6355],"status":{"code":"weather","text":"Huts closed. Trail below the north faces likely snowy or icy."},"epithet":"Under the North Walls","lore":"Reinhold Messner grew up down the valley in St. Peter, the son of the village schoolmaster. At five, his father led him up the Sass Rigais (3,025 m), one of the two highest Geisler peaks above this trail. He later became the first person to climb all fourteen 8,000-metre peaks.","quest":"Go only on a clear, dry day. From the Zannes car park, walk toward the Adolf Munkel Trail under the Geisler north faces. Go as far as the path stays clear of ice, then turn back. All huts are closed, so carry food and water.","time":"2–4 h","light":"Late morning to early afternoon; the north faces stay in shade.","access":"Drive to the end of the Val di Funes road, about 10 min past Santa Maddalena. Park at the Zannes car park, where the trails start.","loot":"Your own supplies. Bring Speck, bread and a thermos of hot tea from Bressanone, as nothing on the trail is open.","tip":"Call the Funes tourist office (+39 0472 840 180) about trail conditions before you drive up. Microspikes help on icy patches.","danger":"Ice on shaded sections, dark by about 17:00, and no open huts for shelter. Turn back at the first icy slope.","gmaps":"Parcheggio Zannes, 39040 Funes BZ, Italy","short":"Zannes","cc":"IT","z":9.3,"fz":12.5},"bressanone":{"name":"Bressanone","alt":"Brixen · Persenon","type":"town","country":"IT","region":"Valle Isarco · South Tyrol","ll":[11.6569,46.7158],"status":{"code":"open","text":"Town open all year. Christmas market opens late Nov, after you leave."},"epithet":"City of the Prince-Bishops","lore":"In the winter of 1551, an Indian elephant named Soliman, a royal gift bound for Vienna, rested two weeks in Brixen before crossing the Brenner. The innkeeper renamed his inn after the animal, and the name Elephant survives today. For centuries, the town was the seat of prince-bishops.","quest":"Walk the arcaded lanes of the old town at dusk and see the cathedral and its frescoed cloister. November is Törggelen season in this valley, so spend one evening at a farm tavern with new wine and roast chestnuts.","time":"2–3 h","light":"Dusk, when the arcades and cathedral square light up.","access":"Your base for three nights. The old town is car-free, so park in a public garage. The train station is a 10-min walk from the centre.","loot":"Schüttelbrot, the crisp rye flatbread of the Isarco valley, from a bakery in the old town.","tip":"Book your Törggelen dinner at a farm tavern (Buschenschank) above town a day ahead. Opening days vary, and the season ends at Advent.","gmaps":"Piazza Duomo, 39042 Bressanone BZ, Italy","short":"Bressanone","cc":"IT","z":0,"fz":11},"novacella":{"name":"Novacella Abbey","alt":"Kloster Neustift · Stift Neustift","type":"abbey","country":"IT","region":"Varna, near Bressanone · South Tyrol","ll":[11.6484,46.7437],"status":{"code":"open","text":"Mon–Sat. Museum 10:00–17:00. Tastings weekdays 16:00; English on Fridays."},"epithet":"The Eighth Wonder Abbey","lore":"Bishop Hartmann of Brixen founded this Augustinian abbey in 1142, and the canons have made wine here ever since. In the courtyard, the Well of Wonders shows the Seven Wonders of the World. Its eighth panel shows the abbey itself.","quest":"Book the vineyard tour with tasting at 16:00 (about 90 min, €25) and arrive 15 min early. Before it, see the museum with audioguide (last entry 16:15) and the Well of Wonders. Ask when booking whether your visit includes the baroque library hall.","time":"2–3 h","light":"Afternoon; the tasting starts at 16:00, near sunset.","access":"3 km north of Bressanone, about 5 min by car, with free visitor parking. You can also walk there from town in about 45 min.","loot":"A bottle of the abbey's Kerner, its best-known white, from the wine shop (Mon–Fri 10:00–19:00, Sat 10:00–18:00).","tip":"Weekday tastings run in German and Italian; the English one is on Fridays. Confirm the language when you book at booking@kloster-neustift.it or +39 0472 694 951.","fee":"Museum €13 · guided tour €18 · vineyard tour with tasting €25","closed":[0],"gmaps":"Abbazia di Novacella, Via Abbazia 1, 39040 Varna BZ, Italy","short":"Novacella","cc":"IT","z":9,"fz":12.5},"chiusa":{"name":"Chiusa & Säben Abbey","alt":"Klausen · Tluses · Kloster Säben · Sabiona","type":"abbey","country":"IT","region":"Valle Isarco · South Tyrol","ll":[11.567,46.644],"status":{"code":"open","text":"Old town and the footpath up to Säben are open all year."},"epithet":"Rock of the First Bishops","lore":"From the 6th century, bishops had their seat on this rock until they moved down to Brixen in the 10th century. In 1685, Benedictine nuns came from Salzburg and made it a convent. Albrecht Dürer sketched Chiusa on his way to Italy and later put the town in his engraving Nemesis.","quest":"Wander the old town lanes, then climb the steep path past Branzoll castle up to Säben, about 30–40 min. From the top, look down on the rooftops and the Isarco valley. Start down well before dark.","time":"2–2.5 h","light":"Early afternoon; the narrow valley loses the sun early.","access":"About 20 min from Bressanone by car or regional train. Park outside the old town and walk in. The path to Säben starts in the old town.","loot":"Roast chestnuts and new wine at a Törggelen farm tavern near Chiusa, often called the Törggelen capital.","tip":"By the station, look for the arches of an old curved viaduct. It is a remnant of the Val Gardena railway, built mostly by Russian prisoners of war in WWI.","gmaps":"Kloster Säben, 39043 Chiusa BZ, Italy","short":"Chiusa","cc":"IT","z":9,"fz":12.5},"ortisei":{"name":"Ortisei","alt":"St. Ulrich in Gröden · Urtijëi","type":"town","country":"IT","region":"Val Gardena · South Tyrol","ll":[11.6721,46.5752],"status":{"code":"limited","text":"Village open; most hotels closed and lifts shut until 4 Dec."},"epithet":"Village of the Woodcarvers","lore":"From the 1600s, families here carved saints, altars and wooden toys, and for two centuries Ortisei was a world centre of woodcarving. The jointed peg dolls of Victorian nurseries began in this valley. The Ladin name Urtijëi goes back to the Latin for nettle field.","quest":"Walk the pedestrian centre and look into the carvers' shops and galleries. Inside the parish church of St. Ulrich, see the carved works of local artists. Then have lunch, and check opening days first, as the village is in its quiet season.","time":"2 h","light":"Midday, the warmest and brightest hours.","access":"About 45 min by car from Bressanone via Chiusa. Park in a public car park and walk into the centre. The tourist office keeps reduced hours and is closed on Sundays.","loot":"A small hand-carved figure from a carver's workshop. Ask if it is carved by hand; machine-carved pieces are far cheaper.","tip":"The Christmas village opens 28 Nov, so the main street is quiet now. Ask in a workshop if you can watch a carver at work.","gmaps":"Piazza Sant'Antonio, 39046 Ortisei BZ, Italy","short":"Ortisei","cc":"IT","z":7.9,"fz":11},"seceda":{"name":"Seceda","alt":"Secëda · Monte Seceda","type":"lift","country":"IT","region":"Val Gardena · South Tyrol","ll":[11.7244,46.5979],"status":{"code":"sealed","text":"Lifts ran until 2 Nov. Val Gardena lifts reopen 4 Dec, after your trip."},"epithet":"The Sealed Sky Ridge","lore":"The name likely comes from the Latin siccus, dry, for the dry pastures below the 2,519 m summit. From the south, a gentle meadow rises to the top. On the north and west sides, crumbling cliffs drop away.","quest":"Skip it on this trip. With no lift, the climb from Ortisei is long and steep, and the ridge can be icy. See the Odle from Santa Maddalena and Zannes instead, and save Seceda for a summer visit.","time":"n/a this trip","light":"Save for summer, early morning or late afternoon on the ridge.","access":"Normally by cable car from Ortisei via Furnes. On foot from Ortisei it is about 1,300 m of climbing, too much for short, icy November days.","loot":"A Seceda postcard from a shop in Ortisei, as a promise to come back.","tip":"Don't hike up to beat the closure. With no lifts, no open huts and snow on the ridge, it is a long, risky day.","danger":"Snow and ice on the ridge path, steep drops on the north side, and no lifts or huts to fall back on.","gmaps":"Seceda, 39046 Ortisei BZ, Italy","short":"Seceda","cc":"IT","z":9.3,"fz":12.5},"gardena":{"name":"Passo Gardena","alt":"Grödner Joch · Jëuf de Frea · Ju de Frara","type":"pass","country":"IT","region":"Val Gardena / Alta Badia · South Tyrol","ll":[11.8084,46.5498],"status":{"code":"weather","text":"Road open; storms can close it briefly. Winter tyres or chains from 15 Nov."},"epithet":"Gate of the Ladin Valleys","lore":"On 5 May 1920, delegates from the five Ladin valleys met on this pass. They protested being handed to Italy without a say and demanded recognition as a people of their own. Five years earlier, a cart road had been built over the pass to supply the WWI front.","quest":"Drive up from Selva for the view of the Sella walls and the Cir spires. Park at the top and walk a few minutes. Then drive back toward Plan de Gralba and on to Passo Sella. Watch the sky, as snow can come in fast.","time":"20–30 min","light":"Early afternoon, when the low sun lights the Cir spires.","access":"About 15 min by car from Selva di Val Gardena on the SS243. Parking at the top of the pass.","loot":"Kaiserschmarrn, torn sweet pancake with cranberry jam, at an open inn in Selva or Ortisei on the way back.","tip":"Check road conditions on South Tyrol's official traffic information before you set out. After fresh snow, the passes can close for hours.","danger":"Snow, black ice and sudden storms. Winter tyres or chains on board are compulsory from 15 Nov.","gmaps":"Passo Gardena, Dolomites, Italy","short":"Passo Gardena","cc":"IT","z":8.5,"fz":12.5},"sella":{"name":"Passo Sella","alt":"Sellajoch · Jëuf de Sela","type":"pass","country":"IT","region":"Val Gardena / Val di Fassa · Dolomites","ll":[11.7673,46.5081],"status":{"code":"weather","text":"Road open; storms can close it briefly. Winter tyres or chains from 15 Nov."},"epithet":"Foot of the Long Stone","lore":"The great wall above the pass is Sassolungo, the Long Stone, 3,181 m high. Paul Grohmann, the Viennese climber behind many first Dolomite ascents, reached its summit first in 1869. The normal route to the top still starts here at the pass.","quest":"Arrive by 16:00 and park at the pass. Walk a few minutes toward the boulder field below Sassolungo and watch the last light fade on the peaks around sunset (~16:37). Drive down before full dark, before the road freezes.","time":"30–45 min","light":"Last hour before sunset (~16:37), for warm light on the peaks.","access":"About 20 min by car from Selva di Val Gardena, or 25 min from Passo Gardena via Plan de Gralba. Parking at the pass.","loot":"Apple strudel from a bakery in Ortisei or Selva, eaten in the warm car while the light fades.","tip":"For the closest view of the wall, park on the Val Gardena side near the closed Sassolungo gondola station.","danger":"Black ice on the descent after sunset. Storms can close the pass. Winter tyres or chains compulsory from 15 Nov.","gmaps":"Passo Sella, Dolomites, Italy","short":"Passo Sella","cc":"IT","z":8.5,"fz":12.5},"siusi":{"name":"Alpe di Siusi","alt":"Seiser Alm · Mont Sëuc","type":"viewpoint","country":"IT","region":"Castelrotto · South Tyrol","ll":[11.6179,46.5403],"status":{"code":"limited","text":"Road to Compatsch open to cars all day. Lifts shut until 4 Dec."},"epithet":"Meadow of the Sciliar Witches","lore":"This is Europe's largest high-alpine pasture. In South Tyrol legend, the flat-topped Sciliar at its edge is the witches' dancing ground, home of the Schlern witches. On the Bullaccia (Puflatsch) above Compatsch, rock seats are still called the Witches' Benches.","quest":"Drive up before dawn and watch sunrise (~07:21) from Compatsch, with Sassolungo and Sassopiatto dark against the sky. Then walk the quiet meadow paths for an hour or two. If the paths are clear of ice, climb the Bullaccia to the Witches' Benches, about 1–1.5 h up.","time":"2–4 h","light":"Sunrise (~07:21), peaks in silhouette, then soft morning light.","access":"From Siusi, drive the road up to Compatsch, about 20–25 min. It is open to private cars all day in this between-season. Park at P2, about €15 a day. No gondola runs.","loot":"Krapfen, South Tyrol's jam doughnuts, from a bakery in Castelrotto or Siusi the day before. Nothing up top is open at dawn.","tip":"Arrive 30 min before sunrise. The pink sky behind Sassolungo is often at its best before the sun appears.","danger":"Frost and ice on the hairpin road at dawn. Lifts, huts and most hotels are closed, so you are on your own up there.","gmaps":"Compatsch, 39040 Alpe di Siusi BZ, Italy","short":"Alpe di Siusi","cc":"IT","z":7.9,"fz":11},"castelrotto":{"name":"Castelrotto","alt":"Kastelruth · Ciastel","type":"town","country":"IT","region":"Sciliar area · South Tyrol","ll":[11.5597,46.5678],"status":{"code":"open","text":"Village open; many hotels closed until early December."},"epithet":"Village of the Broken Castle","lore":"The name comes from the Latin castellum ruptum, a broken castle, first written down around 985. In a great fire in the 1750s, the church and much of the village burned, and all eight bells melted. On the Kofel hill, a tower of the old castle still stands.","quest":"Walk up the Kofel hill at the edge of the village, past seven chapels with life-size carved Stations of the Cross, to the old castle tower. Look across to the Sciliar. Then have a coffee on the main square below the bell tower.","time":"1 h","light":"Midday, on your way down from Alpe di Siusi.","access":"About 30 min by car from Chiusa, and 10 min from Siusi. Park in a car park at the edge of the village and walk to the main square.","loot":"Schlutzkrapfen, half-moon pasta filled with spinach and cheese, served with melted butter, in a village inn.","tip":"Stop here between Alpe di Siusi and Chiusa. It breaks the drive, and the Kofel loop takes only about 30 min.","gmaps":"Piazza Kraus, 39040 Castelrotto BZ, Italy","short":"Castelrotto","cc":"IT","z":9,"fz":12.5},"carezza":{"name":"Lago di Carezza","alt":"Karersee","type":"lake","country":"IT","region":"Val d'Ega · South Tyrol","ll":[11.5752,46.4093],"status":{"code":"open","text":"Loop path open all year. Shore fenced; view from the path only."},"epithet":"The Rainbow Lake","lore":"The wizard of Latemar loved Ondina, the nymph of this lake. A witch told him to dress as a jewel merchant and spread a rainbow over the water to lure her. He forgot the disguise, so Ondina saw him and vanished, and in his rage he smashed the rainbow into the lake, where its colours remain.","quest":"Walk the loop path around the lake, about 20 min, and look for the Latemar spires mirrored in the green water. Stay behind the fence, as going down to the shore is not allowed. Come early, before the wind ruffles the surface.","time":"30–45 min","light":"Morning, in calm air, for clear Latemar reflections.","access":"On the SS241 above Nova Levante, about 40 min from Bolzano. Paid P1 lot opposite the lake, with an underpass. Free P2 Bellavista and P3 Paolina lots connect via path 6.","loot":"Südtiroler Speck and rye bread from a village shop in Nova Levante (Welschnofen), for a picnic after your loop.","tip":"Park free at P2 or P3 and walk path 6 to the lake. You skip the P1 fee and get a quiet forest walk.","danger":"Shaded parts of the path can be icy in the morning. Wear shoes with good grip.","gmaps":"Lago di Carezza, 39056 Nova Levante BZ, Italy","short":"Carezza","cc":"IT","z":7.9,"fz":11},"costalunga":{"name":"Passo Costalunga","alt":"Karerpass · Jouf de Ciareja · Passo di Carezza","type":"pass","country":"IT","region":"Val d'Ega / Val di Fassa · Dolomites","ll":[11.609,46.4043],"status":{"code":"weather","text":"Road open; storms can close it briefly. Winter tyres or chains from 15 Nov."},"epithet":"King Laurin's Rose Garden","lore":"The dwarf king Laurin kept a garden of roses on the mountain. When Dietrich of Bern came for him, the roses gave away his hiding place, and Laurin was captured. He cursed the garden so no one would see it by day or night, but he forgot twilight, so at dusk the rocks still glow red.","quest":"Stop at the pass (1,745 m) and walk a few minutes into the meadows. Look north-east to the Rosengarten (Catinaccio) and south-west to the Latemar. Pair it with Lago di Carezza, 5 min below.","time":"20–30 min","light":"Clear mornings; the Rosengarten glows red only around sunset.","access":"5 min by car above Lago di Carezza on the SS241, about 45 min from Bolzano. Parking at the pass.","loot":"Puzzone di Moena, a strong, smelly Fassa valley cheese, from a shop in Vigo di Fassa or Moena, just over the pass.","tip":"Visit the lake first, while the air is still, then drive up here. Wind at the pass does not spoil this view.","danger":"Snow and black ice, mostly in shaded bends. Winter tyres or chains on board are compulsory from 15 Nov.","gmaps":"Passo di Costalunga, Dolomites, Italy","short":"Costalunga","cc":"IT","z":9.3,"fz":12.5},"bolzano":{"name":"Bolzano","alt":"Bozen · Bulsan","type":"city","country":"IT","region":"Bolzano · South Tyrol","ll":[11.3548,46.4983],"status":{"code":"open","text":"City open all year. Christmas market opens Thu 26 Nov at 17:00."},"epithet":"Gate to the Dolomites","lore":"In 1889, Bolzano raised a statue of the medieval poet Walther von der Vogelweide on its main square. In 1935, the Fascist authorities moved him to a side park. Citizens campaigned for his return, and in 1981 he came back to the square that bears his name.","quest":"Drop the rental car, then walk the arcaded Via dei Portici and the Piazza delle Erbe market street. At sunset (~16:37), watch the Rosengarten glow red to the east from the Talvera river promenade. In the 15-day plan, take an afternoon or early-evening train to Innsbruck.","time":"3–4 h","light":"Sunset (~16:37) for the Rosengarten glow, which lasts minutes.","access":"The station is a 5-min walk from Piazza Walther, and the old town is car-free. Return the rental car before you explore; you won't need it here.","loot":"A bottle of Lagrein or St. Magdalener, Bolzano's own red wines from the slopes around town, from an old-town wine shop.","tip":"A national rail strike runs from 21:00 Fri 20 Nov to 20:00 Sat 21 Nov. Take your train to Innsbruck in the afternoon or early evening.","gmaps":"Piazza Walther, 39100 Bolzano BZ, Italy","short":"Bolzano","cc":"IT","z":0,"fz":11},"otzi":{"name":"Ötzi · South Tyrol Museum of Archaeology","alt":"Südtiroler Archäologiemuseum · Museo Archeologico dell'Alto Adige","type":"museum","country":"IT","region":"Bolzano · South Tyrol","ll":[11.3496,46.4998],"status":{"code":"open","text":"Tue–Sun 10:00–18:00. Closed Mondays. Ticket €13."},"epithet":"Tomb of the Iceman","lore":"On 19 September 1991, German hikers Erika and Helmut Simon found a body melting out of the ice at 3,210 m. The man had died about 5,300 years ago. Only in 2001 did X-rays reveal an arrowhead in his left shoulder, proof that he was killed.","quest":"See the Iceman through the small window of his cold cell, then his clothes, copper axe and bow. End with the life-size reconstruction of how he looked. The museum is closed on Mondays, so Fri 20 or Sat 21 Nov both work.","time":"1.5–2 h","light":"Go at 10:00 opening, before groups arrive.","access":"In the old town at Via Museo 43, about 10 min on foot from Piazza Walther and 15 min from the station.","loot":"A Krapfen or apple strudel from a café under the arcades of Via dei Portici, a few minutes away.","tip":"See the Iceman's window first, right after you enter, then do the rest of the museum. The queue at the window grows during the day.","fee":"€13","closed":[1],"gmaps":"South Tyrol Museum of Archaeology, Via Museo 43, Bolzano","short":"Ötzi Museum","cc":"IT","z":10.2,"fz":12.5},"renon":{"name":"Renon Earth Pyramids","alt":"Erdpyramiden am Ritten · Piramidi di terra del Renon","type":"hike","country":"IT","region":"Renon plateau · above Bolzano","ll":[11.4693,46.5522],"status":{"code":"limited","text":"Cable car closed 8–24 Nov; bus B161 replaces it. The Renon tram runs."},"epithet":"Pillars in Stone Hats","lore":"When the Ice Age glaciers melted, they left thick clay full of boulders. Rain carved the clay into gullies, and wherever a boulder sat on top, it shielded the column beneath. Each pillar lasts only as long as its stone hat, and once the stone falls, the pillar soon wears away.","quest":"Optional. Take bus B161 to Soprabolzano and the Renon tram to Collalbo, then walk about 30 min to the viewpoint over the Finsterbach gorge. Check for strikes first, as SAD buses and trains may stop on Sat 21 Nov.","time":"3–4 h from Bolzano","light":"Midday to early afternoon, the warmest hours.","access":"By car, about 30 min from Bolzano to the Longomoso (Lengmoos) car park, then 15 min on foot. By transit, take bus B161 to Soprabolzano and the tram to Collalbo, then walk about 30 min.","loot":"Apple strudel at a café in Collalbo after the walk.","tip":"The best-known group stands in the Finsterbach gorge below Longomoso. Stay on the marked path, as the slopes are fragile and crumble easily.","gmaps":"Piramidi di terra, Longomoso, 39054 Renon BZ, Italy","short":"Earth Pyramids","cc":"IT","z":9,"fz":12.5},"merano":{"name":"Merano · Terme Merano","alt":"Meran · Therme Meran · Maran","type":"spa","country":"IT","region":"Merano · South Tyrol","ll":[11.1601,46.668],"status":{"code":"open","text":"Open daily; pools 9:00–21:00, last entry 19:00. Strikes on Sat 21 Nov."},"epithet":"Old Capital of Tyrol","lore":"The counts of Tyrol held court here until Duke Frederick IV moved to Innsbruck in 1420. In the 1800s, the mild climate made Merano a famous spa of the Habsburg empire. Empress Elisabeth came for the air, and Franz Kafka later followed.","quest":"Spend the afternoon in the thermal baths, then walk the river promenade along the Passirio and the arcaded Via Portici. On Sat 21 Nov, trains and SAD buses are on strike, so check transport the day before or swap days.","time":"3–4 h","light":"Afternoon into dusk, when the promenade lights come on.","access":"Trains from Bolzano take about 40 min. The baths are on Piazza Terme, about 15 min on foot from Merano station.","loot":"Local apple juice or dried apple rings from a shop under the Via Portici arcades.","tip":"Arrive right after lunch. Saturdays get busy, and the last entry is at 19:00.","gmaps":"Terme Merano, Piazza Terme 9, 39012 Merano BZ, Italy","short":"Merano","cc":"IT","z":7.1,"fz":11},"innsbruck":{"name":"Innsbruck","alt":"","type":"city","country":"AT","region":"Innsbruck · Tyrol","ll":[11.397,47.2654],"status":{"code":"open","text":"Old Town and Marktplatz Christmas markets daily 11:00–21:00 until 23 Dec"},"epithet":"Capital of the Alps","lore":"The name means bridge over the Inn. In 1420 the Tyrolean dukes moved their court here, and around 1500 Emperor Maximilian I made the city a seat of imperial power. Innsbruck later hosted the Winter Olympics twice, in 1964 and 1976.","quest":"Arrive Friday evening and walk straight to the Old Town market below the Golden Roof. Shopping stalls close at 20:00, food and drink at 21:00. On Saturday, add the Marktplatz market by the river and the Hungerburg market above town. The Maria-Theresien-Straße market opens only on 25 Nov.","time":"Fri 20 Nov evening – Sun 22 Nov morning · 2 nights","light":"Sunset about 16:30; market lights glow from dusk.","access":"EuroCity trains from Bolzano take about 2 hours. From Innsbruck Hbf walk 15 minutes north along Maria-Theresien-Straße to the Old Town.","loot":"Tiroler Kiachl, fried dough topped with sauerkraut or lingonberry jam, from the Old Town market stalls.","tip":"The Innsbruck Card covers city buses, the Hofburg, Swarovski with its shuttle, and one Nordkette round trip. If the lifts are shut, check it still pays off.","danger":"Old Town cobbles turn icy after dark. Keep bags closed in the market crowds; pickpockets work there.","gmaps":"Christkindlmarkt Innsbrucker Altstadt, Herzog-Friedrich-Straße, 6020 Innsbruck","short":"Innsbruck","cc":"AT","z":0,"fz":11},"goldenroof":{"name":"Golden Roof","alt":"Goldenes Dachl","type":"castle","country":"AT","region":"Innsbruck · Tyrol","ll":[11.3933,47.2686],"status":{"code":"open","text":"Free to view from the street; Christmas market below until 23 Dec"},"epithet":"The Emperor's Gilded Balcony","lore":"Emperor Maximilian I had this balcony built around 1500 to mark his marriage to Bianca Maria Sforza. From here he watched tournaments and festivals in the square below. Its roof shines with 2,657 fire-gilded copper tiles.","quest":"Come Saturday at 10:00, an hour before the market opens, for a clear photo. Look for the carved reliefs of Maximilian with both his wives and a row of Morris dancers. Return after 16:30 when the market lights come on.","time":"Sat 21 Nov · 30 min","light":"Floodlit after dark; blue hour around 16:45 is best.","access":"From Innsbruck Hbf walk 15 minutes north along Maria-Theresien-Straße. It stands at the end of Herzog-Friedrich-Straße in the Old Town.","loot":"Apple strudel at Strudel-Café Kröll in Hofgasse, a minute's walk from the roof.","tip":"Walk three minutes to the Hofkirche (Court Church). Twenty-eight larger-than-life bronze figures guard Maximilian's tomb there, yet it is empty; he is buried in Wiener Neustadt.","gmaps":"Goldenes Dachl, Herzog-Friedrich-Straße 15, 6020 Innsbruck","short":"Golden Roof","cc":"AT","z":12.1,"fz":14.3},"nordkette":{"name":"Nordkette · Seegrube & Hafelekar","alt":"Nordkettenbahnen · Hungerburgbahn · Top of Innsbruck","type":"lift","country":"AT","region":"Innsbruck · Tyrol","ll":[11.3798,47.3066],"status":{"code":"open","text":"Autumn maintenance ends 19 Nov; winter season from Fri 20 Nov."},"epithet":"Sky Gate of Innsbruck","lore":"The Nordkettenbahn opened in 1928, carrying skiers and walkers from above the city onto the high ridge. In 2007 a new funicular opened below it, with stations by Zaha Hadid that look like flowing glacier ice. Three rides take you from the Old Town to the Hafelekar at 2,256 m.","quest":"If the lifts run, ride up Saturday morning while the air is clearest, and be down before dark at 16:30. Snow may already cover Seegrube. If the upper lifts are shut, go to Hungerburg (860 m) for the city view and its Christmas market, open from 20 Nov.","time":"Sat 21 Nov morning · 3–4 h","light":"Often sunny above the valley fog; check the webcams first.","access":"Walk 5 minutes from the Golden Roof to Congress station. Ride the Hungerburgbahn funicular to Hungerburg, then the Seegrubenbahn and Hafelekarbahn cable cars to the top.","loot":"Zirbenschnaps, a schnapps flavoured with Swiss stone pine cones, sold in mountain huts and Old Town shops.","tip":"Check the Nordkette webcam before you pay. If Seegrube sits inside a cloud, you will see only white. The Innsbruck Card includes one round trip.","danger":"At 2,000 m expect hard frost, wind and ice. Stay on cleared areas; snow beside the paths can hide steep drops.","gmaps":"Seegrube Nordkettenbahnen, Innsbruck","short":"Nordkette","cc":"AT","z":10.2,"fz":12.5},"swarovski":{"name":"Swarovski Crystal Worlds","alt":"Swarovski Kristallwelten","type":"museum","country":"AT","region":"Wattens · Tyrol","ll":[11.6008,47.2944],"status":{"code":"open","text":"Usually open daily 9:00–19:00; confirm 2026 winter hours online"},"epithet":"The Giant's Crystal Halls","lore":"Daniel Swarovski opened his crystal-cutting works in Wattens in 1895. For the company's 100th birthday in 1995, the artist André Heller built a giant's head into a grassy hill, with glittering crystal eyes and a waterfall pouring from its mouth. Inside lie the Chambers of Wonder.","quest":"A half-day trip, best if the Nordkette lifts are shut. Walk through the Chambers of Wonder inside the Giant, then under the Crystal Cloud, about 800,000 crystals hung over a black mirror pool. Go early in the afternoon so you see the garden before dark at 16:30.","time":"Sat 21 Nov (optional) · 3 h with travel","light":"Mostly indoors; the garden and Crystal Cloud need daylight.","access":"A Swarovski shuttle bus runs from Innsbruck; check its winter times. Regional trains also stop at Fritzens-Wattens, about 3 km away.","loot":"A crystal Christmas ornament from the shop at the exit. Swarovski releases a new star or snowflake design each year.","tip":"The Innsbruck Card includes entry and the shuttle bus, so with a card this trip costs no extra money.","gmaps":"Swarovski Kristallwelten, Kristallweltenstraße 1, 6112 Wattens","short":"Swarovski","cc":"AT","z":9,"fz":12.5},"salzburg":{"name":"Salzburg","alt":"","type":"city","country":"AT","region":"Salzburg · Salzburger Land","ll":[13.0468,47.798],"status":{"code":"open","text":"Chr
