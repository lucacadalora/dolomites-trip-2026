  $('#cardDone').addEventListener('click',function(){toggleDone(id);showSite(id,false)});
  if(fly){var w=map.getContainer().clientWidth,hgt=map.getContainer().clientHeight;
    map.flyTo({center:s.ll,zoom:Math.max(map.getZoom(),s.fz||13),offset:w<700?[0,-hgt*0.22]:[w*0.12,-hgt*0.08],duration:reduce?0:900,essential:true});}
}
function closeCard(){$('#card').hidden=true;selSite=null;updatePins()}
function toggleDone(id){var key=camp+':'+id;if(done[key])delete done[key];else done[key]=1;store.set('done',done);renderDays(true)}

/* ---------- hero ---------- */
var CCN={NL:'Netherlands',IT:'Italy',AT:'Austria',HU:'Hungary',DE:'Germany'};
function nights(){var n={};C().days.forEach(function(d){if(d.rest&&D.sites[d.rest]){var cc=D.sites[d.rest].cc;n[cc]=(n[cc]||0)+1}});return n}
function renderHero(){
  var c=C(), n=nights(), last=dateOf(c.days.length-1);
  var h='<div><div class="eyebrow">'+esc(c.kicker)+'</div><h1>'+esc(c.title)+'</h1><p class="lead">'+esc(c.lead)+'</p>';
  h+='<div class="route-line">'+c.route.map(function(r,i){return i===0||i===c.route.length-1?'<b>'+esc(r)+'</b>':esc(r)}).join(' → ')+'</div>';
  h+='<div class="alerts">'+c.alerts.map(function(a){return '<div class="alert"><svg viewBox="0 0 24 24"><use href="#i-warning"/></svg><div><b>'+esc(a.t)+'.</b> '+esc(a.x)+'</div></div>'}).join('')+'</div></div>';
  h+='<div class="stats"><div class="stat"><div class="v">'+fmt(dateOf(0))+' – '+fmt(last).replace(/^\w+ /,'')+'</div><div class="l">'+c.days.length+' days · '+(c.days.length-1)+' nights</div></div>';
  h+='<div class="stat"><div class="v">'+Object.keys(n).map(function(cc){return n[cc]}).join(' · ')+'</div><div class="l">Nights in '+Object.keys(n).map(function(cc){return CCN[cc]}).join(' · ')+'</div></div>';
  h+='<div class="stat"><div class="v">'+esc(c.drive)+'</div><div class="l">Driving (rental car)</div></div>';
  h+='<div class="stat"><div class="v">'+esc(c.exitShort)+'</div><div class="l">Fly home from</div></div></div>';
  $('#hero').innerHTML=h;
}

/* ---------- days ---------- */
function warnings(i){
  var d=C().days[i], date=dateOf(i), iso=isoOf(date), out=[];
  var modes={};legsOf(d).forEach(function(l){var L=D.legs[l];if(L)(L.cc||[]).forEach(function(cc){modes[L.mode+':'+cc]=1})});
  D.events.forEach(function(e){
    if(iso<e.from||iso>e.to)return;
    var hit=(e.affects||[]).some(function(a){return modes[a]});
    if(!hit&&e.sites)hit=d.objs.some(function(s){return e.sites.indexOf(s)>=0});
    if(!hit&&e.legs)hit=legsOf(d).some(function(l){return e.legs.indexOf(l)>=0});
    if(!hit&&e.cc)hit=d.objs.some(function(s){return (D.sites[s]||{}).cc===e.cc});
    if(hit)out.push({bad:e.bad,t:e.title,x:(iso===e.from&&e.fromText)?e.fromText:e.text});
  });
  d.objs.forEach(function(s){var S=D.sites[s];if(!S)return;
    if(S.closed&&S.closed.indexOf(date.getUTCDay())>=0)out.push({bad:true,t:S.short||S.name,x:'Closed on '+WD[date.getUTCDay()]+'days. Swap this stop with another day.'});
    if(S.opens&&iso<S.opens)out.push({t:S.short||S.name,x:'Opens on '+(+S.opens.slice(8))+' '+MO[+S.opens.slice(5,7)-1]+', after this day.'});
  });
  return out;
}
function renderDays(keep){
  var c=C(), h='';
  c.acts.forEach(function(a){
    h+='<div class="act"><span class="eyebrow">Part '+esc(a.n)+'</span><h3>'+esc(a.title)+'</h3></div>';
    a.days.forEach(function(i){
      var d=c.days[i], date=dateOf(i), rest=d.rest?site(d.rest):null, steps=d.objs;
      var nd=steps.filter(function(s){return done[camp+':'+s]}).length;
      h+='<article class="day" data-i="'+i+'" id="day-'+(i+1)+'"><button class="day-h" type="button" aria-expanded="false"><span class="dn"><span>'+(i+1)+'</span></span><span><span class="dt">'+esc(d.title)+'</span><span class="dm">'+fmt(date)+(rest?' · sleep in '+esc(rest.short||rest.name):' · fly home')+'</span></span><span class="dprog">'+nd+'/'+steps.length+'</span></button><div class="day-b">';
      if(d.epithet)h+='<div class="epi">'+esc(d.epithet)+'</div>';
      if(d.summary)h+='<p>'+esc(d.summary)+'</p>';
      warnings(i).forEach(function(w){h+='<div class="warn'+(w.bad?' bad':'')+'"><svg viewBox="0 0 24 24"><use href="#i-warning"/></svg><div><b class="sc">'+esc(w.t)+'.</b> '+esc(w.x)+'</div></div>'});
      if(d.warn)h+='<div class="warn"><svg viewBox="0 0 24 24"><use href="#i-warning"/></svg><div>'+esc(d.warn)+'</div></div>';
      h+='<ol class="objs">';
      steps.forEach(function(s,j){var S=site(s),dn=!!done[camp+':'+s];
        h+='<li class="obj'+(dn?' done':'')+'"><button type="button" class="chk" data-done="'+esc(s)+'" aria-pressed="'+dn+'" aria-label="Mark '+esc(S.name)+' visited"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg></button><button type="button" class="go" data-site="'+esc(s)+'"><span class="nm"><small>'+(j+1)+'</small>'+esc(S.name)+' '+pill(S)+'</span>'+(d.notes&&d.notes[s]?'<span class="note">'+esc(d.notes[s])+'</span>':'')+'</button></li>'});
      h+='</ol>';
      if(d.side&&d.side.length)h+='<div class="subh">Optional stops</div><div class="sides">'+d.side.map(function(s){var S=site(s);return '<button type="button" class="btn" data-site="'+esc(s)+'">'+esc(S.short||S.name)+'</button>'}).join('')+'</div>';
      if(d.tips&&d.tips.length)h+='<div class="subh">Tips</div><ul class="tips">'+d.tips.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>';
      if(d.meals)h+='<div class="subh">Food</div><div class="restline">'+esc(d.meals)+'</div>';
      if(d.restText)h+='<div class="subh">Sleep</div><div class="restline">'+esc(d.restText)+'</div>';
      if(d.drive)h+='<div class="subh">Travel today</div><div class="restline">'+esc(d.drive)+'</div>';
      h+='</div></article>';
    });
  });
  $('#days').innerHTML=h;
  $('#logTitle').textContent=c.days.length+' days, day by day';
  if(keep&&curDay>=0)setDay(curDay,false);
}
$('#days').addEventListener('click',function(ev){
  var b=ev.target.closest('button'); if(!b)return;
  if(b.classList.contains('day-h')){var i=+b.parentNode.dataset.i;if(curDay===i){setDay(-1);fitAll()}else{closeCard();setDay(i,true);if(innerWidth<961)$('.mapcol').scrollIntoView({block:'start'})}return}
  if(b.dataset.done){toggleDone(b.dataset.done);if(selSite===b.dataset.done)showSite(selSite,false);return}
  if(b.dataset.site){showSite(b.dataset.site,true);if(innerWidth<961)$('.mapcol').scrollIntoView({block:'start'})}
});

/* ---------- chips ---------- */
function renderChips(){$('#chips').innerHTML=C().regions.map(function(r,i){return '<button type="button" class="chip" data-r="'+i+'" aria-pressed="false">'+esc(r.name)+'</button>'}).join('')}
$('#chips').addEventListener('click',function(ev){var b=ev.target.closest('.chip');if(!b)return;var r=C().regions[+b.dataset.r];
  setDay(-1);closeCard();$$('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b)});
  if(r.all){fitAll();return}
  fitPts(r.sites.filter(function(s){return D.sites[s]}).map(function(s){return D.sites[s].ll}),r.maxZoom||12)});

/* ---------- final gate ---------- */
function renderGate(){
  var G=C().gate, h='<div class="eyebrow">Flight back</div><h2>Where to fly home from</h2><p class="lead">'+esc(G.lead)+'</p>';
  h+='<div class="verdict"><div class="seal">'+esc(G.code)+'</div><div><h3>'+esc(G.verdict)+'</h3><p>'+esc(G.why)+'</p></div></div>';
  h+='<div class="calc" style="margin-top:16px"><span class="ctl">Your ticket home</span><div class="seg" role="group" aria-label="Ticket type"><button type="button" data-t="openjaw" aria-pressed="'+(ticket==='openjaw')+'">Not booked yet</button><button type="button" data-t="ams" aria-pressed="'+(ticket==='ams')+'">Return from Amsterdam</button></div></div>';
  h+='<p style="margin:0 0 6px;max-width:80ch">'+esc(G.ticket[ticket])+'</p>';
  h+='<div class="tablewrap"><table><thead><tr><th>Exit airport</th><th>From the last stop</th><th>To Amsterdam</th><th>To Jakarta, one-way</th><th>Fit</th></tr></thead><tbody>';
  G.rows.forEach(function(r){h+='<tr'+(r.win?' class="win"':'')+'><td><b>'+esc(r.name)+'</b><br><span class="muted">'+esc(r.cc)+'</span></td><td>'+esc(r.reach)+'</td><td>'+esc(r.ams)+'</td><td>'+esc(r.long)+'</td><td><span class="score">'+esc(r.fit)+'</span><br><span class="muted">'+esc(r.note)+'</span></td></tr>'});
  h+='</tbody></table></div>';
  if(G.oj){h+='<div class="tablewrap"><table><thead><tr><th>Ticket from Jakarta (out 13 Nov)</th>'+G.oj.cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+G.oj.rows.map(function(r){return '<tr'+(r.win?' class="win"':'')+'><td>'+esc(r.cells[0])+'</td>'+r.cells.slice(1).map(function(v){return '<td class="num">'+esc(v)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
  if(G.foot)h+='<p class="muted" style="font-size:14.5px;margin-top:10px;max-width:90ch">'+esc(G.foot)+'</p>';
  $('#gate').innerHTML=h;
  $$('#gate [data-t]').forEach(function(b){b.addEventListener('click',function(){ticket=b.dataset.t;store.set('ticket',ticket);renderGate();addOverlays();setLegOpacity()})});
}

/* ---------- codex ---------- */
var TABS=[['hazards','November hazards'],['visa','Visa check'],['pack','Packing'],['budget','Budget'],['sun','Sun & weather'],['move','Getting around']];
var curTab=store.get('tab','hazards');
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(function(t){return '<button type="button" class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===curTab)+'">'+t[1]+'</button>'}).join('');
  var X=D.codex, h='';
  if(curTab==='hazards'){
    h='<div class="grid">'+X.bestiary.map(function(b){var th='';for(var i=1;i<=5;i++)th+='<i class="'+(i<=b.threat?'f':'')+'"></i>';
      return '<div class="beast"><h4>'+esc(b.name)+'</h4><div class="real">'+esc(b.real)+'</div><div class="threat" aria-label="Threat '+b.threat+' of 5">'+th+'</div><div class="when">'+esc(b.where)+' · '+esc(b.when)+'</div><p>'+esc(b.counter)+'</p></div>'}).join('')+'</div>';
  } else if(curTab==='visa'){
    var n=nights(), max=Math.max.apply(null,Object.keys(n).map(function(c){return n[c]})), tops=Object.keys(n).filter(function(c){return n[c]===max}), V=D.visa;
    h='<div class="visa-box"><div class="note-card"><h4>Nights in this plan</h4><div class="nights">'+Object.keys(n).map(function(cc){return '<span class="'+(n[cc]===max?'max':'')+'">'+CCN[cc]+' '+n[cc]+'</span>'}).join('')+'</div><p>'+(tops.length===1?'By nights, your main destination is <b>'+CCN[tops[0]]+'</b>.':'No single country has the most nights ('+tops.map(function(c){return CCN[c]}).join(' and ')+' tie).')+'</p><p>'+esc(tops.length===1?V.oneMain.split('{C}').join(CCN[tops[0]]):V.tie)+'</p></div>';
    h+=V.cards.map(function(cd){return '<div class="note-card"><h4>'+esc(cd.h)+'</h4>'+(cd.p||[]).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+(cd.ul?'<ul>'+cd.ul.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul>':'')+'</div>'}).join('')+'</div>';
  } else if(curTab==='pack'){
    h='<div class="pack">'+X.inventory.map(function(gp){return '<div class="grp"><h4>'+esc(gp.group)+'</h4>'+gp.items.map(function(it){var id='pk-'+it.id;return '<label for="'+id+'"><input type="checkbox" id="'+id+'" data-pk="'+esc(it.id)+'"'+(packed[it.id]?' checked':'')+'><span>'+esc(it.name)+'<small>'+esc(it.why)+'</small></span></label>'}).join('')+'</div>'}).join('')+'</div>';
  } else if(curTab==='budget'){
    h='<div class="calc"><label class="ctl" for="bStyle">Style <select id="bStyle"><option value="thrifty">Thrifty</option><option value="comfort" selected>Comfort</option><option value="lavish">Lavish</option></select></label><label class="ctl" for="bPax">Travellers <select id="bPax"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label></div><div id="bOut"></div>';
    h+='<div class="tablewrap"><table><thead><tr><th>Ticket</th><th>Price</th><th>Note</th></tr></thead><tbody>'+(X.ledger.tickets||[]).map(function(t){return '<tr><td>'+esc(t.name)+'</td><td class="num">€'+esc(t.eur)+'</td><td>'+esc(t.note||'')+'</td></tr>'}).join('')+'</tbody></table></div>';
  } else if(curTab==='sun'){
    h='<div class="tablewrap"><table><thead><tr><th>Base</th><th>Date</th><th>Sunrise</th><th>Sunset</th><th>High / low</th><th>Note</th></tr></thead><tbody>'+X.almanac.bases.map(function(b){return '<tr><td><b>'+esc(b.name)+'</b></td><td>'+esc(b.date)+'</td><td class="num">'+esc(b.sunrise)+'</td><td class="num">'+esc(b.sunset)+'</td><td class="num">'+esc(b.hi)+' / '+esc(b.lo)+' °C</td><td>'+esc(b.note)+'</td></tr>'}).join('')+'</tbody></table></div>';
  } else if(curTab==='move'){
    var rows=[];C().days.forEach(function(d,i){legsOf(d).forEach(function(l){var L=D.legs[l];if(L&&L.label)rows.push('<tr><td>Day '+(i+1)+'</td><td>'+esc(L.label)+'</td><td>'+esc({car:'Car',train:'Train',bus:'Bus',flight:'Flight'}[L.mode])+'</td><td class="num">'+(L.km?esc(L.km)+' km':'')+'</td><td class="num">'+esc(L.time||'')+'</td><td>'+esc(L.book||'')+'</td></tr>')})});
    h='<div class="tablewrap"><table><thead><tr><th>Day</th><th>Leg</th><th>Mode</th><th>Distance</th><th>Time</th><th>Book / notes</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
  }
  $('#tabBody').innerHTML=h;
  if(curTab==='budget'){$('#bStyle').addEventListener('change',budget);$('#bPax').addEventListener('change',budget);budget()}
}
$('#tabs').addEventListener('click',function(ev){var b=ev.target.closest('.tab');if(!b)return;curTab=b.dataset.tab;store.set('tab',curTab);renderTabs()});
$('#tabBody').addEventListener('change',function(ev){var c=ev.target;if(c.dataset&&c.dataset.pk){if(c.checked)packed[c.dataset.pk]=1;else delete packed[c.dataset.pk];store.set('pack',packed)}});
function mid(r){return (r[0]+r[1])/2}
function budget(){
  var L=D.codex.ledger, st=$('#bStyle').value, pax=+$('#bPax').value, rooms=Math.ceil(pax/2), lodging=0, food=0;
  C().days.forEach(function(d){if(d.rest&&L.lodging[d.rest])lodging+=mid(L.lodging[d.rest][st])*rooms;
    var cc=d.rest?site(d.rest).cc:'HU', f=L.food[cc]||L.food.IT; food+=mid(f[st])*pax});
  var car=mid(L.car.rental7d)*(C().carDays/7)+(camp==='c15'?mid(L.car.oneWayFee):0)+C().fuel;
  var parts=[['Rooms',lodging],['Food',food],['Rental car + fuel',car],['Trains & buses',(C().trainEUR||0)*pax],['Tickets & passes',C().ticketEUR*pax]];
  var tot=parts.reduce(function(a,p){return a+p[1]},0), mx=Math.max.apply(null,parts.map(function(p){return p[1]}));
  var h='<div class="total">≈ €'+(Math.round(tot/10)*10).toLocaleString('en')+'<span class="muted" style="font:600 16px var(--f-sc)"> total · ≈ €'+(Math.round(tot/pax/10)*10).toLocaleString('en')+' per person</span></div>';
  h+='<div class="bars">'+parts.map(function(p){return '<div class="bar"><span>'+p[0]+'</span><span class="tr"><i style="width:'+(p[1]/mx*100).toFixed(1)+'%"></i></span><span class="n">€'+Math.round(p[1]).toLocaleString('en')+'</span></div>'}).join('')+'</div>';
  h+='<p class="muted" style="font-size:14.5px;margin-top:12px;max-width:85ch">Excludes long-haul flights. '+esc((L.notes||[]).join(' '))+'</p>';
  $('#bOut').innerHTML=h;
}

/* ---------- campaign switch ---------- */
function renderStart(){var c=C();$('#startSel').innerHTML=c.starts.map(function(s){var d=new Date(s+'T12:00:00Z');return '<option value="'+s+'"'+(s===startISO()?' selected':'')+'>'+fmt(d)+'</option>'}).join('')}
$('#startSel').addEventListener('change',function(){store.set('start:'+camp,this.value);renderHero();renderDays(true)});
function setCamp(c,first){camp=c;store.set('camp',c);$('#b15').setAttribute('aria-pressed',c==='c15');$('#b10').setAttribute('aria-pressed',c==='c10');
  curDay=-1;closeCard();renderStart();renderHero();renderDays();renderChips();renderGate();renderTabs();buildPins();
  if(map.isStyleLoaded()&&map.getSource('legs'))addOverlays();setDay(-1);fitAll()}
$('#b15').addEventListener('click',function(){setCamp('c15')});
$('#b10').addEventListener('click',function(){setCamp('c10')});
$('#foot').innerHTML=D.foot;
addEventListener('keydown',function(e){if(e.key==='Escape')closeCard()});
map.on('load',function(){if(curDay<0&&!selSite)fitAll()});
setCamp(camp,true);
})();
</script>
