rike","text":"Italian air traffic control strike 13:00–17:00. Expect delays."},{"from":"2026-11-22","to":"2026-11-22","affects":["flight:IT"],"sites":["vce"],"title":"Venice airport strike","text":"Venice airport security staff strike for 24 hours. Expect long queues."},{"from":"2026-11-01","to":"2026-12-12","legs":["t-ibk-szg","t-hallstatt-wien"],"title":"Rail works in Germany","text":"Until 12 Dec, Innsbruck–Salzburg trains take about 15 minutes longer and some Linz–Salzburg trains change. Check the ÖBB app the day before."}],"campaigns":{"c15":{"start":"2026-11-14","starts":["2026-11-12","2026-11-13","2026-11-14","2026-11-15","2026-11-16"],"kicker":"15 days · Italy · Austria · Hungary","title":"Dolomites to the Danube","lead":"Fifteen days in the quiet weeks between autumn and ski season. The Dolomites come first, while the passes are clear and the lakes still unfrozen. Then the train north to Innsbruck, Salzburg and Hallstatt, and the Christmas markets of Vienna and Budapest.","route":["Amsterdam","Venice","Cortina","Val di Funes","Bressanone","Bolzano","Innsbruck","Salzburg","Hallstatt","Vienna","Budapest"],"alerts":[{"t":"Rail strike in Italy","x":"A national rail strike is announced from 21:00 Fri 20 Nov to 20:00 Sat 21 Nov, so this plan takes the train to Innsbruck on Friday afternoon. Recheck scioperi.mit.gov.it a few days before."},{"t":"Lifts are closed","x":"Every Dolomites cable car is shut until 28 Nov or 4 Dec. The plan uses roads, lakes and short walks, and the road up to Alpe di Siusi is open to cars."}],"drive":"≈ 720 km","exitShort":"Budapest (BUD)","carDays":7,"fuel":110,"trainEUR":150,"ticketEUR":330,"acts":[{"n":"I","title":"The Crossing","days":[0]},{"n":"II","title":"The Pale Mountains","days":[1,2,3,4,5,6]},{"n":"III","title":"The Northern Road","days":[7,8,9]},{"n":"IV","title":"The Imperial City","days":[10,11]},{"n":"V","title":"The Pearl of the Danube","days":[12,13,14]}],"regions":[{"name":"Whole route","all":true},{"name":"Dolomites","sites":["cortina","giau","braies","funes","bressanone","siusi","carezza","bolzano","trecime","sella"],"maxZoom":10},{"name":"Tyrol & Salzburg","sites":["innsbruck","nordkette","salzburg","hallstatt","wolfgangsee"],"maxZoom":9},{"name":"Vienna","sites":["schoenbrunn","belvedere","stephansdom","hofburg","opera","rathausplatz"],"maxZoom":14},{"name":"Budapest","sites":["parliament","bastion","budacastle","citadella","szechenyi","markethall","basilica"],"maxZoom":14}],"exit":{"openjaw":"f-bud-home","ams":"f-bud-ams"},"days":[{"title":"The Crossing","legs":["f-ams-vce","vce-cortina"],"objs":["ams","vce","cortina"],"side":["amsterdam"],"rest":"cortina","epithet":"From the lowlands to the peaks","summary":"Today is a travel day. You fly from Amsterdam to Venice, pick up the rental car and drive about 1h50 north to Cortina. Try to arrive before the 16:40 sunset, because the last part of the road climbs into the mountains. Keep the evening simple with a short walk, dinner and an early night.","notes":{"ams":"If your layover is long enough, the Amsterdam side quest is a short train ride away. Keep a warm layer and gloves in your cabin bag.","vce":"At the rental desk, confirm winter tyres or chains on board, compulsory from Sun 15 Nov. Bring an International Driving Permit if your licence is non-EU.","cortina":"Take the A27 north, then the SS51 through the Cadore valleys. Park at your hotel and walk Corso Italia, the car-free main street, after dark."},"tips":["Fill the tank before you leave the motorway. Fuel stations are fewer once you enter the mountains.","Download offline maps for the Dolomites. Mobile signal can drop in deep valleys and on the passes."],"meals":"Eat lunch at the airport or a motorway stop. In Cortina, look for a pizzeria or trattoria serving casunziei, the local beetroot ravioli with poppy seeds.","restText":"Sleep in Cortina for three nights. Book a hotel or apartment that is open in mid-November and has parking.","warn":"If you land late, the last hour of driving is in the dark on mountain roads. Drive slowly and watch for ice on shaded bends after sunset.","drive":"About 145 km by car, 1 h 50 min of driving."},{"title":"The Giants' Road","legs":["giau-loop"],"objs":["giau","falzarego","limides","cinquetorri","cortina"],"side":["lagazuoi"],"rest":"cortina","epithet":"Sunrise on the high passes","summary":"Today you drive the Giau and Falzarego loop, about 72 km and 1h50 at the wheel. You start at Passo Giau for sunrise, then cross to Passo Falzarego and walk to Lago di Limides. The Cinque Torri come next, on foot because the chairlift is closed. You are back in Cortina for the late light before the 16:40 sunset.","notes":{"giau":"Leave Cortina by 06:15 to park at the pass by 06:50 for the 07:12 sunrise. Watch first light on Ra Gusela above the pass.","falzarego":"From Giau, drive down via Colle Santa Lucia and up to the pass. Park under the Lagazuoi cliffs; the cable car is closed this week.","limides":"Park by Rifugio Col Gallina, just below the pass toward Cortina. An easy 20–30 minute walk leads to the small lake under Tofana di Rozes.","cinquetorri":"The chairlift is closed. With little snow, walk up the forest road from Bai de Dones, an hour or more. Otherwise view the towers from below.","cortina":"Be back by 15:30. Walk Corso Italia and watch the peaks east of town, Cristallo and Sorapis, turn pink before the 16:40 sunset."},"tips":["Winter tyres or chains on board are compulsory from today. Keep the chains where you can reach them quickly.","Bring a thermos and warm gloves for sunrise. At 2,236 m the pass is far colder than Cortina."],"meals":"Pack breakfast for the pass and a picnic lunch, since most mountain huts are closed. For dinner in Cortina, try canederli, polenta with melted cheese or a game stew.","restText":"Second night in Cortina. Set out boots, gloves and chains tonight for tomorrow's loop to Misurina.","warn":"A snowstorm can close Passo Giau or Falzarego for hours. If Giau is closed, reach Falzarego through Pocol instead, or swap with tomorrow's Misurina day.","drive":"About 65 km by car, 1 h 10 min of driving."},{"title":"The Three Peaks","legs":["misurina-loop"],"objs":["trecroci","misurina","antorno","trecime","dobbiaco","landro","cortina"],"side":["sorapis"],"rest":"cortina","epithet":"Pilgrimage to the Three Peaks","summary":"Today is the Misurina loop, about 63 km and one hour of driving, so there is time to walk. You cross Passo Tre Croci to Misurina and Antorno, and decide there on the Tre Cime road walk, based on weather and ice. In the afternoon you drive to Lago di Dobbiaco and stop at Landro on the way back for the easy roadside view of the Tre Cime. You are in Cortina before dark.","notes":{"trecroci":"Stop briefly at the pass on the way to Misurina. Look back at Cristallo; the trail to Lago di Sorapis starts here.","misurina":"Park by the lake and walk the flat shore path, about 2.6 km around. The classic view looks south across the water to the Sorapis.","antorno":"Park by the small lake at the start of the Tre Cime road. Walk the shore for reflections and check the road conditions here.","trecime":"Expect the toll road closed and Rifugio Auronzo shut. Walking up from Antorno is unofficial; go only in clear, dry weather and turn back by 13:00.","dobbiaco":"Drive north through Val di Landro to the lake. Walk the flat shore path; parts may be frozen and it is very quiet in November.","landro":"On the way back south, park in the lay-by at the Drei Zinnen Blick. It is the easy way to see the Tre Cime without a hike.","cortina":"Return over Passo Cimabanche before 16:30. Spend the last Cortina evening on Corso Italia and pack the car for the early start to Braies."},"tips":["Decide on the Tre Cime walk at Antorno. Go only with clear sky, a dry road and enough daylight to return.","Carry food, water and a headlamp. Rifugio Auronzo and most huts are closed, so there is nothing to buy up high."],"meals":"Pack a picnic for Misurina. In Dobbiaco, stop at a bakery or café for a hot drink and apple strudel. Dinner in Cortina at a trattoria or pizzeria.","restText":"Third and last night in Cortina. Confirm your Bressanone booking for the next three nights.","warn":"The walk up the closed Tre Cime road is unofficial and has no services. Snow or ice means turn back and use the Landro viewpoint instead. Skip the Sorapis trail in icy conditions.","drive":"About 65 km by car, 1 h 10 min of driving."},{"title":"The Mirror of Braies","legs":["cortina-braies","braies-funes","funes-brixen"],"objs":["braies","funes","ranui","bressanone"],"side":["brunico","zans"],"rest":"bressanone","epithet":"Dawn at the emerald lake","summary":"You leave Cortina before dawn to see Lago di Braies when the water is calmest. Then you drive west past Brunico and Bressanone into Val di Funes, about 1h35. You reach the Santa Maddalena viewpoint and Ranui around midday, because this valley loses its sun early in November. In the late afternoon you check in at Bressanone, your base for three nights.","notes":{"braies":"Leave Cortina at 06:15 to arrive by 07:05, when the water is calmest. Park in the paid car park and walk the one-hour lake loop.","funes":"Park in Santa Maddalena village and follow the signs uphill to the viewpoint above the church. Come around midday, before the valley falls into shade.","ranui":"Use the paid car park and pay the €4 access fee. The chapel interior is closed, so you come for the outside view with the Odle behind.","bressanone":"Drive back down the valley, about 25 minutes. Check in, then walk the old town arcades and the cathedral square in the evening."},"tips":["Watch your step on the lake shore. Ice is possible, and the boathouse is closed for the season.","Use your phone or camera zoom at Funes to bring the Odle peaks closer behind the church."],"meals":"Breakfast from a thermos at Braies. For lunch in Brunico or Funes, find a Gasthaus with speck, Schlutzkrapfen spinach ravioli and apple strudel. Dinner in Bressanone's old town.","restText":"Three nights in Bressanone, which stays open all year. Pick a place in or near the old town with parking.","warn":"Shaded bends on the Braies road can be icy at dawn. Drive slowly and keep the chains ready.","drive":"About 155 km by car, 2 h 45 min of driving."},{"title":"The Sella Gate","legs":["brixen-gardena"],"objs":["ortisei","gardena","sella","novacella","bressanone"],"side":["seceda"],"rest":"bressanone","epithet":"Over the high Ladin passes","summary":"Today you cross into Val Gardena and climb two high passes. You see Ortisei first, then reach Passo Gardena and Passo Sella around midday, when the roads are least likely to be icy. On the way back you stop at Novacella Abbey for the 16:00 vineyard tour and tasting. The evening is short and easy in Bressanone.","notes":{"ortisei":"Arrive around 09:00 and park in a central garage. Walk the pedestrian centre and the wood-carving shop windows. The Seceda lift is closed this week.","gardena":"Drive up past Selva to the pass at 2,121 m. Stop at the top for the walls of the Sella group and the Cir spires.","sella":"Drop toward Plan de Gralba, then climb to Passo Sella. Park at the top for the huge face of the Sassolungo, the best view of the day.","novacella":"Arrive by 15:30 to see the courtyard and church, then join the pre-booked 16:00 vineyard tour and tasting. It runs on weekdays only. Tastings run in German or Italian on weekdays (English only on Fridays). The museum, €13 with last entry 16:15, works in any language.","bressanone":"The abbey is just north of town. Enjoy a relaxed dinner in the old town and an early night."},"tips":["Book the Novacella vineyard tour and tasting now. It runs on weekdays at 16:00 and needs a reservation.","The driver should skip the tasting or take tiny sips. Italian drink-driving limits are strict, and the roads are dark."],"meals":"For lunch in Ortisei or Selva, find a Gasthaus with goulash soup, canederli or turtres, the Ladin fried pastries. Dinner in Bressanone after the tasting.","restText":"Second night in Bressanone. Check tomorrow's weather for the Alpe di Siusi before you sleep.","warn":"Passo Gardena and Passo Sella can close for hours in a snowstorm. Check the pass status in the morning and keep chains on board.","drive":"About 120 km by car, 2 h 25 min of driving."},{"title":"The Great Alp","legs":["brixen-siusi"],"objs":["siusi","castelrotto","chiusa","bressanone"],"side":["zans"],"rest":"bressanone","epithet":"Walking the endless high meadow","summary":"Today belongs to the Alpe di Siusi, a huge high meadow under the Sassolungo. The road to Compatsch is open to cars this week, so you drive up early and walk the flat paths while the light is good. On the way down you stop in Castelrotto, then in Chiusa below Säben Abbey. You end the day back in Bressanone.","notes":{"siusi":"Drive up to Compatsch and park in P2, about €15 a day. Walk the wide, flat paths toward the Sassolungo; the gondolas are closed.","castelrotto":"Stop on the way down. Park at the edge of the village and walk to the tall bell tower on the main square.","chiusa":"Park by the river and walk the old lanes. The steep path up to Säben Abbey takes about 30 minutes; start down before the light fades.","bressanone":"Last night in Bressanone. Pack the car tonight, because tomorrow starts early at Lago di Carezza."},"tips":["Wear waterproof boots. The alp paths can hold snow and mud in November, even on sunny days.","Carry food and water. Most huts on the alp are closed until the ski season starts."],"meals":"Pack a picnic for the alp. Have a late lunch in Castelrotto or Chiusa. For the last Bressanone dinner, try speck dumplings and Kaiserschmarrn.","restText":"Last night in Bressanone. Confirm tomorrow night's room, in Innsbruck on the 15-day route or Bolzano on the 10-day route.","warn":"Snow can arrive on the alp any day. If the Compatsch road is icy or the alp is in cloud, visit Chiusa and Castelrotto first and decide later.","drive":"About 75 km by car, 1 h 35 min of driving."},{"title":"King Laurin's Garden","legs":["brixen-carezza","t-bz-ibk"],"objs":["carezza","costalunga","bolzano","otzi","innsbruck"],"side":["renon"],"rest":"innsbruck","epithet":"The roses of the Dwarf King","summary":"This is your last driving morning. You start at Lago di Carezza and Passo Costalunga, under the Latemar and the Rosengarten, then return the car in Bolzano around 13:00. The afternoon is for Ötzi and the sunset glow on the Rosengarten. You take the train to Innsbruck in the early evening, well before the Italian rail strike starts at 21:00.","notes":{"carezza":"Arrive by 09:00. Park in paid P1 and take the underpass, or use free P2 or P3. You see the lake from the loop path only.","costalunga":"Drive a few minutes up to the pass. Look north to the Rosengarten walls that will glow pink above Bolzano at sunset.","bolzano":"Return the car by about 13:00. Around 16:20, walk to the Talvera promenade and watch the Rosengarten glow before sunset, then head to the station.","otzi":"Open today until 18:00, €13. Go right after lunch and plan about 90 minutes, so you finish in time for the sunset glow.","innsbruck":"Arrive around 20:00 and check in. The Old Town and Marktplatz Christmas markets are open until 21:00, a short walk from the station."},"tips":["Book a Bolzano to Innsbruck train leaving by about 18:00. The trip takes about 2 hours.","The Bolzano Christmas market opens only on 26 Nov. Innsbruck's Old Town market is open tonight until 21:00."],"meals":"Coffee and a pastry near Carezza. For lunch in Bolzano, try a speck and cheese board or a Würstel stand near Piazza delle Erbe. Dinner at the Innsbruck markets.","restText":"Two nights in Innsbruck. Book a hotel near the station or the Old Town so you can walk in with your bags.","warn":"A national Italian rail strike starts at 21:00 tonight. Take a train by about 18:00, check for changes during the day and avoid the last evening trains.","drive":"About 95 km by car, 1 h 40 min of driving. Bolzano → Innsbruck by train (~2 h direct)."},{"title":"The Crown of the Alps","legs":[],"objs":["nordkette","goldenroof","innsbruck"],"side":["swarovski"],"rest":"innsbruck","maxZoom":13.5,"epithet":"The crown above the Inn","summary":"Today you stay in Innsbruck without a car. If the Nordkette lifts run, you go up in the morning for the view over the city and the Inn valley. The afternoon is for the Golden Roof and the Old Town, and the evening for the Christmas markets. If the lifts are closed for maintenance, you swap in Bergisel, the Hofkirche, Ambras Castle or Swarovski Crystal Worlds.","notes":{"nordkette":"Call +43 512 293344 the day before; autumn maintenance may stop the lifts. If open, ride to Seegrube and Hafelekar in the morning for clearer views.","goldenroof":"Walk to the Golden Roof after lunch. The Old Town Christmas market around it is open from 11:00, so the lanes are lively.","innsbruck":"Spend the evening at the Old Town and Marktplatz Christmas markets, open until 21:00. The Maria-Theresien-Strasse market opens only on 25 Nov."},"tips":["Dress warm for Hafelekar. At the top it is much colder and windier than in town.","Book tomorrow's Salzburg train today. Works until 12 Dec add about 15 minutes, so check the ÖBB app."],"meals":"Try Tiroler Gröstl, fried potatoes with bacon and egg, for lunch. At the markets, eat Kiachl, the Tyrolean fried dough, with hot punch or mulled wine.","restText":"Second night in Innsbruck. Pack tonight for the morning train to Salzburg.","warn":"The Nordkette reopens for winter on Fri 20 Nov after its autumn maintenance, so today should be fine. Call +43 512 293344 if the weather looks bad.","drive":""},{"title":"The Salt Fortress","legs":["t-ibk-szg"],"objs":["salzburg","hohensalzburg","getreidegasse"],"side":["koenigssee","krampus"],"rest":"salzburg","epithet":"Siege of the white fortress","summary":"You take a morning train to Salzburg and leave your bags at the hotel. The fortress comes first, while the light is good, then the Getreidegasse and Mozart's Birthplace in the old town. After dark you walk the Christkindlmarkt by the cathedral, open until 20:30 today. For a wilder evening, the Krampus Run at Henndorf starts at 17:00.","notes":{"salzburg":"Take a morning train, about 2 hours with the works, and drop your bags. After dark, walk the Christkindlmarkt on Domplatz and Residenzplatz, open until 20:30 today.","hohensalzburg":"Ride the funicular up in the late morning. The €15.50 basic ticket includes it. Walk the walls for the view over the domes and the Salzach.","getreidegasse":"Walk the narrow lane after lunch and look up at the iron shop signs. Most shops close on Sunday; Mozart's Birthplace at number 9 is a museum."},"tips":["The 24-hour Salzburg Card costs €35. Consider it if you plan the fortress, Mozart's Birthplace and other museums.","The Hellbrunn Adventzauber market, at the palace south of the city, is open on Sundays. It is a calmer afternoon option."],"meals":"Lunch on a schnitzel in an old-town inn, and share a Salzburger Nockerl soufflé. At the market, try a Bosna sausage and hot punch.","restText":"One night in Salzburg. Stay near the main station, where bus 150 leaves tomorrow, and book early in market season.","warn":"The Krampus Run at Henndorf am Wallersee starts at 17:00, outside the city. Check the bus back before you go; the Krampus can be rough with spectators.","drive":"Innsbruck → Salzburg by train (~2 h)."},{"title":"The Lake of Salt","legs":["b-szg-hallstatt"],"objs":["mirabell","wolfgangsee","hallstatt","skywalk","hallstattview"],"side":["dachstein"],"rest":"hallstatt","epithet":"Into the mountain of salt","summary":"You start with an early walk in the Mirabell Gardens, then take bus 150 past the Wolfgangsee and change in Bad Ischl for Hallstatt. You arrive around 12:45 and ride the new Salzbergbahn up to the Skywalk, with the salt mine if time allows. You come down for blue hour at the postcard viewpoint around 16:20. Sleeping in Hallstatt lets you see it after the day visitors leave.","notes":{"mirabell":"Walk the gardens around 08:30, a short walk from the station. The classic view runs across the flowerbeds to the fortress on the hill.","wolfgangsee":"Bus 150 runs along the lake after St. Gilgen. Watch from the window; there is no time to stop if you want the cable car today.","hallstatt":"Arrive around 12:45 at the Hallstatt bus stop, near the cable car. Drop your bags at the hotel if you can, then head straight up.","skywalk":"Ride the Salzbergbahn up (€29 return, €49 with the mine). Choose an early-afternoon mine tour over the last one at 15:00; the last ride down is 16:30.","hallstattview":"Walk north through the village to the postcard viewpoint for blue hour, around 16:20. Keep your voice down; people live in these houses."},"tips":["Check bus 150 and the 542/543 connection in Bad Ischl in the ÖBB app the day before.","Pack light today. You carry your bags on two buses and through the village lanes."],"meals":"Eat breakfast in Salzburg and carry snacks for the buses. For dinner in Hallstatt, try grilled lake fish such as char or whitefish.","restText":"One night in Hallstatt. Book early, because rooms are few, and ask for a lake view.","warn":"The Dachstein ice caves and 5Fingers are closed until 19 Dec. If the bus runs late, skip the mine and ride straight up; the last ride down is 16:30.","drive":"Salzburg → Bad Ischl → Hallstatt by bus (~2 h 15 – 2 h 40)."},{"title":"Bones and the Iron Road","legs":["t-hallstatt-wien"],"objs":["beinhaus","vienna","rathausplatz"],"side":["melk"],"rest":"vienna","epithet":"Skulls, ferries and the iron road","summary":"You have a slow morning in Hallstatt while the lanes are almost empty. At 11:30 you visit the Bone House, then take the ferry across the lake and the trains to Vienna, about four hours. You arrive around dark and check in. The evening is for the Christmas market at Rathausplatz.","notes":{"beinhaus":"Be at the door at 11:30 with €2 in cash. The small chapel holds painted skulls with names and dates. Fifteen minutes is enough.","vienna":"Take the Stephanie ferry around 12:30 (cash, €3–4) to the station, then the train to Attnang-Puchheim and a Railjet to Vienna, about four hours.","rathausplatz":"Drop your bags and go after dark. The market in front of City Hall is open until 22:00, with lights in the park trees."},"tips":["Carry euro cash today. The Bone House and the Stephanie ferry both take cash.","Check the ÖBB app the day before. Works change some Linz to Salzburg trains, and your connection may shift."],"meals":"Breakfast in Hallstatt and a bakery snack before the train. In Vienna, eat at the market with Käsekrainer sausage, roasted chestnuts and punch.","restText":"Two nights in Vienna. Book near a U1 stop, which links the old town with the main station.","warn":"The Bone House opens only 11:30–14:30 and takes cash only. Go right at 11:30 so you still make the ferry around 12:30 and reach Vienna by evening.","drive":"Hallstatt → Attnang-Puchheim → Vienna by train (~3 h 45 – 4 h)."},{"title":"The Imperial City","legs":[],"objs":["schoenbrunn","belvedere","stephansdom","hofburg","cafes","opera"],"side":["kaisergruft","naschmarkt"],"rest":"vienna","maxZoom":14.5,"epithet":"Palaces of the Habsburg crown","summary":"This is the long day in Vienna, so you start early at Schönbrunn. Late morning goes to the Upper Belvedere and Klimt, and the afternoon to St. Stephen's and the Hofburg. You rest at Café Central before the evening at the State Opera in standing room. The sun sets around 16:08, so plan outdoor views before 16:00.","notes":{"schoenbrunn":"Arrive early with a timed palace ticket booked online. Afterwards walk up to the Gloriette, then visit the courtyard Christmas market, open from 10:00.","belvedere":"Book a time slot around 11:30 (€23). See Klimt's The Kiss inside, then the small Christmas market in front of the palace.","stephansdom":"Walk the nave, then look up at the patterned tile roof from the square. Guided catacomb tours may run from 13:00; check on the day.","hofburg":"Cross the courtyards from Michaelerplatz to Heldenplatz. If you love horses, the Spanish Riding School morning exercise is at 10:00 today; swap it with Schönbrunn.","cafes":"Café Central is a short walk from Michaelerplatz. Expect a queue; go around 16:30 for coffee and apple strudel or Sachertorte before the opera.","opera":"Buy standing-room tickets online from 10:00 today, €13–18, or join the box-office quota 80 minutes before curtain. Tie a scarf on the rail to hold your place."},"tips":["Set a phone alarm for 10:00 to buy standing-room tickets online. Popular performances go quickly.","Buy a 24-hour or 48-hour transport pass. The U4 reaches Schönbrunn, and tram D stops at the Belvedere."],"meals":"Breakfast in a Viennese café. For lunch, eat at the Naschmarkt stalls or a Beisl tavern with Wiener schnitzel or goulash. Coffee and cake at Café Central.","restText":"Second night in Vienna. Book tomorrow morning's Railjet to Budapest from the main station.","warn":"Schönbrunn, the Belvedere and the opera all need timed or same-day tickets. Book the palace and Belvedere slots before you arrive, and keep the afternoon loose.","drive":""},{"title":"The Danube Express","legs":["t-wien-bud"],"objs":["budapest","parliament","shoes","basilica","chainbridge"],"side":[],"rest":"budapest","epithet":"Down the Danube to Pest","summary":"You take a morning Railjet from Vienna to Budapest, about 2h30. After lunch you tour the Parliament and walk along the river to the Shoes on the Danube Bank. At dusk you go to St. Stephen's Basilica for the Advent market and the light painting from 17:30. The night ends on the Chain Bridge or on a river cruise.","notes":{"budapest":"Take a morning Railjet from Wien Hauptbahnhof, about 2h30, to arrive by lunch. Drop your bags at the hotel and buy a transport pass.","parliament":"Book a guided tour at jegymester.hu for early afternoon. It lasts about 45 minutes; bring your passport for the security check.","shoes":"Walk a few minutes south of Parliament along the river. The iron shoes remember the Jews shot here in 1944–45. Stay quiet and respectful.","basilica":"Arrive around 17:00 for the Advent market on the square. The light painting on the façade starts at 17:30 every evening.","chainbridge":"Walk across the bridge after the light show for the lit Parliament and Castle Hill. For the full view, book an evening cruise from the Pest bank."},"tips":["Budapest uses forint. Cards work almost everywhere, but carry a little cash for market stalls.","Sunset is around 16:00. Plan the river walk for dusk and the cruise after dark."],"meals":"Lunch at a bistro near Parliament. At the Advent market, try kürtőskalács chimney cake, lángos and mulled wine. For dinner, goulash soup warms you up.","restText":"Two nights in Budapest. Stay in Pest near Deák tér, where the 100E airport bus leaves, to keep the last morning easy.","warn":"Parliament tours sell out. Book your slot at jegymester.hu before you leave Vienna, since tickets on the day are not guaranteed.","drive":"Vienna → Budapest-Keleti by train (2 h 20 – 2 h 40)."},{"title":"The Pearl of the Danube","legs":[],"objs":["bastion","budacastle","citadella","szechenyi","szimpla"],"side":["szentendre"],"rest":"budapest","maxZoom":14.5,"epithet":"Bastions, baths and ruin bars","summary":"You start on the Buda side at sunrise, when the Fisherman's Bastion is quiet and free. Then you walk Castle Hill and cross to Gellért Hill for the Citadella view. The afternoon is for a long soak at Széchenyi Bath, open until 22:00 today. You spend the last full night of the trip at Szimpla Kert.","notes":{"bastion":"Go for the 07:02 sunrise. Before 09:00 the upper terrace is free; later it costs 1,700 HUF. Look across the river to Parliament.","budacastle":"Walk south along Castle Hill from the Bastion, past Matthias Church, to the palace terraces above the river.","citadella":"Walk down and cross Elisabeth Bridge, then climb the hill paths. The park reopened in April 2026 and is free, with views of both banks.","szechenyi":"Go in the afternoon. Today it is open until 22:00 and Friday tickets cost 14,800 HUF. Bring flip-flops and a towel.","szimpla":"Go after dinner. Wander the rooms of this ruin bar in an old building in the Jewish Quarter; Friday nights get crowded."},"tips":["Gellért Bath is closed until 2028, so Széchenyi is your thermal bath on this trip.","The 1,700 HUF Bastion fee applies from 09:00 to 19:00. Outside those hours the upper terrace is free."],"meals":"Breakfast in a Buda café after sunrise. Lunch on goulash or chicken paprikash with nokedli dumplings. After the bath, eat lángos or a casual dinner in the Jewish Quarter.","restText":"Last night in Budapest. Pack tonight and check the 100E bus times from Deák tér to the airport.","warn":"Dry your hair fully before you leave the bath. Late-November evenings in Budapest are close to freezing.","drive":""},{"title":"The Final Gate","legs":["b-bud-airport","@exit"],"objs":["markethall","vorosmarty","bud"],"side":[],"rest":null,"epithet":"One last market, then home","summary":"This is your last morning. You visit the Great Market Hall early, then walk up Váci utca to the Christmas market on Vörösmarty Square. From Deák tér, the 100E bus takes you to the airport in about 40 minutes. Keep a good time buffer for your flight home.","notes":{"markethall":"Go early; Saturday hours are shorter. Buy paprika and salami on the ground floor and eat lángos at the upstairs stalls.","vorosmarty":"Walk up Váci utca to the Christmas market for a last mulled wine and souvenirs. It is a few minutes from Deák tér and the airport bus.","bud":"Take the 100E bus from Deák tér, about 40 minutes; the fare is about 2,500 HUF. Leave the centre at least three hours before your flight."},"tips":["Buy paprika and spices in sealed packs at the Market Hall so they travel well.","Put pálinka or Tokaji in checked luggage, or buy them after security."],"meals":"Breakfast at the Market Hall stalls, with lángos or sausages. A last chimney cake at Vörösmarty Square, and an early lunch before the airport bus.","restText":"No hotel tonight. Ask your hotel to keep your bags after check-out while you visit the markets.","warn":"The 100E fare and times may change. Check them on the day, and use an official taxi if the bus queue is long.","drive":"Deák tér → Budapest Airport by bus (~40 min)."}],"gate":{"code":"BUD","verdict":"Fly home from Budapest (BUD)","lead":"Your route runs west to east, so the cheapest and easiest exit is where it ends. Fares below are live Google Flights checks for one adult, one way, on Sat 28 Nov, taken 15–16 Oct 2026. They change daily.","why":"Budapest is the last stop, so there is no backtracking: the 100E bus reaches the airport in about 40 minutes. KLM flies nonstop to Amsterdam four times that day (≈ €125). Going home to Jakarta, Turkish (≈ €672) and KLM with Garuda via Amsterdam (≈ €689) are the best one-stop options. Vienna saves at most €70 but costs a 3.5-hour transfer.","ticket":{"openjaw":"Not booked yet? Buy one multi-city ticket: Jakarta → Amsterdam on Fri 13 Nov, Budapest → Jakarta on Sat 28 Nov. In our check this cost only 4–7% more than a plain return (KLM €846 vs €806, Emirates €885 vs €852), and it saves the extra flight back to Amsterdam. Never skip a leg of a ticket: airlines cancel the rest.","ams":"Already holding a return from Amsterdam? Take KLM from Budapest to Amsterdam on the last day (06:30, 12:25, 13:55 or 17:05, ≈ €125). Leave at least 3 hours before a long-haul flight, or book the two flights on one ticket so a delay is covered. Garuda now codeshares on KLM's Budapest–Amsterdam flight, so BUD → AMS → CGK can be one Garuda ticket (≈ €689)."},"rows":[{"name":"Budapest BUD","cc":"Hungary","reach":"Already there. Bus 100E from Deák tér, ~40 min, 2,500 HUF","ams":"KLM nonstop ×4, ≈ €125 (Wizz to Eindhoven ≈ €85)","long":"Turkish ≈ €672 · KLM+Garuda ≈ €689 · Emirates ≈ €734 · China Southern ≈ €382 via Guangzhou","fit":"★★★★★","note":"Sweet spot","win":true},{"name":"Vienna VIE","cc":"Austria","reach":"≈ 3 h 30 by train with a change at Wien Hbf (€9–52)","ams":"KLM ×4 ≈ €97, Austrian ×3 ≈ €136","long":"Etihad ≈ €607 · Qatar ≈ €648 · KLM+Garuda ≈ €685","fit":"★★★","note":"Saves \u003c €70, costs half a day"},{"name":"Munich MUC","cc":"Germany","reach":"≈ 7 h by train from Budapest","ams":"KLM ×5 ≈ €93, Lufthansa ×5 ≈ €107","long":"Etihad ≈ €491 · Saudia ≈ €563 · EVA ≈ €625","fit":"★★","note":"Only for an Alps-only trip"},{"name":"Venice VCE","cc":"Italy","reach":"≈ 8 h back by train","ams":"KLM ≈ €192, easyJet ≈ €100","long":"Turkish ≈ €537 · KLM+Garuda ≈ €656","fit":"★","note":"Right exit for the 10-day plan"},{"name":"Back via Amsterdam","cc":"Netherlands","reach":"One KLM flight (~2 h 10)","ams":"—","long":"From AMS: Etihad ≈ €350 · Garuda nonstop ≈ €437","fit":"★★★★","note":"Cheapest total (≈ €475) but two separate tickets"}],"oj":{"cols":["KLM","Emirates","Qatar","Etihad"],"rows":[{"cells":["Return to Amsterdam (28 Nov)","€806","€852","€867","€700"]},{"cells":["Open-jaw, home from Budapest","€846","€885","€926","not served"],"win":true},{"cells":["Open-jaw, home from Vienna","€1,013","€862","€931","€817"]}]},"foot":"Live one-way and multi-city fares from Google Flights for one adult in economy, checked 15–16 Oct 2026, departing Jakarta Fri 13 Nov. \"Basic\" fares exclude cabin bags. Gulf airline schedules have been less stable since the spring 2026 airspace disruptions, so book flexible fares where you can."}},"c10":{"start":"2026-11-14","starts":["2026-11-12","2026-11-13","2026-11-14","2026-11-15","2026-11-16","2026-11-17","2026-11-18","2026-11-19","2026-11-20","2026-11-21"],"kicker":"10 days · the Dolomites loop","title":"The Pale Mountains","lead":"Ten days on Dolomites roads in the quiet gap between autumn and ski season, with the lakes, passes and villages almost to yourself. The loop starts and ends in Venice, with the Trento Christmas market on the drive back.","route":["Amsterdam","Venice","Cortina","Val di Funes","Bressanone","Bolzano","Merano","Trento","Venice"],"alerts":[{"t":"Strikes on Sat 21 Nov","x":"Italian trains (until 20:00) and South Tyrol buses are on strike that day. You have the car, so the plan is unaffected. Recheck scioperi.mit.gov.it before you go."},{"t":"Lifts are closed","x":"Every Dolomites cable car is shut until 28 Nov or 4 Dec. The plan uses roads, lakes and short walks, and the road up to Alpe di Siusi is open to cars."}],"drive":"≈ 1010 km","exitShort":"Venice (VCE)","carDays":9,"fuel":130,"trainEUR":10,"ticketEUR":120,"acts":[{"n":"I","title":"The Crossing","days":[0]},{"n":"II","title":"The Pale Mountains","days":[1,2,3,4,5,6,7]},{"n":"III","title":"The Floating City","days":[8,9]}],"regions":[{"name":"Whole route","all":true},{"name":"Cortina side","sites":["cortina","giau","trecime","braies","misurina","falzarego"],"maxZoom":11},{"name":"Funes & Gardena","sites":["funes","bressanone","ortisei","sella","siusi","carezza","bolzano"],"maxZoom":11},{"name":"Venice","sites":["venice","vce"],"maxZoom":12}],"exit":{"openjaw":"f-vce-home","ams":"f-vce-ams"},"days":[{"title":"The Crossing","legs":["f-ams-vce","vce-cortina"],"objs":["ams","vce","cortina"],"side":["amsterdam"],"rest":"cortina","epithet":"From the lowlands to the peaks","summary":"Today is a travel day. You fly from Amsterdam to Venice, pick up the rental car and drive about 1h50 north to Cortina. Try to arrive before the 16:40 sunset, because the last part of the road climbs into the mountains. Keep the evening simple with a short walk, dinner and an early night.","notes":{"ams":"If your layover is long enough, the Amsterdam side quest is a short train ride away. Keep a warm layer and gloves in your cabin bag.","vce":"At the rental desk, confirm winter tyres or chains on board, compulsory from Sun 15 Nov. Bring an International Driving Permit if your licence is non-EU.","cortina":"Take the A27 north, then the SS51 through the Cadore valleys. Park at your hotel and walk Corso Italia, the car-free main street, after dark."},"tips":["Fill the tank before you leave the motorway. Fuel stations are fewer once you enter the mountains.","Download offline maps for the Dolomites. Mobile signal can drop in deep valleys and on the passes."],"meals":"Eat lunch at the airport or a motorway stop. In Cortina, look for a pizzeria or trattoria serving casunziei, the local beetroot ravioli with poppy seeds.","restText":"Sleep in Cortina for three nights. Book a hotel or apartment that is open in mid-November and has parking.","warn":"If you land late, the last hour of driving is in the dark on mountain roads. Drive slowly and watch for ice on shaded bends after sunset.","drive":"About 145 km by car, 1 h 50 min of driving."},{"title":"The Giants' Road","legs":["giau-loop"],"objs":["giau","falzarego","limides","cinquetorri","cortina"],"side":["lagazuoi"],"rest":"cortina","epithet":"Sunrise on the high passes","summary":"Today you drive the Giau and Falzarego loop, about 72 km and 1h50 at the wheel. You start at Passo Giau for sunrise, then cross to Passo Falzarego and walk to Lago di Limides. The Cinque Torri come next, on foot because the chairlift is closed. You are back in Cortina for the late light before the 16:40 sunset.","notes":{"giau":"Leave Cortina by 06:15 to park at the pass by 06:50 for the 07:12 sunrise. Watch first light on Ra Gusela above the pass.","falzarego":"From Giau, drive down via Colle Santa Lucia and up to the pass. Park under the Lagazuoi cliffs; the cable car is closed this week.","limides":"Park by Rifugio Col Gallina, just below the pass toward Cortina. An easy 20–30 minute walk leads to the small lake under Tofana di Rozes.","cinquetorri":"The chairlift is closed. With little snow, walk up the forest road from Bai de Dones, an hour or more. Otherwise view the towers from below.","cortina":"Be back by 15:30. Walk Corso Italia and watch the peaks east of town, Cristallo and Sorapis, turn pink before the 16:40 sunset."},"tips":["Winter tyres or chains on board are compulsory from today. Keep the chains where you can reach them quickly.","Bring a thermos and warm gloves for sunrise. At 2,236 m the pass is far colder than Cortina."],"meals":"Pack breakfast for the pass and a picnic lunch, since most mountain huts are closed. For dinner in Cortina, try canederli, polenta with melted cheese or a game stew.","restText":"Second night in Cortina. Set out boots, gloves and chains tonight for tomorrow's loop to Misurina.","warn":"A snowstorm can close Passo Giau or Falzarego for hours. If Giau is closed, reach Falzarego through Pocol instead, or swap with tomorrow's Misurina day.","drive":"About 65 km by car, 1 h 10 min of driving."},{"title":"The Three Peaks","legs":["misurina-loop"],"objs":["trecroci","misurina","antorno","trecime","dobbiaco","landro","cortina"],"side":["sorapis"],"rest":"cortina","epithet":"Pilgrimage to the Three Peaks","summary":"Today is the Misurina loop, about 63 km and one hour of driving, so there is time to walk. You cross Passo Tre Croci to Misurina and Antorno, and decide there on the Tre Cime road walk, based on weather and ice. In the afternoon you drive to Lago di Dobbiaco and stop at Landro on the way back for the easy roadside view of the Tre Cime. You are in Cortina before dark.","notes":{"trecroci":"Stop briefly at the pass on the way to Misurina. Look back at Cristallo; the trail to Lago di Sorapis starts here.","misurina":"Park by the lake and walk the flat shore path, about 2.6 km around. The classic view looks south across the water to the Sorapis.","antorno":"Park by the small lake at the start of the Tre Cime road. Walk the shore for reflections and check the road conditions here.","trecime":"Expect the toll road closed and Rifugio Auronzo shut. Walking up from Antorno is unofficial; go only in clear, dry weather and turn back by 13:00.","dobbiaco":"Drive north through Val di Landro to the lake. Walk the flat shore path; parts may be frozen and it is very quiet in November.","landro":"On the way back south, park in the lay-by at the Drei Zinnen Blick. It is the easy way to see the Tre Cime without a hike.","cortina":"Return over Passo Cimabanche before 16:30. Spend the last Cortina evening on Corso Italia and pack the car for the early start to Braies."},"tips":["Decide on the Tre Cime walk at Antorno. Go only with clear sky, a dry road and enough daylight to return.","Carry food, water and a headlamp. Rifugio Auronzo and most huts are closed, so there is nothing to buy up high."],"meals":"Pack a picnic for Misurina. In Dobbiaco, stop at a bakery or café for a hot drink and apple strudel. Dinner in Cortina at a trattoria or pizzeria.","restText":"Third and last night in Cortina. Confirm your Bressanone booking for the next three nights.","warn":"The walk up the closed Tre Cime road is unofficial and has no services. Snow or ice means turn back and use the Landro viewpoint instead. Skip the Sorapis trail in icy conditions.","drive":"About 65 km by car, 1 h 10 min of driving."},{"title":"The Mirror of Braies","legs":["cortina-braies","braies-funes","funes-brixen"],"objs":["braies","funes","ranui","bressanone"],"side":["brunico","zans"],"rest":"bressanone","epithet":"Dawn at the emerald lake","summary":"You leave Cortina before dawn to see Lago di Braies when the water is calmest. Then you drive west past Brunico and Bressanone into Val di Funes, about 1h35. You reach the Santa Maddalena viewpoint and Ranui around midday, because this valley loses its sun early in November. In the late afternoon you check in at Bressanone, your base for three nights.","notes":{"braies":"Leave Cortina at 06:15 to arrive by 07:05, when the water is calmest. Park in the paid car park and walk the one-hour lake loop.","funes":"Park in Santa Maddalena village and follow the signs uphill to the viewpoint above the church. Come around midday, before the valley falls into shade.","ranui":"Use the paid car park and pay the €4 access fee. The chapel interior is closed, so you come for the outside view with the Odle behind.","bressanone":"Drive back down the valley, about 25 minutes. Check in, then walk the old town arcades and the cathedral square in the evening."},"tips":["Watch your step on the lake shore. Ice is possible, and the boathouse is closed for the season.","Use your phone or camera zoom at Funes to bring the Odle peaks closer behind the church."],"meals":"Breakfast from a thermos at Braies. For lunch in Brunico or Funes, find a Gasthaus with speck, Schlutzkrapfen spinach ravioli and apple strudel. Dinner in Bressanone's old town.","restText":"Three nights in Bressanone, which stays open all year. Pick a place in or near the old town with parking.","warn":"Shaded bends on the Braies road can be icy at dawn. Drive slowly and keep the chains ready.","drive":"About 155 km by car, 2 h 45 min of driving."},{"title":"The Sella Gate","legs":["brixen-gardena"],"objs":["ortisei","gardena","sella","novacella","bressanone"],"side":["seceda"],"rest":"bressanone","epithet":"Over the high Ladin passes","summary":"Today you cross into Val Gardena and climb two high passes. You see Ortisei first, then reach Passo Gardena and Passo Sella around midday, when the roads are least likely to be icy. On the way back you stop at Novacella Abbey for the 16:00 vineyard tour and tasting. The evening is short and easy in Bressanone.","notes":{"ortisei":"Arrive around 09:00 and park in a central garage. Walk the pedestrian centre and the wood-carving shop windows. The Seceda lift is closed this week.","gardena":"Drive up past Selva to the pass at 2,121 m. Stop at the top for the walls of the Sella group and the Cir spires.","sella":"Drop toward Plan de Gralba, then climb to Passo Sella. Park at the top for the huge face of the Sassolungo, the best view of the day.","novacella":"Arrive by 15:30 to see the courtyard and church, then join the pre-booked 16:00 vineyard tour and tasting. It runs on weekdays only. Tastings run in German or Italian on weekdays (English only on Fridays). The museum, €13 with last entry 16:15, works in any language.","bressanone":"The abbey is just north of town. Enjoy a relaxed dinner in the old town and an early night."},"tips":["Book the Novacella vineyard tour and tasting now. It runs on weekdays at 16:00 and needs a reservation.","The driver should skip the tasting or take tiny sips. Italian drink-driving limits are strict, and the roads are dark."],"meals":"For lunch in Ortisei or Selva, find a Gasthaus with goulash soup, canederli or turtres, the Ladin fried pastries. Dinner in Bressanone after the tasting.","restText":"Second night in Bressanone. Check tomorrow's weather for the Alpe di Siusi before you sleep.","warn":"Passo Gardena and Passo Sella can close for hours in a snowstorm. Check the pass status in the morning and keep chains on board.","drive":"About 120 km by car, 2 h 25 min of driving."},{"title":"The Great Alp","legs":["brixen-siusi"],"objs":["siusi","castelrotto","chiusa","bressanone"],"side":["zans"],"rest":"bressanone","epithet":"Walking the endless high meadow","summary":"Today belongs to the Alpe di Siusi, a huge high meadow under the Sassolungo. The road to Compatsch is open to cars this week, so you drive up early and walk the flat paths while the light is good. On the way down you stop in Castelrotto, then in Chiusa below Säben Abbey. You end the day back in Bressanone.","notes":{"siusi":"Drive up to Compatsch and park in P2, about €15 a day. Walk the wide, flat paths toward the Sassolungo; the gondolas are closed.","castelrotto":"Stop on the way down. Park at the edge of the village and walk to the tall bell tower on the main square.","chiusa":"Park by the river and walk the old lanes. The steep path up to Säben Abbey takes about 30 minutes; start down before the light fades.","bressanone":"Last night in Bressanone. Pack the car tonight, because tomorrow starts early at Lago di Carezza."},"tips":["Wear waterproof boots. The alp paths can hold snow and mud in November, even on sunny days.","Carry food and water. Most huts on the alp are closed until the ski season starts."],"meals":"Pack a picnic for the alp. Have a late lunch in Castelrotto or Chiusa. For the last Bressanone dinner, try speck dumplings and Kaiserschmarrn.","restText":"Last night in Bressanone. Confirm tomorrow night's room, in Innsbruck on the 15-day route or Bolzano on the 10-day route.","warn":"Snow can arrive on the alp any day. If the Compatsch road is icy or the alp is in cloud, visit Chiusa and Castelrotto first and decide later.","drive":"About 75 km by car, 1 h 35 min of driving."},{"title":"King Laurin's Garden","legs":["brixen-carezza"],"objs":["carezza","costalunga","bolzano"],"side":["renon"],"rest":"bolzano","epithet":"The roses of the Dwarf King","summary":"You drive from Bressanone to Lago di Carezza and Passo Costalunga for morning views of the Latemar and the Rosengarten. In the afternoon you reach Bolzano, keep the car and settle in for two nights. Before sunset you walk to the river and watch the Rosengarten turn pink. The day is slower than the mountain days before it.","notes":{"carezza":"Arrive by 09:00. Park in paid P1 and take the underpass, or use free P2 or P3. You see the lake from the loop path only.","costalunga":"Drive a few minutes up to the pass. Look north to the Rosengarten walls that will glow pink above Bolzano at sunset.","bolzano":"Check in and park at the hotel or a garage. Walk the old town arcades, then watch the Rosengarten glow from the Talvera promenade from about 16:20."},"tips":["The Bolzano Christmas market opens only on 26 Nov, so plan the evening around the old town and dinner.","The Renon cable car is closed 8–24 Nov. If you want the earth pyramids, drive up instead."],"meals":"Coffee and a pastry near Carezza. Lunch in the Val d'Ega or in Bolzano. For dinner, try a Bolzano brew pub with Würstel, sauerkraut and dumplings.","restText":"Two nights in Bolzano. Book a hotel with parking or near a public garage, since you keep the car.","warn":"Tomorrow, local buses and trains are on strike and air traffic control strikes 13:00–17:00. Fill the tank today and plan to drive everywhere.","drive":"About 95 km by car, 1 h 40 min of driving."},{"title":"The Iceman's Vigil","legs":["bz-merano"],"objs":["otzi","bolzano","merano"],"side":["renon"],"rest":"bolzano","epithet":"Audience with the Iceman","summary":"Today you stay in the Bolzano area while local buses and trains are on strike. You see Ötzi when the museum opens at 10:00, then walk the old town. In the afternoon you drive to Merano for a long soak at Terme Merano, open until 21:00. You drive back to Bolzano in the evening.","notes":{"otzi":"Be at the door at 10:00, before the groups. Plan about 90 minutes; the €13 ticket covers the Iceman and his gear.","bolzano":"Walk Piazza Walther, the arcades of Via dei Portici and the fruit stalls of Piazza delle Erbe before lunch.","merano":"Drive to Merano after lunch and park near the spa. Terme Merano is open daily until 21:00, so soak through sunset and drive back after dark."},"tips":["The Merano Christmas market opens only on 26 Nov, but the Passer river promenade is a pleasant walk.","Bring swimwear and flip-flops for the spa, and ask at the desk about towel and robe rental."],"meals":"Breakfast in Bolzano. Lunch in the old town at a Würstel stand or a Gasthaus with dumplings. Dinner in Merano before the drive, or back in Bolzano.","restText":"Second night in Bolzano. Book the Venice hotel and check the car return at Piazzale Roma for tomorrow.","warn":"SAD buses and Trentino transport strike all day, and trains stop until 20:00. Air traffic control strikes 13:00–17:00. Use the car today.","drive":"About 65 km by car, 1 h 5 min of driving."},{"title":"The Floating City","legs":["bz-trento-venice"],"objs":["trento","venice"],"side":[],"rest":"venice","epithet":"From the mountains to the lagoon","summary":"This is the long drive out of the mountains, about 3h20 with the stop. You break the trip in Trento for its Christmas market, which opens at 10:00. In the afternoon you continue to Venice and return the car at Piazzale Roma. You reach the Grand Canal by boat around dusk.","notes":{"trento":"Arrive soon after the 10:00 opening and park in a garage near the centre. Walk the market stalls, then Piazza Duomo with its Neptune fountain.","venice":"Drive to Piazzale Roma and return the car there. Take vaporetto line 1 down the Grand Canal at dusk, then walk to your hotel."},"tips":["Fill the tank on the mainland before the bridge to Venice, so you return the car full.","Buy a 24-hour or 48-hour vaporetto pass at Piazzale Roma. You will ride the boats often."],"meals":"Lunch at the Trento market, with canederli, polenta, sausages and mulled wine. In Venice, eat cicchetti, small bar snacks, with a glass of wine at a bacaro.","restText":"One night in Venice. Pick a hotel near a vaporetto stop to keep tomorrow's airport trip simple, and book ahead.","warn":"November can bring acqua alta, high water in Venice. Check the tide forecast; if it is high, wear boots and allow more time.","drive":"About 220 km by car, 3 h of driving."},{"title":"The Final Gate","legs":["venice-vce","@exit"],"objs":["venice","vce"],"side":[],"rest":null,"epithet":"Last light on the lagoon","summary":"This is the last morning. You walk Venice early, from Rialto to St Mark's Square, while it is quiet. Then you collect your bags and go to the airport by Alilaguna water bus or by bus from Piazzale Roma. Leave plenty of time for the flight home.","notes":{"venice":"Go out early, when the streets are empty. Walk from Rialto to St Mark's Square before the crowds, then collect your bags.","vce":"Take the Alilaguna water bus for a last view of the lagoon, or the faster bus from Piazzale Roma. Leave at least three hours before your flight."},"tips":["Check your flight status in the morning. Yesterday's airport security strike may cause knock-on delays.","Choose the bus if your flight is before midday. The Alilaguna boat is slower."],"meals":"Breakfast with a cornetto and cappuccino standing at a bar, like the locals. If your flight is late, have a last cicchetti lunch near Rialto.","restText":"No hotel tonight. Ask your hotel to keep your bags after check-out while you walk.","warn":"If acqua alta is forecast, raised walkways and slower boats add time. Leave even earlier for the airport.","drive":"Venice → Venice Airport by bus (~20 min by bus)."}],"gate":{"code":"VCE","verdict":"Fly home from Venice (VCE)","lead":"The 10-day plan is a loop, so the exit is where it started. Fares are live Google Flights checks for Mon 23 Nov, taken 15–16 Oct 2026.","why":"You return the rental car where you picked it up, so there is no one-way fee, and you get a last evening in Venice. To Amsterdam, easyJet leaves at 14:10 (≈ €100 basic) or KLM three times (≈ €192). Going home to Jakarta, Turkish via Istanbul (≈ €537) is the sweet spot.","ticket":{"openjaw":"Not booked yet? Buy one multi-city ticket: Jakarta → Amsterdam, then Venice → Jakarta. On KLM this priced at €851 against €796 for a plain return.","ams":"Already holding a return from Amsterdam? Fly Venice → Amsterdam on Mon 23 Nov: easyJet 14:10 (≈ €100 basic) or KLM (≈ €192). Leave at least 3 hours before your long-haul flight."},"rows":[{"name":"Venice VCE","cc":"Italy","reach":"Already there. Bus ~20 min from Piazzale Roma","ams":"KLM ×3 ≈ €192 · easyJet 14:10 ≈ €100","long":"Turkish ≈ €537 · KLM+Garuda ≈ €656 · Emirates ≈ €771","fit":"★★★★★","note":"Sweet spot","win":true},{"name":"Milan MXP","cc":"Italy","reach":"≈ 3–4 h from Venice","ams":"easyJet ×2 (KLM left MXP in 2025)","long":"Etihad ≈ €362 · Turkish ≈ €523 · Thai ≈ €589","fit":"★★★","note":"Cheapest, but needs a night in Milan"},{"name":"Munich MUC","cc":"Germany","reach":"≈ 4 h drive from Bolzano + cross-border car drop","ams":"KLM ≈ €93 · Lufthansa ≈ €107","long":"Etihad ≈ €491 · EVA ≈ €625","fit":"★★","note":"Cross-border drop-off fee"},{"name":"Back via Amsterdam","cc":"Netherlands","reach":"One flight (~1 h 50)","ams":"—","long":"From AMS: Etihad ≈ €350 · Garuda nonstop ≈ €437","fit":"★★★★","note":"Two separate tickets"}],"oj":{"cols":["KLM","Emirates"],"rows":[{"cells":["Return to Amsterdam (23 Nov)","€796","€824"]},{"cells":["Open-jaw, home from Venice","€851","€930"],"win":true}]},"foot":"Live fares from Google Flights for one adult in economy, checked 15–16 Oct 2026. They change daily."}}},"visa":{"oneMain":"The Dutch rule: apply to the country you will stay in the longest. With {C} on top, a Dutch application only fits if the main purpose of the trip is in the Netherlands. Otherwise apply through {C}.","tie":"The Dutch government says: with equal stays, apply to the country you will visit first. You enter at Schiphol, so that is the Netherlands. The consulate makes the final call, so file the real itinerary and keep the bookings that match it.","cards":[{"h":"The rule (Visa Code, Article 5)","p":["(a) one destination: that country; (b) several destinations: the main destination by length of stay counted in days, or by purpose; (c) if no main destination can be set: the country whose external border you cross first.","Netherlands Worldwide and VFS Indonesia put it plainly: apply to the country you stay in longest; with equal stays, the one you visit first; otherwise the application is rejected."]},{"h":"What it means here","ul":["15-day plan: Italy 6 nights, Austria 6, Hungary 2. No single longest stay, so the first country you enter decides. You land at Schiphol, so it is the Netherlands.","10-day plan: all nights in Italy. Italy is the main destination, so apply through Italy unless your main purpose is in the Netherlands.","A visa from any Schengen country is valid in all of them. Leaving from Budapest or Venice is fine.","The Entry/Exit System has been running since 10 Apr 2026. Your fingerprints and photo are taken at the first border check."]},{"h":"Documents to line up","ul":["Travel insurance with at least €30,000 medical cover for the whole stay","This day-by-day itinerary and bookings that match it","Flight reservations in and out","Proof of funds and bank statements","Apply up to 6 months and at least 15 days before travel; book the VFS appointment early"]}]},"codex":{"bestiary":[{"id":"tyre-warden","name":"The Tyre Warden","real":"Italian winter-tyre rule from 15 November","threat":4,"where":"Most roads in South Tyrol and Belluno, plus the A22 Brenner motorway","when":"15 Nov to 15 Apr. Pick-up day 14 Nov falls one day before.","counter":"When booking, request winter tyres (better than chains) and get it in writing. At pick-up, check for the M+S or snowflake mark on the tyres. If you only get chains, practise fitting them once before leaving.","lore":"On the fifteenth day of the eleventh moon it wakes at every pass and asks to see your tyres."},{"id":"shutter-golem","name":"The Shutter Golem","real":"Lifts, huts and sights closed or under repair","threat":3,"where":"Dolomites cable cars and huts; Innsbruck Nordkette until 19 Nov; Budapest Gellért Bath","when":"Most Dolomites lifts early Nov to early Dec; Gellért closed until 2028","counter":"Check lift and hut websites a day ahead. Plan valley walks, lakes and pass drives. The Alpe di Siusi road is open to cars while its cable car rests. Nordkette reopens 20 Nov. In Budapest, use Széchenyi.","lore":"It locks every gondola the day after the last summer hiker leaves, and sleeps until the first skier knocks."},{"id":"ghost-innkeeper","name":"The Ghost Innkeeper","real":"Resort hotels and restaurants closed off-season","threat":2,"where":"Ski villages such as Cortina, Val Gardena, Alta Badia and Alpe di Siusi","when":"Early November to early December, until ski season opens","counter":"Book only places that confirm they are open on your dates. Check restaurant rest days and November closures, then call ahead. Eat in year-round towns like Bressanone or Bolzano, and carry snacks for drives.","lore":"He hangs a sign reading Chiuso per ferie and vanishes to the seaside until the snow returns."},{"id":"black-ice-wraith","name":"The Black Ice Wraith","real":"Ice on shaded trails and paths","threat":5,"where":"North-facing trails, forest paths, lake loops, steps and bridges in shade","when":"All day in the shade; worst in the morning and after thaw-freeze nights","counter":"Wear microspikes on any icy path and use poles. Prefer sunny, south-facing routes. Turn back if a glazed trail tilts toward a drop. Tell your host your route and return time. Emergency number is 112.","lore":"Invisible until your boots find it. Its favourite trick is the shady corner after a long sunny stretch."},{"id":"dusk-devourer","name":"The Dusk Devourer","real":"Short daylight, about nine hours","threat":3,"where":"Everywhere; deep valleys like Hallstatt lose direct sun even earlier","when":"Sunrise 07:05–07:25, sunset 16:00–16:40, dark soon after","counter":"Start hikes by 09:00 and be back at the car by 15:30. Carry a headlamp even on short walks. Drive mountain roads in daylight. Save museums, baths and markets for after dark.","lore":"It nibbles a few minutes of light every day and swallows whole afternoons."},{"id":"pass-blizzard","name":"The Pass-Sealing Blizzard","real":"Mountain passes closed during snowstorms","threat":4,"where":"High passes like Falzarego, Giau, Valparola, Gardena, Sella and Tre Croci","when":"During and after heavy snow, for hours or a few days","counter":"Check road reports and webcams each morning. Keep the valley route via Dobbiaco and Brunico as plan B between Cortina and Bressanone. Fill the tank, carry water, snacks and warm layers, and never follow sat-nav onto closed roads.","lore":"It drops a white wall across the road, then sits on it for a day, grinning at your sat-nav."},{"id":"strike-hydra","name":"The Strike Hydra","real":"Announced Italian transport strikes","threat":4,"where":"Italian rail, South Tyrol and Trentino local transport, air traffic control, Venice airport","when":"Fri 20 Nov 21:00 to Sun 22 Nov, four separate strikes","counter":"Rail 21:00 Fri 20 to 20:00 Sat 21; local transport all Sat 21; air traffic 13:00–17:00 Sat 21; Venice airport security all Sun 22. Reach Innsbruck by Friday afternoon. On the 10-day plan, drive or walk on Saturday. Strikes often shrink; recheck scioperi.mit.gov.it.","lore":"Cut off one head and two new dates appear. Its true names are written in the ministry ledger."},{"id":"market-cutpurse","name":"The Market Cutpurse","real":"Pickpockets in Christmas market crowds","threat":3,"where":"Christmas markets in Innsbruck, Salzburg, Vienna, Budapest; busy trams, metros and Venice vaporetti","when":"Evenings and weekends, from mid-November onward","counter":"Use a zipped inner pocket or a cross-body bag worn in front. Keep phones out of back pockets and off café tables. Carry one card plus a little cash, and leave the backup card in the hotel safe.","lore":"It smells of mulled wine and cinnamon, and it loves a crowd that stops to film the lights."},{"id":"grey-shroud","name":"The Grey Shroud","real":"Fog and inversion grey over the cities","threat":2,"where":"Vienna, Budapest and the Danube basin; sometimes Salzburg and Alpine valley floors","when":"Calm high-pressure spells in late autumn; can last several days","counter":"Plan indoor anchors like museums, cafés, the Opera and thermal baths. Széchenyi's outdoor pools steam nicely in the cold; Gellért is closed until 2028. Check webcams before paying for towers or viewpoints.","lore":"A lid of cloud that sits on the Danube for days. Viennese call it Hochnebel and order another coffee."},{"id":"forint-goblin","name":"The Forint Goblin","real":"Bad exchange rates and card conversion tricks","threat":3,"where":"Airport and tourist-street exchange booths, non-bank ATMs like Euronet, shops quoting euro prices","when":"Every payment or cash withdrawal in Hungary, especially on arrival","counter":"Pay by card in forints where possible. Withdraw HUF only from ATMs of real banks such as OTP, K&H or Erste. When a screen offers conversion to your home currency, decline and choose HUF. Never change money on the street.","lore":"It grins from a glowing booth with zero commission painted on the glass, and a rate that bites."}],"inventory":[{"group":"Frostward Armour (Clothing layers)","items":[{"id":"merino-base","name":"Merino base layers, top and leggings","why":"Warm when damp and resist odour over several days."},{"id":"fleece-mid","name":"Fleece or wool mid layer","why":"Add or remove as you move between −8 °C ridges and heated trains."},{"id":"puffy-jacket","name":"Insulated puffy jacket","why":"Main warmth for viewpoints, stops and evening markets; packs small."},{"id":"shell-jacket","name":"Waterproof, windproof shell jacket","why":"Blocks wind on passes and wet snow or drizzle in cities."},{"id":"warm-trousers","name":"Softshell or lined hiking trousers","why":"Shed wind and snow; jeans get cold, wet and stay wet."},{"id":"hat-gloves","name":"Warm hat plus two pairs of gloves","why":"Touchscreen liners for photos; insulated gloves for ridges and fitting chains."},{"id":"neck-gaiter","name":"Neck gaiter (buff)","why":"Covers face and neck in wind; doubles as a headband."},{"id":"wool-socks","name":"Wool hiking socks, 3–4 pairs","why":"Warm even when damp; keep a dry pair for after the hike."}]},{"group":"Boots of Unslipping (Footwear and traction)","items":[{"id":"hiking-boots","name":"Waterproof hiking boots with deep tread","why":"Dry feet in slush and snow; deep lugs grip cold, wet rock."},{"id":"microspikes","name":"Microspikes (light slip-on crampons)","why":"Slip over boots on icy shaded trails; light, small and quick to fit."},{"id":"trekking-poles","name":"Trekking poles","why":"Extra balance on icy descents; pack them in checked luggage."},{"id":"city-shoes","name":"Waterproof city shoes with grippy soles","why":"Wet cobbles and frosty pavements are slick; Venice can flood at high tide."}]},{"group":"Arcane Devices (Tech and power)","items":[{"id":"power-bank","name":"Power bank, 10,000–20,000 mAh","why":"Cold drains phones fast. Carry-on only on flights; keep it warm inside your jacket."},{"id":"plug-adapter","name":"Plug adapter for types C, F and L","why":"Italy uses C, F and L sockets; Austria and Hungary use C and F."},{"id":"offline-maps","name":"Offline maps","why":"Download Google Maps areas and a hiking app; mountain signal is patchy."},{"id":"headlamp","name":"Headlamp","why":"Sunset is 16:00–16:40; save the phone battery for maps and calls."},{"id":"esim","name":"EU data eSIM or SIM","why":"Maps, strike news and road reports on the go; one plan covers four countries."},{"id":"phone-mount","name":"Car phone mount and charging cable","why":"Hands-free navigation; holding a phone while driving brings heavy fines in Italy."}]},{"group":"Scrolls of Passage (Documents and money)","items":[{"id":"passport-visa","name":"Passport with Schengen visa","why":"Store photos of the passport and visa pages in the cloud as backup."},{"id":"idp","name":"International Driving Permit","why":"Italy expects non-EU licence holders to carry one with their home licence."},{"id":"insurance","name":"Travel insurance with €30,000+ medical cover","why":"Schengen minimum; check it covers winter hiking and helicopter mountain rescue."},{"id":"bank-cards","name":"Two bank cards with low foreign fees","why":"Use one daily and hide the other; Visa or Mastercard work best."},{"id":"euro-cash","name":"€50–100 in coins and small notes","why":"Parking machines, paid toilets and some mountain huts want cash."},{"id":"bookings","name":"Offline copies of bookings","why":"Hotel, car and train confirmations, plus the rental's winter-tyre promise in writing."}]},{"group":"Potions and Provisions (Health and extras)","items":[{"id":"swimwear","name":"Swimwear and flip-flops","why":"Needed for Széchenyi and hotel pools; flip-flops for cold, wet floors."},{"id":"thermos","name":"Small thermos","why":"Hot tea on a −5 °C ridge when every hut is closed."},{"id":"sun-kit","name":"Sunglasses, sunscreen and lip balm","why":"Low sun and snow glare at altitude burn skin and eyes quickly."},{"id":"daypack","name":"20–30 L daypack with rain cover","why":"Carries layers, spikes, water and snacks; the cover keeps them dry."},{"id":"first-aid","name":"Mini first-aid kit and personal medicine","why":"Blister plasters, painkillers, motion-sickness pills for hairpin passes, prescriptions in original boxes."}]}],"ledger":{"lodging":{"cortina":{"thrifty":[100,170],"comfort":[180,300],"lavish":[400,750]},"bressanone":{"thrifty":[80,125],"comfort":[130,210],"lavish":[230,400]},"bolzano":{"thrifty":[85,130],"comfort":[140,220],"lavish":[240,400]},"venice":{"thrifty":[90,150],"comfort":[170,300],"lavish":[450,900]},"innsbruck":{"thrifty":[95,140],"comfort":[150,230],"lavish":[230,360]},"salzburg":{"thrifty":[85,130],"comfort":[140,220],"lavish":[280,550]},"hallstatt":{"thrifty":[100,150],"comfort":[160,260],"lavish":[280,450]},"vienna":{"thrifty":[80,125],"comfort":[130,210],"lavish":[300,600]},"budapest":{"thrifty":[60,100],"comfort":[110,180],"lavish":[230,450]}},"food":{"IT":{"thrifty":[25,40],"comfort":[50,80],"lavish":[100,170]},"AT":{"thrifty":[30,45],"comfort":[55,85],"lavish":[110,180]},"HU":{"thrifty":[20,35],"comfort":[40,65],"lavish":[80,140]}},"car":{"rental7d":[180,400],"oneWayFee":[50,150],"fuelPerLitre":2.02,"tolls":"A27 Venice–Belluno ≈ €8; A22 hops ≈ €2–4; passes free. Pay by card, avoid yellow Telepass lanes.","parking":"Blue lines are paid (≈ €1–3/h, coins, cards or apps). Hotel parking ≈ €10–25/night. Never enter camera-watched ZTL zones."},"tickets":[{"id":"otzi","name":"Ötzi Museum (South Tyrol Museum of Archaeology)","eur":13,"note":"Bolzano. Home of Ötzi, the 5,300-y
