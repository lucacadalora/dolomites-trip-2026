istkindlmarkt from 19 Nov; Sun 9:00–20:30, Mon 10:00–20:30"},"epithet":"City of Salt and Song","lore":"The name means salt castle. For centuries prince-archbishops grew rich on salt from the mountains and built a Baroque city later called the Rome of the North. Mozart was born here in 1756, and the Old Town has been a UNESCO World Heritage Site since 1996.","quest":"Arrive Sunday morning and walk the Old Town. The Christkindlmarkt on Domplatz and Residenzplatz opens at 9:00. Hellbrunn's Advent market is open Sunday but closed Monday, so take bus 25 there in the afternoon if you want it. From 17:00 you can also catch the Krampus run at Henndorf.","time":"Sun 22 Nov – Mon 23 Nov morning · 1 night","light":"Sunset about 16:25. See the lit fortress from Makartsteg bridge.","access":"The Railjet from Innsbruck takes about 2 hours and crosses a corner of Germany, so keep your passport at hand. From Salzburg Hbf walk 20 minutes to the Old Town.","loot":"Beer from wooden barrels at the Augustiner Bräustübl in Mülln. Pick a stone mug, rinse it, pay, and have it filled at the barrel.","tip":"The 24-hour Salzburg Card (€35 in low season) covers the fortress, Mozart's Birthplace and city buses. Start it Sunday at 10:00 and it still works Monday morning.","danger":"Sunday market crowds draw pickpockets. Steep lanes on the Mönchsberg and Kapuzinerberg get slick when wet or icy.","gmaps":"Salzburger Christkindlmarkt, Domplatz, 5020 Salzburg","short":"Salzburg","cc":"AT","z":0,"fz":11},"hohensalzburg":{"name":"Hohensalzburg Fortress","alt":"Festung Hohensalzburg","type":"castle","country":"AT","region":"Salzburg · Salzburger Land","ll":[13.0481,47.7952],"status":{"code":"open","text":"Open daily 9:30–17:00; tickets include the funicular"},"epithet":"The Fortress Never Stormed","lore":"Archbishop Gebhard began the fortress in 1077, during the struggle between pope and emperor. No enemy ever took it by storm. Legend says that during a siege the defenders painted their last bull a new colour each day and paraded it on the walls, so the enemy thought they had plenty of food.","quest":"Ride the funicular up on Sunday afternoon and walk the walls as the sun sets, about 16:25. Look down on the Christmas market lights in Domplatz. It closes at 17:00, so be up by 15:00 to see the state rooms and museums first.","time":"Sun 22 Nov afternoon · 2 h","light":"Sunset from the walls about 16:25; floodlit after dark.","access":"The Festungsbahn funicular leaves from Festungsgasse, a 3-minute walk from Domplatz, and the ride takes about a minute. Walking up the steep lane takes about 20 minutes.","loot":"Salzburger Nockerl, a baked sweet soufflé whose three peaks stand for the city's hills. Order it at an Old Town restaurant below.","tip":"Walk down in daylight instead of riding. The path passes Nonnberg Abbey, founded around 714, where Maria von Trapp was a novice.","danger":"The footpath is steep and can be icy. After dark, take the funicular down.","fee":"Basic €15.50 · All-inclusive €19.20 (both include the funicular)","gmaps":"Festung Hohensalzburg, Mönchsberg 34, 5020 Salzburg","short":"Hohensalzburg","cc":"AT","z":11.9,"fz":14.100000000000001},"getreidegasse":{"name":"Getreidegasse & Mozart's Birthplace","alt":"Mozarts Geburtshaus · Getreidegasse 9","type":"museum","country":"AT","region":"Salzburg · Salzburger Land","ll":[13.0433,47.8],"status":{"code":"open","text":"Birthplace open daily, usually 9:00–17:30"},"epithet":"Where the Prodigy Was Born","lore":"Wolfgang Amadeus Mozart was born on the third floor of No. 9 on 27 January 1756, and his family lived here for 26 years. The lane outside is famous for its wrought-iron guild signs, which once showed each shop's trade to people who could not read.","quest":"Go early on Sunday, before the tour groups. Upstairs, find Mozart's childhood violin and his clavichord. Then walk the lane end to end and look up at the iron signs; even McDonald's has one.","time":"Sun 22 Nov morning · 1–1.5 h","light":"Narrow and shady; best at dusk when shop windows light up.","access":"From Domplatz walk about 5 minutes. From Salzburg Hbf walk about 20 minutes, or take a trolleybus to Hanuschplatz at the lane's east end.","loot":"An original Salzburger Mozartkugel in silver-blue foil from Café Konditorei Fürst, Brodgasse 13, where Paul Fürst created it in 1890.","tip":"Use the arched passages (Durchhäuser) between the houses to cut through to Universitätsplatz and the Collegiate Church. They are quieter than the lane.","gmaps":"Mozarts Geburtshaus, Getreidegasse 9, 5020 Salzburg","short":"Mozart's Birthplace","cc":"AT","z":12.2,"fz":14.399999999999999},"mirabell":{"name":"Mirabell Palace & Gardens","alt":"Schloss Mirabell · Mirabellgarten","type":"palace","country":"AT","region":"Salzburg · Salzburger Land","ll":[13.0416,47.8056],"status":{"code":"open","text":"Gardens free from early morning to dusk; flower beds bare in November"},"epithet":"A Palace Built for Love","lore":"Prince-Archbishop Wolf Dietrich built the palace in 1606 for Salome Alt, the woman he loved and mother of his 15 children. After his fall, his successor renamed it Mirabell. In 1964 Julie Andrews and the film's children danced through these gardens for Do-Re-Mi.","quest":"Walk the gardens on Monday morning before your bus. Find the Pegasus Fountain and the steps from Do-Re-Mi. The beds are bare, but the view across the garden to the fortress is the classic one. Bus 150 stops at Mirabellplatz, right outside.","time":"Mon 23 Nov morning · 45 min","light":"Sunrise about 07:25; the gardens are quiet before 09:00.","access":"From Salzburg Hbf walk 10 minutes down Rainerstraße. From the Old Town cross the Makartsteg footbridge and walk 5 minutes north.","loot":"A Melange coffee at Café Bazar on the river, a classic Salzburg coffee house five minutes from the gardens.","tip":"If the palace door is open, step inside to see the Angel Staircase, a Baroque marble stair crowded with playful cherubs.","gmaps":"Mirabellgarten, Mirabellplatz, 5020 Salzburg","short":"Mirabell","cc":"AT","z":11.9,"fz":14.100000000000001},"wolfgangsee":{"name":"Wolfgangsee · St. Gilgen","alt":"Abersee · St. Gilgen am Wolfgangsee","type":"lake","country":"AT","region":"Salzkammergut · Salzburger Land","ll":[13.3667,47.7667],"status":{"code":"limited","text":"St. Gilgen Advent market runs from 20 Nov, but it is closed Mon and Tue"},"epithet":"The Saint's Axe Lake","lore":"Legend says Bishop Wolfgang of Regensburg threw his axe from the Falkenstein cliff and built his church where it landed, the village now called St. Wolfgang. Mozart's mother was born in St. Gilgen in 1720, and his sister Nannerl later lived in the same house.","quest":"Bus 150 runs along the shore on Monday. For a short stop, get off at St. Gilgen, walk to the lake front and the house where Mozart's mother was born, then take the next bus to Bad Ischl. The Advent market is shut on Mondays, so keep it brief.","time":"Mon 23 Nov late morning · 1 h stop (optional)","light":"Low winter sun over the water around midday.","access":"Bus 150 from Salzburg Hbf or Mirabellplatz reaches St. Gilgen in about 50 minutes. The lake front is a 5-minute walk from the bus station.","loot":"A Zaunerstollen, a chocolate-coated wafer and nut-nougat bar, from Konditorei Zauner in Bad Ischl, where bus 150 ends.","tip":"Sit on the left side of bus 150 after St. Gilgen. The road follows the south shore and the lake opens up beside you.","danger":"Connections from Bad Ischl to Hallstatt thin out by early evening. Do not let a stop here push you into the dark.","gmaps":"Mozartplatz, 5340 St. Gilgen","short":"St. Gilgen","cc":"AT","z":7.9,"fz":11},"koenigssee":{"name":"Königssee","alt":"Königssee · St. Bartholomä","type":"lake","country":"DE","region":"Berchtesgadener Land · Bavaria","ll":[12.9864,47.5913],"status":{"code":"open","text":"Boats to St. Bartholomä run all year except 24 Dec; fewer trips in winter"},"epithet":"The King's Echo Lake","lore":"Electric boats have crossed this fjord-like lake since 1909, keeping its water clean. On the way, the boatman stops and plays a flugelhorn at the cliffs, and the echo answers. Legend says the Watzmann peaks above are a cruel king and his family, turned to stone.","quest":"Take the boat to St. Bartholomä, about 35 minutes each way, and walk around the red-domed church below the Watzmann's east face. Winter boats are fewer, so check the timetable and be on a boat back before dark, around 16:30.","time":"Sun 22 Nov (optional) · 5–6 h with travel","light":"Steep walls keep the lake shady; midday has the best light.","access":"Bus 840 runs from Salzburg Hbf or Mirabellplatz to Berchtesgaden, and some trips continue to Königssee. Otherwise change at Berchtesgaden Hbf to bus 841. Allow about 1 hour.","loot":"Enzian, a strong gentian schnapps distilled by Grassl in Berchtesgaden since 1602, sold in small bottles around town.","tip":"Carry your passport and visa. German police often check buses at the Austrian border.","danger":"Shaded paths at St. Bartholomä can be icy. If you miss the last boat you are stuck; there is no road out.","gmaps":"Königssee Schifffahrt, Seestraße 55, 83471 Schönau am Königssee","short":"Königssee","cc":"DE","z":8.5,"fz":12.5},"krampus":{"name":"Krampus Run at Henndorf","alt":"Krampuslauf Henndorf am Wallersee","type":"bones","country":"AT","region":"Flachgau · Salzburger Land","ll":[13.189,47.9003],"status":{"code":"open","text":"One evening only, Sun 22 Nov at 17:00"},"epithet":"Night of the Horned Ones","lore":"In Alpine folklore, Krampus is the horned, fur-clad companion of St. Nicholas. While the saint rewards good children, Krampus rattles chains and cowbells and threatens the naughty with birch switches. Groups in hand-carved wooden masks run through the villages from late November into early December.","quest":"Take bus 130 out of Salzburg in the afternoon and find a place at a barrier before 17:00. Watch the masked groups pass with cowbells and chains, then ride back to Salzburg. Check the last bus back before you go.","time":"Sun 22 Nov 17:00 · 3 h with travel","light":"Full dark by 17:00; a phone night mode helps.","access":"Bus 130 runs from Salzburg Hbf via Mirabellplatz to Henndorf. Get off at Henndorf a.W. Gemeindeamt in the village centre. The ride takes roughly half an hour.","loot":"A chocolate Krampus, sold in Austrian bakeries and supermarkets before 5 December, usually next to a chocolate St. Nicholas.","tip":"This is the only Krampus run near Salzburg on your evening there. Krampus Night itself is 5 December, well after your Salzburg stay.","danger":"Krampuses may swat legs with birch switches, and it can hurt. Stay behind barriers, keep children close, and never grab a mask.","gmaps":"Gemeindeamt Henndorf am Wallersee, 5302 Henndorf am Wallersee","short":"Krampus Run","cc":"AT","z":8.5,"fz":12.5},"hallstatt":{"name":"Hallstatt","alt":"","type":"town","country":"AT","region":"Salzkammergut · Upper Austria","ll":[13.6493,47.5622],"status":{"code":"open","text":"Quiet season; salt mine open daily; Christmas market only on 8 Dec"},"epithet":"Seven Thousand Years of Salt","lore":"People have mined salt above this village for about 7,000 years. Rich graves found here gave their name to a whole Iron Age civilisation, the Hallstatt culture. The village is so admired that in 2012 a copy of it was built in China.","quest":"Arrive Monday afternoon and drop your bags. Walk the lakeside lanes as the light fades, then reach the postcard viewpoint for blue hour, about 16:30–17:00. Book dinner ahead; in November some restaurants close for the season.","time":"Mon 23 Nov afternoon – Tue 24 Nov midday · 1 night","light":"Mountains block the sun much of the day; dark by 16:30.","access":"From Bad Ischl take bus 542 or 543 to Hallstatt Lahn, then walk 10 minutes north to the market square. By train, get off at Hallstatt station and take the ferry across the lake.","loot":"Smoked or grilled char (Saibling) from Lake Hallstatt, served at the inns along the water.","tip":"Overnight guests get the village almost to themselves. Day visitors leave by late afternoon, and the lanes stay quiet until about 09:00.","danger":"Steep stone steps and lanes ice over in the shade. Watch your footing near the unfenced lake edge after dark.","gmaps":"Marktplatz, 4830 Hallstatt","short":"Hallstatt","cc":"AT","z":0,"fz":11},"hallstattview":{"name":"Hallstatt Postcard Viewpoint","alt":"Postkartenblick · Aussichtspunkt Gosaumühlstraße","type":"viewpoint","country":"AT","region":"Salzkammergut · Upper Austria","ll":[13.6499,47.5646],"status":{"code":"open","text":"Free, open at all hours; far quieter in late November than in summer"},"epithet":"Frame of a Million Photos","lore":"The slim spire of the Protestant church, built in 1863, is the star of a view printed on calendars around the world. In 2023 locals put up a wooden fence here to slow the selfie crowds, and after an outcry it came down within days.","quest":"Come Monday at blue hour, about 16:30–17:00, when windows light up and the day crowds have gone. Brace your phone on something solid for a sharp shot. Return Tuesday around 08:00 for an empty morning frame.","time":"Mon 23 Nov 16:30 · Tue 24 Nov 08:00 · 20 min each","light":"Blue hour 16:30–17:00; by day the village sits in shade.","access":"From the market square walk about 5 minutes north along the lakeside lane, past the Protestant church, to Gosaumühlstraße. The viewpoint is beside the road, above the water.","loot":"A postcard of this same view from the shops on the market square, to compare with your own shot.","tip":"For a second angle, look back from the ferry to Hallstatt station on Tuesday. It shows the whole village from the water.","danger":"Local cars use this narrow road. Step out of the lane when you shoot, and watch for ice on the edge.","gmaps":"Hallstatt Viewpoint, Gosaumühlstraße, 4830 Hallstatt","short":"Viewpoint","cc":"AT","z":12.7,"fz":14.899999999999999},"beinhaus":{"name":"Hallstatt Bone House","alt":"Beinhaus · Karner St. Michael","type":"bones","country":"AT","region":"Salzkammergut · Upper Austria","ll":[13.6487,47.5636],"status":{"code":"limited","text":"Winter hours daily 11:30–14:30; €2, cash only"},"epithet":"Hall of Painted Skulls","lore":"The churchyard on this steep slope was too small, so after some years graves were opened and the bones moved here. The skulls were painted with names, dates and garlands of ivy, oak leaves or roses. About 1,200 skulls rest here, some 600 painted; the last was added in 1995.","quest":"Go on Tuesday at 11:30 when it opens. Climb the steps to the Catholic church, cross the tiny graveyard and step into the bone house beneath St. Michael's Chapel. Bring €2 in coins. Then catch an afternoon train to Vienna.","time":"Tue 24 Nov 11:30 · 20 min","light":"Dim little room; the churchyard outside overlooks the lake.","access":"From the market square climb the steps uphill to the Catholic parish church, about 5 minutes. The bone house stands in the churchyard.","loot":"A coffee and apple strudel at a café on the market square while you wait for the 11:30 opening.","tip":"It opens only at 11:30, so plan a train after about 12:30. One guide lists Wednesday to Sunday only, so ask your host on Monday evening.","danger":"The steps up to the church are steep and can be icy in the shade.","fee":"€2, cash only","gmaps":"Beinhaus Hallstatt, 4830 Hallstatt","short":"Bone House","cc":"AT","z":13,"fz":15.2},"skywalk":{"name":"Skywalk & Salt Mine","alt":"Salzwelten Hallstatt · Welterbeblick · Salzbergbahn","type":"mine","country":"AT","region":"Salzkammergut · Upper Austria","ll":[13.6436,47.5612],"status":{"code":"open","text":"Open daily; tours 9:30 to 15:00 (last start), last ride down 16:30"},"epithet":"Deep Halls of White Gold","lore":"Miners have dug salt from this mountain for 7,000 years. In 1734 they found the Man in Salt, a prehistoric miner preserved by the salt. A brine pipeline begun in 1595 still runs 40 km to Ebensee, and it is called the oldest pipeline in the world.","quest":"Ride the new Salzbergbahn up and step onto the Skywalk, about 350 m above the rooftops. Then book a mine tour to ride the miners' wooden slides deep inside. Do it Monday afternoon if you arrive by 13:30, or Tuesday at 9:00 before the bone house.","time":"Mon 23 Nov afternoon or Tue 24 Nov 9:00 · 2.5–3 h","light":"The Skywalk sits higher and may catch sun the village misses.","access":"Walk 10 minutes south from the market square to the Salzbergbahn valley station near the Hallstatt Lahn bus stop. From the top station, a path leads on to the mine entrance.","loot":"Hallstatt salt, plain or mixed with herbs, in small bags from the Salzwelten shop at the valley station.","tip":"Inside the mountain it stays around 8 °C all year, so the mine tour feels mild in November.","danger":"The path from the top station to the mine can be snowy or icy. Wear shoes with good grip.","fee":"Salzbergbahn return €29 · with mine tour €49","gmaps":"Hallstatt Skywalk Welterbeblick, 4830 Hallstatt","short":"Skywalk","cc":"AT","z":12.2,"fz":14.399999999999999},"dachstein":{"name":"Dachstein 5Fingers & Ice Caves","alt":"Dachstein Krippenstein · Rieseneishöhle · Mammuthöhle","type":"peak","country":"AT","region":"Dachstein · Upper Austria","ll":[13.6915,47.5297],"status":{"code":"sealed","text":"Krippenstein lifts closed until 19 Dec; ice caves shut until spring"},"epithet":"Frozen Halls of the Grail","lore":"When explorers pushed into the Giant Ice Cave in 1910, they named its frozen halls after the legends of King Arthur and the Grail, with a King Arthur's Dome and a Parzival's Dome. High above, the 5Fingers platform juts out over a 400 m drop toward Lake Hallstatt.","quest":"This one is closed during your trip. The Krippenstein lifts reopen on 19 Dec and the ice caves only in spring. From Hallstatt, look south-east toward the Krippenstein and save it for a summer return.","time":"Not this trip · lifts reopen 19 Dec","light":"Seen from Hallstatt on clear days; often hidden in cloud.","access":"Normally reached by the Dachstein Krippenstein cable car from Obertraun, one train stop past Hallstatt. Not running on 21–24 Nov 2026.","loot":"Kaiserschmarrn, torn sweet pancake with plum compote, served at mountain huts across the Dachstein in season.","tip":"For a high view this trip, use the Hallstatt Skywalk instead. It is open and only a short ride from the village.","danger":"With the lifts shut there is no quick rescue. Do not try to climb up on your own in November snow.","opens":"2026-12-19","gmaps":"5fingers Aussichtsplattform, Krippenstein, 4831 Obertraun","short":"Dachstein","cc":"AT","z":9.3,"fz":12.5},"vienna":{"name":"Vienna","alt":"Wien","type":"city","country":"AT","region":"Vienna · Austria","ll":[16.3757,48.1852],"status":{"code":"open","text":"Christmas markets open; sunset 16:08, highs around 4–7 °C"},"epithet":"Seat of the Double Eagle","lore":"For centuries Vienna was the heart of the Habsburg empire. Ottoman armies besieged it in 1529 and 1683, and both times the city held. In 1857 Emperor Franz Joseph ordered the old walls torn down, and the grand Ringstraße rose in their place.","quest":"Vienna is your base for two nights. On Tuesday evening, walk the Rathausplatz Christmas market. On Wednesday, start early at Schönbrunn, then see the Belvedere, the cathedral and the Hofburg, and end at the opera. Sunset is at 16:08, so do outdoor sights first and save markets and museums for the dark.","time":"Tue 24 Nov evening to Thu 26 Nov morning · 2 nights","light":"Sunrise 07:15, sunset 16:08. Markets light up at dusk.","access":"ÖBB Railjets from Attnang-Puchheim arrive at Wien Hauptbahnhof. From there, the U1 reaches Stephansplatz in three stops, about 5 min. Your Thursday Railjet to Budapest also leaves from Hauptbahnhof.","loot":"A Käsekrainer, a cheese-filled sausage with mustard, from the Bitzinger sausage stand on Albertinaplatz, near the opera.","tip":"A 48-hour ticket started on Tuesday evening still covers your Thursday morning ride to Hauptbahnhof. Buy it in the WienMobil app or at U-Bahn ticket machines.","danger":"Watch for cyclists on bike lanes, often painted red, that run along pavements. Pickpockets work busy U-Bahn platforms.","gmaps":"Vienna, Austria","short":"Vienna Hbf","cc":"AT","z":0,"fz":11},"rathausplatz":{"name":"Rathausplatz Christmas Market","alt":"Wiener Christkindlmarkt am Rathausplatz","type":"market","country":"AT","region":"Innere Stadt · Vienna","ll":[16.3587,48.2106],"status":{"code":"open","text":"Open daily 10:00–22:00 from 13 Nov to 26 Dec 2026"},"epithet":"Fair of the Iron Knight","lore":"In 1298 Duke Albrecht I granted Vienna's traders the right to hold a December market. Since 1975 the city's main Christmas market has filled this square below the neo-Gothic City Hall. From the tower top, the Rathausmann, an iron knight with a banner, keeps watch.","quest":"Come after dark on Tuesday. Walk the rows of stalls in front of City Hall, then follow the lit paths through Rathauspark. Warm up with Punsch, a hot fruit punch, or Glühwein, mulled wine. Find the giant Christmas tree in front of the Rathaus. Weekday evenings are calmer than weekends.","time":"Tue 24 Nov · after dark, around 18:00–20:30 · about 2 h","light":"Best after 16:30, when stalls, trees and the Rathaus façade glow.","access":"Tram 1, 71 or D to Rathausplatz/Burgtheater, right at the market. On foot it is about 15 min from Stephansplatz.","loot":"This year's collector mug from the drinks stalls. You pay a deposit with your first drink; keep the mug or return it for your money.","tip":"For a smaller crafts market, walk 12–15 minutes to the old lanes of Spittelberg. On weekdays it stays open until 21:30.","danger":"Pickpockets work the crowds. Keep phones and wallets zipped away. Watch for trams and bikes when you cross the Ring.","fee":"Free entry","opens":"2026-11-13","gmaps":"Wiener Christkindlmarkt, Rathausplatz, 1010 Vienna","short":"Rathausplatz","cc":"AT","z":12.1,"fz":14.3},"schoenbrunn":{"name":"Schönbrunn Palace & Christmas Market","alt":"Schloss Schönbrunn · Weihnachtsmarkt","type":"palace","country":"AT","region":"Hietzing · Vienna","ll":[16.3116,48.185],"status":{"code":"open","text":"Palace open daily; Christmas market 10:00–21:00, 6 Nov–6 Jan"},"epithet":"Summer Court of Emperors","lore":"In 1762 six-year-old Mozart played here for Maria Theresa, then jumped onto her lap and kissed her, his father wrote. Franz Joseph was born in this palace in 1830 and died here in 1916. Two years later the last emperor, Karl I, gave up power here.","quest":"Take the first State Apartments time slot of the day, before the tour groups arrive. When the Christmas market opens in the forecourt at 10:00, browse the craft stalls under the yellow façade. If time allows, climb through the free palace park to the Gloriette for the view back over Vienna.","time":"Wed 25 Nov · early morning · allow 2.5–3 h","light":"Low sun lights the garden side; the forecourt stays in shade.","access":"U4 to Schönbrunn, then walk about 8 min west to the main gate. From Stephansplatz, take the U1 one stop to Karlsplatz and change to the U4, about 20 min in total.","loot":"A hand-made tree ornament from the craft stalls in the forecourt. It is small and light, easy to pack for the train.","tip":"No photos are allowed inside the State Apartments. Save your camera for the market and the Gloriette view. The park and the market are free to enter.","gmaps":"Schönbrunn Palace, Schönbrunner Schloßstraße 47, 1130 Vienna","short":"Schönbrunn","cc":"AT","z":11.1,"fz":13.3},"belvedere":{"name":"Upper Belvedere · Klimt's The Kiss","alt":"Oberes Belvedere · Der Kuss","type":"museum","country":"AT","region":"Landstraße · Vienna","ll":[16.3809,48.1915],"status":{"code":"open","text":"Open daily 9:00–18:00; book a time-slot ticket"},"epithet":"Hall of the Golden Kiss","lore":"Prince Eugene of Savoy, the general who drove back the Ottomans, completed this summer palace in 1723. Klimt's The Kiss, glowing with gold leaf, was bought by the state in 1908, the year it was first shown. In the Marble Hall, the 1955 State Treaty that restored Austria's independence was signed.","quest":"Go straight to The Kiss, then to the Marble Hall where the State Treaty was signed. Outside, the Belvedere Christmas village in front of the palace opens at 11:00 on weekdays. Have a hot Punsch there before you take tram D back to the Ring.","time":"Wed 25 Nov · around midday · about 1.5 h","light":"Midday sun hits the south façade and its reflecting pond.","access":"Tram D to Schloss Belvedere stops at the gate, about 10 min from Oper. From Wien Hauptbahnhof it is a 10-minute walk north.","loot":"A print of The Kiss from the museum shop, flat enough to carry home in your bag.","tip":"Stand at the top of the garden, behind the palace, for the view Bellotto painted around 1760, with the cathedral spire on the skyline. The garden is free.","fee":"€23, time-slot ticket","gmaps":"Upper Belvedere, Prinz-Eugen-Straße 27, 1030 Vienna","short":"Belvedere","cc":"AT","z":11.6,"fz":13.8},"stephansdom":{"name":"St. Stephen's Cathedral & Catacombs","alt":"Stephansdom · Katakomben","type":"church","country":"AT","region":"Innere Stadt · Vienna","ll":[16.3731,48.2085],"status":{"code":"open","text":"Open daily; catacombs by guided tour only"},"epithet":"Spire Above the Bone Halls","lore":"The first Pummerin bell was cast in 1711 from Ottoman cannons captured in 1683. In April 1945 fire swept the roof and the bell crashed down; a successor, made partly from the broken bell's metal, hangs in the north tower. Below, the catacombs hold the bones of thousands and copper urns of Habsburg entrails.","quest":"Join a guided catacomb tour under the nave. Climb the 343 steps of the south tower before sunset at 16:08, or ride the north tower lift to the giant Pummerin bell. Inside, find the stone man peering from a window under the pulpit, said to be its sculptor.","time":"Wed 25 Nov · early afternoon · about 1.5 h with catacombs and tower","light":"Dim inside; the tiled roof shines in low afternoon sun.","access":"U1 or U3 to Stephansplatz. You come up right beside the cathedral.","loot":"Pink packs of Manner hazelnut wafers from the Manner shop on Stephansplatz. The cathedral is on every pack.","tip":"Catacomb visits are guided only. Check the next tour time as soon as you arrive, then climb the tower while you wait.","danger":"Pickpockets work Stephansplatz. Costumed sellers push expensive concert tickets; just walk on.","gmaps":"St. Stephen's Cathedral, Stephansplatz 3, 1010 Vienna","short":"Stephansdom","cc":"AT","z":12.1,"fz":14.3},"hofburg":{"name":"Hofburg & Spanish Riding School","alt":"Hofburg · Spanische Hofreitschule","type":"palace","country":"AT","region":"Innere Stadt · Vienna","ll":[16.3654,48.2066],"status":{"code":"limited","text":"Riding School morning-exercise dates for 24–26 Nov not yet released"},"epithet":"Hall of the White Stallions","lore":"For over 600 years the Habsburgs ruled from this palace, adding a wing in almost every reign. The Spanish Riding School was first recorded in 1565, and its Lipizzaner stallions still train under the chandeliers of a Baroque hall from the 1730s. The horses are born dark and turn white with age.","quest":"On Wed 25 Nov, try for the 10:00 morning exercise, when riders train the stallions to music. Late-November dates are not out yet, so check the Riding School calendar. If none fits, tour the Sisi Museum and Imperial Apartments, or see the crown of the Holy Roman Empire in the Treasury.","time":"Wed 25 Nov · 10:00 for the horses, or 1.5 h for the apartments","light":"Indoors mostly; Heldenplatz looks best at blue hour, around 16:30.","access":"U3 to Herrengasse, then 3 min on foot to the domed gate on Michaelerplatz. Trams 1, 71 and D stop at Burgring, on the Heldenplatz side.","loot":"Candied violets from Demel, the old imperial court confectioner on Kohlmarkt, two minutes from Michaelerplatz.","tip":"The 10:00 morning exercise clashes with a Schönbrunn morning. For both, see the horses first and do Schönbrunn after lunch; its market glows at dusk.","fee":"Morning exercise seats €28 or €19, standing €17","gmaps":"Hofburg, Michaelerkuppel, 1010 Vienna","short":"Hofburg","cc":"AT","z":12.2,"fz":14.399999999999999},"cafes":{"name":"Café Central","alt":"","type":"cafe","country":"AT","region":"Innere Stadt · Vienna","ll":[16.3655,48.2104],"status":{"code":"open","text":"Popular; expect to queue at the door at busy times"},"epithet":"Den of Chess and Exiles","lore":"Café Central opened in 1876 in the Palais Ferstel, built as a bank and stock exchange. Before 1914 Leon Trotsky, then a little-known Russian exile, played chess here. The poet Peter Altenberg gave the café as his address, and a life-size figure of him still sits by the door.","quest":"Come in the late afternoon, when dark falls early. Order a Melange, Vienna's milky coffee, and a slice from the cake counter. Sit as long as you like under the vaulted ceiling. The Am Hof Christmas market is three minutes away.","time":"Wed 25 Nov · late afternoon · 45–60 min","light":"Indoors under vaults and lamplight; any hour works.","access":"U3 to Herrengasse, then a 2-minute walk to the corner of Herrengasse and Strauchgasse.","loot":"A Melange on a small silver tray with a glass of water, served the old coffee-house way.","tip":"Wait at the door to be seated. When you pay, tell the waiter the total you want to pay, adding about 10%.","gmaps":"Café Central, Herrengasse 14, 1010 Vienna","short":"Café Central","cc":"AT","z":12.9,"fz":15.100000000000001},"opera":{"name":"Vienna State Opera · Standing Room","alt":"Wiener Staatsoper · Stehplatz","type":"opera","country":"AT","region":"Innere Stadt · Vienna","ll":[16.369,48.203],"status":{"code":"open","text":"Standing room €13–18, on sale from 10:00 on the day; check the program"},"epithet":"Temple of the Standing Faithful","lore":"The opera opened in 1869 with Mozart's Don Giovanni. Vienna mocked the new building, and neither architect lived to see opening night; van der Nüll took his own life, and Sicardsburg died weeks later. Bombs gutted the house in March 1945, and it reopened in 1955 with Beethoven's Fidelio.","quest":"Check the program for Wed 25 Nov. Buy standing room online or at the box office from 10:00 that day; set an alarm, since you will be at Schönbrunn. If you miss out, queue for the extra places sold 80 minutes before curtain.","time":"Wed 25 Nov · evening · 3–4 h with the queue","light":"Floodlit after dark; best photos from across the Ring.","access":"U1 or U4 to Karlsplatz, exit Oper, then 2 min on foot. Trams 1, D and 71 stop at Oper/Karlsplatz, beside the building.","loot":"The original Sachertorte at Café Sacher, in the hotel right behind the opera. Have it with unsweetened whipped cream, the Viennese way.","tip":"Create your account on the State Opera website the day before, so you can pay within seconds at 10:00. Standing room for popular shows sells out fast.","danger":"Costumed sellers near the opera sell tickets for their own concerts. Buy only from the State Opera box office or website.","fee":"Standing room €13–18","gmaps":"Vienna State Opera, Opernring 2, 1010 Vienna","short":"State Opera","cc":"AT","z":12.4,"fz":14.600000000000001},"kaisergruft":{"name":"Imperial Crypt","alt":"Kaisergruft · Kapuzinergruft","type":"bones","country":"AT","region":"Innere Stadt · Vienna","ll":[16.3702,48.2058],"status":{"code":"open","text":"Open daily 10:00–18:00, last entry 17:30"},"epithet":"Where Emperors Must Knock","lore":"Since 1633 Capuchin friars have guarded the Habsburg dead here, about 150 in all, among them 12 emperors. At Habsburg funerals the master of ceremonies knocked and listed the dead man's titles, and the friars said they did not know him. Only when he was named a mortal, sinful human did the door open, last in 2011.","quest":"Go down into the vaults under the Capuchin Church. Find Maria Theresa's huge double tomb with her husband, the plain copper coffin of her son Joseph II at its foot, and Empress Elisabeth beside Franz Joseph and their son Rudolf. It is a good last stop once the short day turns dark.","time":"Wed 25 Nov · late afternoon, in by 17:30 · about 40 min","light":"Underground under electric light; daylight does not matter here.","access":"On Neuer Markt, 5 min on foot from Stephansplatz (U1, U3) via Kärntner Straße. The entrance is beside the Capuchin Church.","loot":"In a nearby café, order a Kapuziner, black coffee with a dash of cream, named after these friars' brown robes.","tip":"Inside, find Countess Fuchs, Maria Theresa's governess. She is the only person buried here from outside the imperial family, close to her empress.","fee":"€15","gmaps":"Kaisergruft, Tegetthoffstraße 2, 1010 Vienna","short":"Kaisergruft","cc":"AT","z":13,"fz":15.2},"naschmarkt":{"name":"Naschmarkt","alt":"","type":"food","country":"AT","region":"Mariahilf · Vienna","ll":[16.3631,48.1985],"status":{"code":"open","text":"Market stalls open Mon–Sat; Wed 25 Nov is a full market day"},"epithet":"The Nibblers' Mile","lore":"The name probably comes from the ash-wood milk buckets once sold here, though it sounds like naschen, German for nibbling. When the Wien River was vaulted over around 1900, the market spread out on top of it.","quest":"Walk the stalls from Karlsplatz toward Kettenbrückengasse. Taste olives, cheese and spices, then sit down for a warm lunch at one of the market restaurants. It lies on the U4, so it fits neatly between Schönbrunn and the Belvedere.","time":"Wed 25 Nov · late morning or lunch · about 1 h","light":"Midday is brightest; most stalls sit under awnings.","access":"U4 to Kettenbrückengasse or Karlsplatz; the market runs between the two stations. From Schönbrunn it is a direct U4 ride of about 10 min.","loot":"A small bottle of dark-green Styrian pumpkin-seed oil from a deli stall. Ask to taste it first.","tip":"From the stalls near Kettenbrückengasse, look up at Linke Wienzeile 38 and 40. Otto Wagner covered them in gold medallions and painted tiles.","danger":"Some restaurant stalls price fish and seafood per 100 g. Ask for the full price before they cook.","gmaps":"Naschmarkt, 1060 Vienna","short":"Naschmarkt","cc":"AT","z":12.6,"fz":14.8},"melk":{"name":"Melk Abbey","alt":"Stift Melk","type":"abbey","country":"AT","region":"Wachau · Lower Austria","ll":[15.3319,48.2286],"status":{"code":"limited","text":"Winter visits by guided tour only; 2026 tour times not yet confirmed"},"epithet":"Golden Abbey above the Danube","lore":"In 1089 Margrave Leopold II gave his castle on this rock to Benedictine monks, and they have lived here ever since. Between 1702 and 1736 it was rebuilt in yellow and gold Baroque, to plans by Jakob Prandtauer. In The Name of the Rose, Umberto Eco's narrator is a novice from here, Adso of Melk.","quest":"Break up your Hallstatt to Vienna train day here. In winter the abbey is usually shown by guided tour only, through the imperial rooms, the Marble Hall, the library and the golden abbey church. Check the 2026 tour times, then plan your trains around them.","time":"Tue 24 Nov · midday stop on the train day · 2.5–3 h","light":"Low midday sun warms the yellow walls above the Danube.","access":"Railjets do not stop at Melk. Change to a regional train at Amstetten or St. Pölten. From Melk station, walk about 15 min uphill to the abbey.","loot":"A jar of Wachau apricot jam, or apricot brandy, from the shops in Melk's old town below the abbey.","tip":"Last winter, tours ran at 11:00, 13:30 and 15:00. Check the 2026 times, and plan where to leave your luggage before you go.","gmaps":"Melk Abbey, Abt-Berthold-Dietmayr-Straße 1, 3390 Melk","short":"Melk Abbey","cc":"AT","z":7.9,"fz":11},"budapest":{"name":"Budapest","alt":"","type":"city","country":"HU","region":"Danube · Central Hungary","ll":[19.0837,47.5003],"status":{"code":"open","text":"Christmas markets open; daylight about 07:05–15:58; 0–6 °C."},"epithet":"Queen of the Danube","lore":"Three rival towns, Buda, Óbuda and Pest, merged into one city in 1873, joining the hills of the west bank to the flat east bank. For the 1896 celebration of a thousand years of Hungary, Budapest opened continental Europe's first underground railway, which still runs today as metro line M1.","quest":"Base yourself in District V or VII for two nights, so you can walk to most sites. Use the metro for the rest. Christmas markets are open, so plan your evenings around them. Daylight is short, so do outdoor views in the morning and save markets and baths for after dark.","time":"Thu 26 Nov late morning – Sat 28 Nov · 2 nights","light":"Daylight about 07:05–15:58; fully dark by about 16:35.","access":"Railjets from Vienna stop at Kelenföld and usually end at Keleti. From Keleti, M2 (red line) reaches Deák Ferenc tér, the central hub, in 3 stops.","loot":"Túró Rudi, a chocolate-covered sweet curd bar, from the chilled shelf of any supermarket.","tip":"Buy transit tickets in the BudapestGO app. When a card machine offers euros or forints, always choose forints (HUF).","danger":"Skip exchange booths and standalone Euronet ATMs; their rates are poor. Use bank ATMs and decline conversion to euros.","gmaps":"Budapest, Hungary","short":"Budapest-Keleti","cc":"HU","z":0,"fz":11},"parliament":{"name":"Hungarian Parliament","alt":"Országház","type":"parliament","country":"HU","region":"Lipótváros, District V · Budapest","ll":[19.0459,47.507],"status":{"code":"limited","text":"Guided tours only. Book ahead; tours may be cancelled during sessions."},"epithet":"Keeper of the Holy Crown","lore":"Tradition says Pope Sylvester II sent a crown to King Stephen in the year 1000. The Holy Crown, its cross bent for centuries, was kept in the United States after the Second World War, latterly at Fort Knox, and came home in 1978. Since 2000 it has rested beneath this 96-metre dome, guarded day and night.","quest":"Take the 45-minute guided tour on Thursday afternoon. Climb the grand staircase, stand under the gilded dome, and see the Holy Crown watched by guards with drawn sabres. Photos of the crown are not allowed. Afterwards, walk 5 minutes south along the river to the Shoes memorial before dusk.","time":"Thu 26 Nov · 13:00–15:15 (tour about 45 min)","light":"Indoor tour; the river façade is floodlit gold after dark.","access":"M2 (red line) to Kossuth Lajos tér. The Visitor Centre entrance is on the north side of the building, about 3 minutes' walk from the metro exit.","loot":"A Holy Crown postcard or replica from the gift shop in the Parliament Visitor Centre.","tip":"Book the English tour at jegymester.hu/parlament before you travel. Arrive 20 minutes early for airport-style security at the Visitor Centre.","gmaps":"Hungarian Parliament Building, Kossuth Lajos tér 1-3, Budapest","short":"Parliament","cc":"HU","z":11.4,"fz":13.600000000000001},"shoes":{"name":"Shoes on the Danube Bank","alt":"Cipők a Duna-parton","type":"viewpoint","country":"HU","region":"Pest Danube Bank, District V · Budapest","ll":[19.0448,47.5039],"status":{"code":"open","text":"Open at all hours and free. Sunset on Thu 26 Nov is about 15:58."},"epithet":"In Memory, 1944–1945","lore":"In the winter of 1944–45, Arrow Cross militiamen led thousands of people, most of them Jews, to the edge of the Danube. They made them take off their shoes, then shot them so the river carried them away. In 2005, Can Togay and Gyula Pauer set 60 pairs of iron shoes here in their memory.","quest":"Come on Thursday as the light fades, after the Parliament tour. Walk the line of shoes slowly. Stand quietly for a moment, then look across to Buda as the lights come on. Keep photos respectful and do not pose with the shoes.","time":"Thu 26 Nov · 15:30–16:15, as daylight fades","light":"Sunset about 15:58; blue dusk until about 16:30.","access":"M2 to Kossuth Lajos tér, then walk 5 minutes south along the river. Cross the road only at marked crossings; the memorial sits on the edge of the embankment.","loot":"No loot here. Visitors leave candles, flowers or small stones in the shoes; you may do the same.","tip":"Read the three cast-iron plaques along the stone bench behind the shoes. They explain the memorial in Hungarian, English and Hebrew.","danger":"There is no railing at the river edge, and the stones get slippery at dusk. Cross the busy road only at marked crossings.","fee":"Free","gmaps":"Shoes on the Danube Bank, Budapest","short":"Shoes on the Danube","cc":"HU","z":13,"fz":15.2},"basilica":{"name":"St. Stephen's Basilica & Advent Feast","alt":"Szent István-bazilika · Advent Bazilika","type":"church","country":"HU","region":"Lipótváros, District V · Budapest","ll":[19.054,47.5008],"status":{"code":"open","text":"Advent Feast 13 Nov–1 Jan; Thu 11:00–22:00; façade show from 17:30."},"epithet":"Shrine of the Holy Right","lore":"The half-built dome collapsed in 1868, and the church needed three architects and 54 years before it was finished in 1905. Its dome rises 96 metres, as high as Parliament's, for 896, the traditional year of the Magyar conquest. A side chapel keeps the Holy Right, the mummified hand of King Stephen.","quest":"Reach the square by 17:20 and watch the light painting on the façade from 17:30. Then walk the Advent Feast stalls, eat something hot, and warm your hands on a cup of forralt bor (mulled wine). On Thursday the market stays open until 22:00.","time":"Thu 26 Nov · 17:15–19:30","light":"Façade light painting from 17:30; warm stall lights after dark.","access":"M1 to Bajcsy-Zsilinszky út, 2 minutes' walk, or M3 to Arany János utca, 4 minutes. From the Shoes memorial, walk about 15 minutes via Zrínyi utca.","loot":"Kürtőskalács (chimney cake), baked on rotating spits at the market stalls. Try walnut or cinnamon.","tip":"Watch the light painting from the Zrínyi utca end of the square to see the whole façade, then move closer for the stalls.","danger":"Pickpockets work the evening crowds. Keep phones and wallets in front or zipped pockets.","fee":"Market and façade light show are free.","opens":"2026-11-13","gmaps":"St. Stephen's Basilica, Szent István tér 1, Budapest","short":"Basilica","cc":"HU","z":12.1,"fz":14.3},"chainbridge":{"name":"Chain Bridge & Danube Night Cruise","alt":"Széchenyi lánchíd","type":"bridge","country":"HU","region":"Danube, Districts I & V · Budapest","ll":[19.0436,47.4989],"status":{"code":"open","text":"Bridge open to walkers all night; confirm November cruise times when booking."},"epithet":"The Lions' Crossing","lore":"Opened on 20 November 1849, it was the first permanent bridge to join Buda and Pest. Retreating German troops blew it up in January 1945, and it reopened in 1949. Legend says its stone lions have no tongues; they do, but you cannot see them from the street.","quest":"After dinner, board a one-hour evening cruise from the Vigadó tér piers and glide past the floodlit Parliament and Buda Castle. Pick a boat with a heated, glass-covered deck, because the river air is near freezing. After landing, walk across the Chain Bridge to Buda and back.","time":"Thu 26 Nov · about 20:00–22:00","light":"Bridge, Parliament and Castle floodlit after dark; best from the water.","access":"M1 to Vörösmarty tér, then walk 5 minutes to the river. Legenda's evening cruises leave from dock 7 on Jane Haining rakpart, by Vigadó tér, 5 minutes south of the bridge.","loot":"Pálinka, Hungarian fruit brandy. Try barack (apricot) at the Vörösmarty Square stalls, 5 minutes from the piers, before you board.","tip":"After the cruise, walk across the bridge to Clark Ádám tér and find the Zero Kilometre stone, the point Hungary measures its road distances from.","gmaps":"Széchenyi Chain Bridge, Budapest","short":"Chain Bridge","cc":"HU","z":12.4,"fz":14.600000000000001},"bastion":{"name":"Fisherman's Bastion & Matthias Church","alt":"Halászbástya · Mátyás-templom","type":"castle","country":"HU","region":"Buda Castle District · Budapest","ll":[19.0347,47.5023],"status":{"code":"weather","text":"Upper terrace free before about 9:00; cloud or fog may hide the sunrise."},"epithet":"Seven Towers of Dawn","lore":"Frigyes Schulek built this white terrace between 1895 and 1902, with seven towers for the seven Magyar tribes. Legend says that during the 1686 siege, cannon fire broke a wall of Matthias Church and revealed a hidden Madonna to Ottoman soldiers praying inside. The garrison lost heart, and Buda fell that same day.","quest":"Arrive by 06:45 on Friday, while the upper terrace is free and nearly empty. Watch the sky turn pink over Pest and the Danube as the sun rises around 07:06. Then walk around Matthias Church and see its diamond-patterned roof tiles in the first light.","time":"Fri 27 Nov · 06:40–08:15; sunrise about 07:06","light":"Sunrise about 07:06, east-south-east over Pest; first light about 06:30.","access":"Bus 16 from Deák Ferenc tér across the Chain Bridge to Dísz tér, then walk 8 minutes north along Tárnok utca. Or climb the stairs from Batthyány tér (M2), about 15 minutes.","loot":"Krémes (custard slice) at Ruszwurm, a café on Szentháromság utca since 1827. Come back once it opens later in the morning.","tip":"The sun comes up to the right of the Basilica dome. Late-November fog is common, so check the forecast the night before.","danger":"Stone stairs and terraces can be icy at dawn.","fee":"Upper terrace 1,700 HUF (about €4) from about 9:00 to 19:00; free before then.","gmaps":"Fisherman's Bastion, Szentháromság tér, Budapest","short":"Fisherman's Bastion","cc":"HU","z":11.9,"fz":14.100000000000001},"budacastle":{"name":"Buda Castle","alt":"Budavári Palota","type":"palace","country":"HU","region":"Buda Castle District · Budapest","ll":[19.0398,47.496],"status":{"code":"open","text":"Courtyards and terraces open and free; museums keep their own hours."},"epithet":"Palace of the Turul","lore":"A bronze Turul, the mythical falcon of the Magyars, guards the palace gate with a sword in its claws. Legend says a Turul came to Emese in a dream and foretold that kings would descend from her son Álmos. Centuries later, King Matthias held a famous Renaissance court on this hill.","quest":"Walk 10 minutes south from the Bastion along Tárnok utca to the palace. Find the bronze Turul by the gate, then the Matthias Fountain in a palace courtyard. Walk the terraces for views of the Chain Bridge and Pest in the low morning light. Museums inside keep their own hours.","time":"Fri 27 Nov · 08:15–11:00","light":"Low morning sun on the river-facing façade; soft light all day.","access":"From Fisherman's Bastion, walk 10 minutes south along Tárnok utca. From Pest, take bus 16 from Deák Ferenc tér to Dísz tér, then walk 3 minutes.","loot":"Rétes (strudel) with sour cherry (meggyes) or poppy seed (mákos) from a Castle District bakery.","tip":"The courtyards and river terraces are free. You only need a ticket for the museums, so the best views cost nothing.","fee":"Courtyards and terraces free; museums charge entry.","gmaps":"Buda Castle, Szent György tér 2, Budapest","short":"Buda Castle","cc":"HU","z":11.9,"fz":14.100000000000001},"citadella":{"name":"Gellért Hill & Citadella","alt":"Gellért-hegy · Citadella","type":"viewpoint","country":"HU","region":"Gellért Hill, Buda · Budapest","ll":[19.0463,47.487],"status":{"code":"open","text":"Reopened 5 Apr 2026; park and ramparts free. Gellért Bath below is closed."},"epithet":"The Palm-Bearer's Fortress","lore":"The hill takes its name from Bishop Gellért, who, legend says, was thrown from its slope by pagan rebels in 1046. After the 1848–49 revolution, the Habsburgs built the Citadella to keep their guns trained on the city. The Liberty Statue has held her palm leaf above the Danube since 1947.","quest":"Climb Gellért Hill around midday, when the low sun is behind you and lights Pest and Parliament to the north. Walk the free ramparts of the Citadella, reopened in April 2026, and stand below the Liberty Statue. On a clear day, consider a ticket for the Roof Garden 360 panorama.","time":"Fri 27 Nov · 11:30–13:30","light":"Midday sun behind you lights Pest and Parliament to the north.","access":"From Buda Castle, walk down to Döbrentei tér and up the path past the Saint Gellért statue, about 40 minutes. Or take bus 27 from Móricz Zsigmond körtér to Búsuló Juhász, then walk 8 minutes uphill.","loot":"Pogácsa (small savoury scones) from a bakery at the foot of the hill. Eat them on the ramparts.","tip":"Gellért Bath is closed for renovation until about 2028. For a Buda-side soak, Rudas Bath, a 16th-century Ottoman bath by Elisabeth Bridge, opens daily from 6:00.","danger":"Paths are steep and slippery when wet, and dark soon after 16:00. Carry a phone torch.","fee":"Park and ramparts free; the exhibition and Roof Garden 360 need a ticket.","gmaps":"Citadella, Gellért Hill, Budapest","short":"Gellért Hill","cc":"HU","z":11.6,"fz":13.8},"szechenyi":{"name":"Széchenyi Thermal Bath","alt":"Széchenyi Gyógyfürdő","type":"spa","country":"HU","region":"City Park, District XIV · Budapest","ll":[19.0825,47.5184],"status":{"code":"open","text":"Open Fri 27 Nov 07:00–22:00; outdoor pools steam in the winter air."},"epithet":"Palace of Steam and Stone","lore":"Opened in 1913, this yellow neo-Baroque palace in City Park is one of Europe's largest spa complexes. Its water rises from a well more than 1,200 metres deep at about 75 °C. In the steaming outdoor pool, locals have played chess for decades.","quest":"Arrive around 15:00 on Friday, take a locker, and head straight to the hot outdoor pool. Stay through sunset at about 15:57, when steam rises into the cold air and the lamps come on. Warm up in the indoor thermal pools and saunas between rounds. On Fridays it stays open until 22:00.","time":"Fri 27 Nov · 15:00–19:00 (open until 22:00)","light":"Dark from about 16:00; steam glows under the lamps.","access":"M1 (yellow line) from Vörösmarty tér or Deák Ferenc tér to Széchenyi fürdő, about 15 minutes. The entrance is 2 minutes' walk from the station.","loot":"Gundel palacsinta, a walnut crêpe with chocolate sauce, at Gundel restaurant beside the zoo, 5 minutes' walk. Many cafés in town serve it too.","tip":"Bring a swim cap if you want the outdoor lap pool; caps are required there. Your own flip-flops and towel save rental fees.","danger":"Wet floors are slippery, and the dash between pools is freezing. Lock up valuables and keep phones off the pool edge.","fee":"Locker ticket 14,800 HUF (about €37) on Fridays; cabin +1,000 HUF (about €2.50).","gmaps":"Széchenyi Thermal Bath, Állatkerti krt. 9-11, Budapest","short":"Széchenyi Bath","cc":"HU","z":11.4,"fz":13.600000000000001},"szimpla":{"name":"Szimpla Kert","alt":"","type":"bar","country":"HU","region":"Jewish Quarter, District VII · Budapest","ll":[19.0633,47.4969],"status":{"code":"open","text":"Open late on Friday; expect a queue at the door later in the night."},"epithet":"The Ruin Garden Tavern","lore":"Szimpla opened in 2002, and in 2004 its four owners saved a condemned building on Kazinczy utca, once homes and a stove factory, and moved in. Filled with junk-shop furniture and an old Trabant car, it is known as the first of Budapest's ruin bars.","quest":"Go after dinner on Friday, ideally by 21:00, and explore the rooms before the crowd peaks. Find the old Trabant, climb to the upper floor, and try a drink at a different bar in each room. Keep your coat on in the courtyard, because it can be close to freezing.","time":"Fri 27 Nov · from about 21:00","light":"Dim rooms lit by fairy lights, neon and old lamps.","access":"M2 (red line) to Astoria, then walk 6 minutes north-east. From Deák Ferenc tér it is about 10 minutes on foot.","loot":"A fröccs, Hungarian wine mixed with soda water, from any of the bars. Ask for a kisfröccs if you want a small one.","tip":"If the metro has stopped for the night, tram 6 on the Grand Boulevard runs all night, about 9 minutes' walk away.","danger":"Pickpockets work the crowded rooms. On the street, ignore friendly strangers who invite you to another bar; some are rip-off traps.","gmaps":"Szimpla Kert, Kazinczy utca 14, Budapest","short":"Szimpla Kert","cc":"HU","z":12.6,"fz":14.8},"markethall":{"name":"Great Market Hall","alt":"Központi Vásárcsarnok","type":"food","country":"HU","region":"Fővám tér, District IX · Budapest","ll":[19.059,47.4866],"status":{"code":"open","text":"Sat 28 Nov open from 06:00; stalls close by mid-afternoon."},"epithet":"The Paprika Cathedral","lore":"Samu Pecz designed this iron hall, which opened on 15 February 1897 as the city's great covered market. War left it badly damaged, and it was restored in the 1990s under its roof of coloured Zsolnay tiles from Pécs.","quest":"Go early on Saturday, before 9:00, when locals shop. Walk the ground floor for paprika, salami and pickles, then climb to the upper gallery for lángos and folk-craft stalls. Look down from the gallery over the whole iron hall. Saturday hours are short, so do not leave it late.","time":"Sat 28 Nov · 07:30–09:30","light":"Daylight through the iron-and-glass roof; best before 10:00.","access":"M4 (green line) or trams 47 and 49 to Fővám tér; the hall is at the stop. Or walk 15 minutes from Vörösmarty tér along Váci utca.","loot":"Lángos with sour cream and grated cheese at the upper-floor food stalls, then a bag of sweet paprika from the ground floor.","tip":"Take the stairs to the basement for pickle stalls (savanyúság) and fish counters, the quieter side of the market.","danger":"Pickpockets work the crowded upper gallery, especially around the food stalls.","fee":"Free entry","gmaps":"Great Market Hall, Vámház körút 1-3, Budapest","short":"Great Market Hall","cc":"HU","z":12.1,"fz":14.3},"vorosmarty":{"name":"Vörösmarty Square Christmas Market","alt":"Karácsonyi Vásár a Vörösmarty téren","type":"market","country":"HU","region":"Belváros, District V · Budapest","ll":[19.0504,47.4964],"status":{"code":"open","text":"Christmas market open daily since 13 Nov 2026."},"epithet":"The Poet's Winter Fair","lore":"The square honours Mihály Vörösmarty, whose poem Szózat is sung at state ceremonies alongside the national anthem. His Carrara-marble statue, unveiled in 1908, watches over the stalls. Behind it stands Gerbeaud, a café since 1858 and on this square since 1870.","quest":"Come for lunch on Saturday. Pick stuffed cabbage, sausages or goulash at the hot-food stalls, with a cup of mulled wine. Then browse the craft stalls for handmade gifts. If you pass on Thursday or Friday evening, come back after dark when the stall lights are on.","time":"Sat 28 Nov · 11:00–12:30; also Thu or Fri evening","light":"Daylight at lunch; stall lights glow from about 16:00.","access":"M1 to Vörösmarty tér, which stops on the square. Or walk 4 minutes from Deák Ferenc tér (M1, M2, M3).","loot":"Töltött káposzta (stuffed cabbage) or goulash in a bread bowl from the hot-food stalls.","tip":"For dessert, Café Gerbeaud on the square serves zserbó, the walnut-and-apricot slice named after Émile Gerbeaud, the Swiss confectioner who ran it.","danger":"Pickpockets work the dense crowds. Avoid exchange booths on nearby Váci utca; their rates are poor.","fee":"Free entry","opens":"2026-11-13","gmaps":"Vörösmarty tér, Budapest","short":"Vörösmarty Market","cc":"HU","z":12.6,"fz":14.8},"szentendre":{"name":"Szentendre","alt":"","type":"town","country":"HU","region":"Danube Bend · Pest County","ll":[19.0762,47.6676],"status":{"code":"open","text":"Optional side quest. HÉV H5 runs all day; daylight ends about 15:58."},"epithet":"Town of Painters and Spires","lore":"Serbian refugees fleeing the Ottoman wars settled here in 1690 and built the baroque church towers that still rise over the lanes. In the 1920s painters followed, and the little Danube town became an artists' colony.","quest":"Only if you have a free half-day. Take the HÉV north in the morning, wander the cobbled lanes and Fő tér, and see the Serbian Orthodox churches. Be back on the train before dark, around 16:00.","time":"Optional · half day, about 5 h with travel","light":"Short day; the lanes look best before 14:00.","access":"HÉV H5 from Batthyány tér (M2) to Szentendre, the last stop, about 40 minutes. Budapest tickets and passes cover only the ride to the city boundary, so buy an extension. Walk 10 minutes to Fő tér.","loot":"Marzipan figures from the Szabó Marzipan Museum and shop in the old town.","tip":"Climb the lane from Fő tér to Templom tér for a view over red roofs to the Danube.","gmaps":"Fő tér, Szentendre","short":"Szentendre","cc":"HU","z":7.9,"fz":11},"bud":{"name":"Budapest Airport (BUD)","alt":"Budapest Liszt Ferenc Nemzetközi Repülőtér · Ferihegy","type":"airport","country":"HU","region":"Ferihegy, District XVIII · Budapest","ll":[19.2609,47.4332],"status":{"code":"open","text":"Sat 28 Nov departure; allow 3 hours for security and exit checks."},"epithet":"The Final Gate","lore":"Locals still call it Ferihegy, after Ferenc Mayerffy, who owned this land and planted vineyards on it. In 2011, for Franz Liszt's 200th birthday, the airport took the composer's name. Its first main terminal, designed in 1939, looks like an aircraft from above.","quest":"Leave the city about 3.5 hours before take-off. Check in, pass security in SkyCourt, and follow signs to your gate. If your first flight leaves the Schengen area, passport control here records your exit in the EU Entry/Exit System. If you connect via a Schengen hub, that check happens there.","time":"Sat 28 Nov · at the terminal 3 h before take-off","light":"Sunset about 15:57; evening flights leave in darkness.","access":"100E bus from Deák Ferenc tér, about 40 minutes; buy the dedicated 100E ticket first. Or M3 to Kőbánya-Kispest, then bus 200E. A taxi takes about 30–40 minutes; book via Főtaxi or Bolt.","loot":"A bottle of Tokaji Aszú, the golden sweet wine of Tokaj, from the shops after security.","tip":"Terminal 2 has two check-in halls, 2A and 2B; screens show your airline's hall. Claiming a tax refund? Show the goods to customs before you check your bag.","danger":"Airport exchange booths give poor rates. Spend leftover forints in town or in the shops after security.","gmaps":"Budapest Ferenc Liszt International Airport Terminal 2","short":"Budapest Airport","cc":"HU","z":6.6,"fz":11}},"legs":{"vce-cortina":{"mode":"car","cc":["IT"],"label":"Venice Airport → Cortina","book":"Rental car with winter tyres or chains (compulsory from 15 Nov)","coords":[[12.35003,45.50675],[12.34853,45.5077],[12.35077,45.50944],[12.34711,45.5123],[12.34074,45.51153],[12.33951,45.51196],[12.33087,45.52084],[12.32701,45.52443],[12.3231,45.52737],[12.31889,45.52975],[12.31545,45.53125],[12.3118,45.53249],[12.30853,45.53333],[12.30459,45.53405],[12.29701,45.53461],[12.28394,45.53439],[12.28046,45.53494],[12.27761,45.53627],[12.27575,45.538],[12.27395,45.54104],[12.27281,45.5445],[12.2726,45.54756],[12.27486,45.56786],[12.27526,45.56951],[12.27656,45.57174],[12.27846,45.57348],[12.2904,45.57993],[12.29242,45.5815],[12.29322,45.58242],[12.29403,45.58382],[12.29473,45.58612],[12.29834,45.61003],[12.29896,45.61274],[12.30318,45.62432],[12.30385,45.62562],[12.30508,45.62738],[12.3096,45.63181],[12.31128,45.63386],[12.31292,45.63632],[12.31623,45.6422],[12.31671,45.64414],[12.31668,45.65068],[12.31771,45.65943],[12.31736,45.66163],[12.31637,45.66354],[12.3153,45.66481],[12.30845,45.67103],[12.30656,45.67317],[12.30519,45.67535],[12.30139,45.68273],[12.30086,45.68467],[12.30083,45.69046],[12.3002,45.69298],[12.29944,45.69452],[12.29198,45.70667],[12.29113,45.7094],[12.2909,45.71533],[12.2904,45.7177],[12.28919,45.7202],[12.28522,45.72623],[12.28405,45.72875],[12.28342,45.73153],[12.28213,45.74185],[12.27876,45.75309],[12.27858,45.75475],[12.27879,45.75688],[12.27943,45.75884],[12.28249,45.76608],[12.28662,45.77431],[12.28708,45.7757],[12.28841,45.78179],[12.28929,45.78388],[12.30471,45.8081],[12.30702,45.81116],[12
